<!doctype html><html><head><meta charset="utf8"><style>
@font-face{font-family:Orb;src:url(ORB)}@font-face{font-family:DM;src:url(DM)}@font-face{font-family:Syn;src:url(SYN)}
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1920px;background:#080510;overflow:hidden;color:#fff}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:140px 70px}
.brand{font-family:Orb;font-weight:800;font-size:44px;letter-spacing:2px;margin-bottom:20px}
.brand b{color:#9B5DE5}
.k{font-family:DM;font-size:30px;letter-spacing:5px;color:#9B5DE5;margin-bottom:40px}
.ring{position:relative;width:660px;height:660px;margin:10px 0 40px}
svg{transform:rotate(-90deg)}
.score{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.num{font-family:Orb;font-weight:800;font-size:200px;line-height:1;color:#fff;text-shadow:0 0 50px #9B5DE5aa}
.of{font-family:DM;font-size:34px;color:#8a7aa8;letter-spacing:3px}
.bars{width:100%;display:flex;flex-direction:column;gap:26px;margin-top:10px}
.row{display:flex;align-items:center;gap:24px}
.rl{font-family:Orb;font-weight:700;font-size:32px;width:260px}
.track{flex:1;height:26px;background:#1a1228;border-radius:999px;overflow:hidden}
.fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#7C3AED,#9B5DE5);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.rv{font-family:DM;font-size:30px;color:#9B5DE5;width:70px;text-align:right}
</style></head><body>
<div class="wrap">
 <div class="brand">BRAIN<b>·</b>SCORE</div>
 <div class="k" id="k">CALCULATING…</div>
 <div class="ring">
  <svg width="660" height="660"><circle cx="330" cy="330" r="300" stroke="#1a1228" stroke-width="34" fill="none"/>
   <circle id="arc" cx="330" cy="330" r="300" stroke="#9B5DE5" stroke-width="34" fill="none" stroke-linecap="round"
    stroke-dasharray="1885" stroke-dashoffset="1885" style="transition:stroke-dashoffset 2s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 16px #9B5DE5)"/></svg>
  <div class="score"><div class="num" id="num">0</div><div class="of">/ 1000</div></div>
 </div>
 <div class="bars">
  <div class="row"><span class="rl">MEMORY</span><div class="track"><div class="fill" id="f0"></div></div><span class="rv" id="v0">0</span></div>
  <div class="row"><span class="rl">FOCUS</span><div class="track"><div class="fill" id="f1"></div></div><span class="rv" id="v1">0</span></div>
  <div class="row"><span class="rl">SPEED</span><div class="track"><div class="fill" id="f2"></div></div><span class="rv" id="v2">0</span></div>
 </div>
</div>
<script>
const target=847;
setTimeout(()=>{document.getElementById('arc').style.strokeDashoffset=1885*(1-target/1000)},400);
let n=0;const iv=setInterval(()=>{n+=17;if(n>=target){n=target;clearInterval(iv);document.getElementById('k').textContent='TOP 8% TODAY';}document.getElementById('num').textContent=n},34);
const bars=[[0,92,'92'],[1,78,'78'],[2,85,'85']];
setTimeout(()=>bars.forEach(([i,w,v])=>{document.getElementById('f'+i).style.width=w+'%';let m=0;const b=setInterval(()=>{m+=3;if(m>=+v){m=+v;clearInterval(b)}document.getElementById('v'+i).textContent=m},40)}),700);
window.__ready=true;
</script></body></html>
