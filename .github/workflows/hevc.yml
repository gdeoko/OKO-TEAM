name: hevc-bake
on:
  push:
    branches: [hevc-bake]
    paths: ['hevc/**', '.github/workflows/hevc.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  encode:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          which ffmpeg || brew install ffmpeg
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -i videotoolbox || true
      - name: Encode HEVC with alpha
        run: |
          set -x
          mkdir -p hevc/out
          encode() {
            name="$1"; fps="$2"
            ffmpeg -y -framerate "$fps" -i "hevc/frames/$name/f%03d.png" \
              -c:v hevc_videotoolbox -allow_sw 1 -alpha_quality 0.75 -q:v 55 \
              -pix_fmt bgra -tag:v hvc1 -movflags +faststart \
              "hevc/out/mort_$name.mov" 2> "hevc/out/$name.log" \
              || { echo "== $name failed, log:"; tail -20 "hevc/out/$name.log"; }
          }
          encode jump 30
          encode atack 30
          encode fail 24
          encode idle 12
          ls -la hevc/out
      - name: Probe results
        run: |
          for f in hevc/out/*.mov; do
            echo "== $f"
            ffprobe -hide_banner -show_streams -select_streams v "$f" 2>/dev/null | grep -E 'codec_name|pix_fmt|width|height|nb_frames|alpha' || true
          done
      - name: Encode VP9 WebM with alpha
        run: |
          set -x
          encode_vp9() {
            name="$1"; fps="$2"
            ffmpeg -y -framerate "$fps" -i "hevc/frames/$name/f%03d.png" \
              -c:v libvpx-vp9 -pix_fmt yuva420p -b:v 0 -crf 34 -row-mt 1 -deadline good -cpu-used 2 \
              -auto-alt-ref 0 "hevc/out/mort_$name.webm" 2> "hevc/out/${name}_vp9.txt" \
              || { echo "== $name vp9 failed:"; tail -20 "hevc/out/${name}_vp9.txt"; }
          }
          encode_vp9 jump 30
          encode_vp9 atack 30
          encode_vp9 fail 24
          encode_vp9 idle 12
          ls -la hevc/out/*.webm
      - name: Verify alpha via AVFoundation
        run: |
          for f in hevc/out/mort_*.mov; do
            swift hevc/verify.swift "$f" || echo "verify failed for $f"
          done
          ls -la hevc/out/
      - name: Commit results
        run: |
          git config user.name "oko-team"
          git config user.email "okoteam.top@gmail.com"
          git pull --rebase origin hevc-bake || true
          git add -f hevc/out
          git commit -m "hevc encode results" || echo "nothing to commit"
          git push origin HEAD:hevc-bake
