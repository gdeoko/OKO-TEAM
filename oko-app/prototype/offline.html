<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OKO — оффлайн</title>
<meta name="theme-color" content="#0d0d0d">
<link rel="icon" href="/oko-icon-192.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0d0d0d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at top,rgba(154,255,0,.08),transparent 55%),#0d0d0d}
  .wrap{max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px}
  .logo{width:96px;height:96px;border-radius:24px;background:#0d0d0d;box-shadow:0 0 0 1px #222,0 0 40px rgba(154,255,0,.18);padding:10px;display:flex;align-items:center;justify-content:center}
  .logo img{width:100%;height:100%;object-fit:contain;display:block}
  h1{font-family:Impact,'Bebas Neue',sans-serif;font-weight:400;font-size:34px;letter-spacing:.05em;text-transform:uppercase;line-height:1;color:#fff}
  h1 span{color:#9AFF00}
  p{color:#9b9b9b;font-size:15px;line-height:1.55;max-width:340px}
  .icon-off{width:64px;height:64px;color:#9AFF00;opacity:.9}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 26px;border-radius:14px;background:#9AFF00;color:#000;font-weight:700;font-size:15px;letter-spacing:.02em;border:none;cursor:pointer;transition:transform .15s ease,box-shadow .2s ease;text-decoration:none;-webkit-tap-highlight-color:transparent}
  .btn:hover{box-shadow:0 0 26px rgba(154,255,0,.35)}
  .btn:active{transform:scale(.97)}
  .btn svg{width:18px;height:18px}
  .hint{font-size:12px;color:#68715f;letter-spacing:.04em;text-transform:uppercase}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff4d4d;box-shadow:0 0 0 0 rgba(255,77,77,.5);animation:puls 2.4s ease-in-out infinite;vertical-align:middle;margin-right:8px}
  @keyframes puls{0%,100%{box-shadow:0 0 0 0 rgba(255,77,77,.5)}50%{box-shadow:0 0 0 10px rgba(255,77,77,0)}}
  @media (prefers-color-scheme: light){
    html,body{background:#fff;color:#0d110a}
    body{background:radial-gradient(ellipse at top,rgba(110,200,0,.12),transparent 55%),#fff}
    .logo{background:#fff;box-shadow:0 0 0 1px #e1e8d9,0 0 40px rgba(110,200,0,.18)}
    p{color:#68715f}
    h1{color:#0d110a}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><img src="/oko-icon-512.png" alt="OKO"></div>
    <svg class="icon-off" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 42a60 60 0 0 1 84 0"/>
      <path d="M22 58a40 40 0 0 1 56 0"/>
      <circle cx="50" cy="78" r="6" fill="currentColor" stroke="none"/>
      <path d="M12 12 88 88" stroke="#ff4d4d" stroke-width="7"/>
    </svg>
    <h1><span>OKO</span> оффлайн</h1>
    <p><span class="dot"></span>Нет соединения с интернетом. Проверь Wi-Fi или мобильную сеть — и попробуй снова.</p>
    <button class="btn" type="button" onclick="location.reload()">
      <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M84 34A38 38 0 1 0 88 60"/><path d="M84 14v22H62"/></svg>
      Попробовать снова
    </button>
    <div class="hint">Кэшированные экраны OKO продолжают работать</div>
  </div>
  <script>
    /* авто-возврат в приложение, как только сеть вернулась */
    window.addEventListener('online', () => location.replace('/'));
  </script>
</body>
</html>
