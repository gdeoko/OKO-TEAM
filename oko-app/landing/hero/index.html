<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>OKO — hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--lime:#9AFF00;--bg:#080a08;--ink:#f2f5ee}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
  #app{position:fixed;inset:0;z-index:0}
  #app canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y}
  .ui{position:absolute;inset:0;z-index:5;pointer-events:none}
  .ui .nav span{pointer-events:auto}
  .brand{position:absolute;top:max(20px,env(safe-area-inset-top));left:24px;z-index:6}
  .brand .mark{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.14em;color:#fff;line-height:1}
  .brand .mark b{color:var(--lime)}
  .nav{position:absolute;top:24px;right:26px;display:flex;gap:24px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#8a938a}
  .nav span{cursor:pointer;transition:color .2s}.nav span:hover{color:#fff}
  .chip{position:absolute;right:14px;bottom:12px;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:#5c655c;border:1px solid #20241d;padding:4px 9px;border-radius:999px;background:rgba(8,10,8,.5)}
  @media(max-width:820px){.nav{display:none}}
  .hero{position:absolute;left:0;bottom:0;padding:0 24px max(30px,env(safe-area-inset-bottom)) 24px;max-width:640px}
  .hero h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(46px,9vw,116px);line-height:.9;letter-spacing:.01em;color:#fff;text-shadow:0 4px 40px rgba(0,0,0,.7)}
  .hero h1 span{color:var(--lime)}
  .hero .sub{margin-top:10px;font-size:clamp(15px,2.3vw,22px);font-weight:300;color:#e0e5da;max-width:30ch;text-shadow:0 2px 20px rgba(0,0,0,.7)}
  .hero .desc{margin-top:12px;font-size:clamp(12.5px,1.5vw,15px);font-weight:300;color:#b3b9b0;max-width:46ch;line-height:1.55;text-shadow:0 2px 20px rgba(0,0,0,.7)}
  /* portrait: hero text sits at the very bottom, eye is centered above (set in 3D) */
  @media(max-aspect-ratio:1/1){ .hero{max-width:none;right:0;text-align:left} .hero h1{font-size:clamp(44px,13vw,90px)} }
  /* wide/landscape: keep text on the LEFT half so it never touches the eye on the right */
  @media(min-aspect-ratio:3/2){ .hero{max-width:52%} .hero h1{font-size:clamp(40px,5.4vw,104px)} .hero .sub{max-width:26ch} .hero .desc{max-width:40ch} }
  .fade{opacity:0;transform:translateY(16px);animation:up .9s cubic-bezier(.16,1,.3,1) forwards}
  .d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}
  @keyframes up{to{opacity:1;transform:none}}
  .loader{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);z-index:9;transition:opacity .6s;pointer-events:none}
  .loader.hide{opacity:0}
  .loader i{width:34px;height:34px;border:2px solid #223022;border-top-color:var(--lime);border-radius:50%;animation:spin 1s linear infinite;display:block}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<div class="ui">
  <div class="brand fade"><span class="mark">ОКО<b>.</b></span></div>
  <div class="nav fade d1"><span>Возможности</span><span>Мини-аппы</span><span>Безопасность</span><span>О нас</span></div>
  <div class="hero">
    <h1 class="fade d1">ВИДИМ<br>ВСЁ <span>ГЛАВНОЕ</span></h1>
    <p class="sub fade d2">Супер-приложение, которое держит твою жизнь в фокусе.</p>
    <p class="desc fade d3">Оплаты, мини-приложения, ИИ-помощник и безопасность — в одном Telegram-окне.</p>
  </div>
  <div class="chip">сборка v0.3</div>
</div>
<div class="loader" id="loader"><i></i></div>

<script type="importmap">
{ "imports": {
  "three": "../js/vendor/three.module.min.js",
  "three/addons/": "../js/vendor/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const isMobile = matchMedia('(pointer:coarse)').matches || innerWidth < 760;
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({antialias:!isMobile, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile?1.5:2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070c, 0.04);
const DIST = 8;
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(0,0,DIST);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;
scene.add(new THREE.AmbientLight(0x2a352a, 0.7));
const key = new THREE.DirectionalLight(0xbfe6ff, 0.75); key.position.set(4,6,6); scene.add(key);

// ---------------- lightweight block wall (native, no Spline) ----------------
const WALL_Z = -7;
const COLS = isMobile? 20 : 30, ROWS = isMobile? 14 : 20, GAP = 1.15;
const blockGeo = new THREE.BoxGeometry(1,1,1);
const blockMat = new THREE.MeshStandardMaterial({color:0x0b0e0b, roughness:0.5, metalness:0.9, envMapIntensity:0.55});
const blocks = new THREE.InstancedMesh(blockGeo, blockMat, COLS*ROWS);
blocks.frustumCulled = false;
const seeds=[]; let bi=0; const dO=new THREE.Object3D();
for(let x=0;x<COLS;x++)for(let y=0;y<ROWS;y++){
  const px=(x-(COLS-1)/2)*GAP, py=(y-(ROWS-1)/2)*GAP, depth=0.4+Math.random()*1.7;
  dO.position.set(px,py,WALL_Z-depth/2+Math.random()*0.25);
  dO.scale.set(GAP*(0.86+Math.random()*0.1), GAP*(0.86+Math.random()*0.1), depth);
  dO.updateMatrix(); blocks.setMatrixAt(bi++,dO.matrix);
}
scene.add(blocks);
const glowLight = new THREE.PointLight(0x9AFF00, 0, 16, 2); glowLight.position.set(0,0,WALL_Z+2.4); scene.add(glowLight);
const spriteTex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  const rg=g.createRadialGradient(64,64,0,64,64,64);rg.addColorStop(0,'rgba(154,255,0,.85)');rg.addColorStop(1,'rgba(154,255,0,0)');
  g.fillStyle=rg;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);})();
const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:spriteTex,color:0x9AFF00,blending:THREE.AdditiveBlending,transparent:true,opacity:0,depthWrite:false}));
glow.scale.set(7,7,1); glow.position.z=WALL_Z+1.6; scene.add(glow);
const ripples=[];
function ripple(p){ const g=new THREE.RingGeometry(0.12,0.24,40);
  const m=new THREE.MeshBasicMaterial({color:0x9AFF00,transparent:true,opacity:.85,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false});
  const r=new THREE.Mesh(g,m); r.position.set(p.x,p.y,WALL_Z+1.7); scene.add(r); ripples.push({r,t:0}); }

// ---------------- liquid-glow noise patch ----------------
const NOISE = `
float hash(vec2 p){ p=fract(p*vec2(123.34,345.45)); p+=dot(p,p+34.345); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); }
float fbm(vec2 p){ float s=0.0,a=0.5; for(int i=0;i<4;i++){ s+=a*vnoise(p); p*=2.02; a*=0.5;} return s; }
`;
function liquify(mat){
  mat.onBeforeCompile = (sh)=>{
    sh.uniforms.uTime = {value:0};
    mat.userData.sh = sh;
    sh.fragmentShader = 'uniform float uTime;\n'+NOISE+sh.fragmentShader;
    sh.fragmentShader = sh.fragmentShader.replace('#include <emissivemap_fragment>',
      `#include <emissivemap_fragment>
       vec2 uvw = vMapUv;
       float w = fbm(uvw*2.6 + vec2(uTime*0.05, uTime*0.035));
       float f = fbm(uvw*5.5 + w*1.5 - vec2(uTime*0.045, uTime*0.02));
       float flow = 0.30 + 1.35*smoothstep(0.12,0.9,f);
       totalEmissiveRadiance *= flow;`);
  };
  mat.customProgramCacheKey = ()=> 'okoliquid';
}

// ---------------- OKO eye ----------------
let eye=null, eyeGroup=new THREE.Group(); scene.add(eyeGroup);
let eyeW0=1.9, eyeH0=1.32, eyeMats=[];
new GLTFLoader().load('../assets/oko-eye.glb', gltf=>{
  eye=gltf.scene;
  const box=new THREE.Box3().setFromObject(eye); const size=box.getSize(new THREE.Vector3()), c=box.getCenter(new THREE.Vector3());
  eye.position.sub(c); eyeW0=size.x; eyeH0=size.y;
  eye.traverse(n=>{ if(n.isMesh){
    const old=n.material;
    const m=new THREE.MeshPhysicalMaterial({ map:old.map||null, color:0x0c120c, roughness:0.24, metalness:0.2,
      clearcoat:1.0, clearcoatRoughness:0.2, envMapIntensity:1.25,
      emissive:0x9AFF00, emissiveMap:old.map||null, emissiveIntensity:1.0,
      iridescence:1.0, iridescenceIOR:1.35, iridescenceThicknessRange:[140,430], sheen:0.5, sheenColor:new THREE.Color(0x9AFF00) });
    liquify(m); n.material=m; eyeMats.push(m);
  }});
  eyeGroup.add(eye);
  layout();
  document.getElementById('loader').classList.add('hide');
  window.__eyeReady=true;
});

// composer / bloom
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(1,1), 0.62, 0.6, 0.62);
composer.addPass(bloom);

// ---------------- responsive layout ----------------
let target={scale:1,x:0,y:0};
function viewSize(){ const vH=2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*DIST; return {vW:vH*camera.aspect, vH}; }
function layout(){
  const {vW,vH}=viewSize(); const a=camera.aspect;
  let maxW,maxH,x,y;
  if(a < 0.85){                     // портрет (телефон вертикально) — глаз по центру, сверху
    maxW=vW*0.78; maxH=vH*0.40; x=0; y=vH*0.16;
  } else if(a > 1.5){               // широкий (ПК/ландшафт) — глаз справа
    maxW=vW*0.46; maxH=vH*0.78; x=vW*0.24; y=vH*0.02;
  } else {                          // планшет/квадрат — глаз правее центра
    maxW=vW*0.62; maxH=vH*0.60; x=vW*0.14; y=vH*0.06;
  }
  const s=Math.min(maxW/eyeW0, maxH/eyeH0);
  target={scale:s, x, y};
}
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h); composer.setSize(w,h);
  camera.aspect=w/h; camera.updateProjectionMatrix(); layout();
}
addEventListener('resize',resize); resize();

// pointer
const pointer=new THREE.Vector2(0,0), pWall=new THREE.Vector3();
const ray=new THREE.Raycaster(), wallPlane=new THREE.Plane(new THREE.Vector3(0,0,1),-WALL_Z);
function moveTo(cx,cy){ pointer.x=(cx/innerWidth)*2-1; pointer.y=-(cy/innerHeight)*2+1;
  ray.setFromCamera(pointer,camera); ray.ray.intersectPlane(wallPlane,pWall); }
addEventListener('pointermove',e=>moveTo(e.clientX,e.clientY),{passive:true});
addEventListener('pointerdown',e=>{ moveTo(e.clientX,e.clientY); ripple(pWall.clone()); pulse=1; });
window.__tap=()=>{ripple(pWall.clone());pulse=1;};

let pulse=0, hidden=false;
document.addEventListener('visibilitychange',()=>hidden=document.hidden);
const clock=new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  if(hidden) return;
  const dt=Math.min(clock.getDelta(),0.05), t=clock.getElapsedTime();
  glowLight.position.lerp(new THREE.Vector3(pWall.x,pWall.y,WALL_Z+2.4),0.14);
  glowLight.intensity += ((5.5+pulse*9)-glowLight.intensity)*0.1;
  glow.position.lerp(new THREE.Vector3(pWall.x,pWall.y,WALL_Z+1.6),0.14);
  glow.material.opacity += ((0.42+pulse*0.5)-glow.material.opacity)*0.1;
  pulse*=0.92;
  for(let i=ripples.length-1;i>=0;i--){const o=ripples[i];o.t+=dt;const s=1+o.t*11;o.r.scale.set(s,s,s);
    o.r.material.opacity=Math.max(0,.85-o.t*1.35); if(o.t>.7){scene.remove(o.r);o.r.geometry.dispose();o.r.material.dispose();ripples.splice(i,1);} }
  if(eye){
    // ease to responsive target + breathing float (no blink)
    const br=1+Math.sin(t*0.9)*0.03;
    eyeGroup.scale.lerp(new THREE.Vector3(target.scale*br,target.scale*br,target.scale*br),0.1);
    eyeGroup.position.x += (target.x-eyeGroup.position.x)*0.1;
    eyeGroup.position.y += ((target.y+Math.sin(t*0.8)*0.12)-eyeGroup.position.y)*0.1;
    eyeGroup.rotation.y += (pointer.x*0.3-eyeGroup.rotation.y)*0.07;
    eyeGroup.rotation.x += (-pointer.y*0.2 + Math.sin(t*0.6)*0.02 - eyeGroup.rotation.x)*0.07;
    eyeGroup.rotation.z = Math.sin(t*0.5)*0.015;
    for(const m of eyeMats){ if(m.userData.sh) m.userData.sh.uniforms.uTime.value=t;
      m.emissiveIntensity=0.9+pulse*0.5; }
  }
  composer.render();
}
frame();
window.__ready=true;
</script>
</body>
</html>
