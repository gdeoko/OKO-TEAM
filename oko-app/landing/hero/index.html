<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>OKO — hero</title>
<!-- PERF: cap DPR ONLY for the heavy Spline bg; keep the real DPR for the crisp eye -->
<script>
(function(){ try{
  window.__realDPR = window.devicePixelRatio || 1;
  var coarse = matchMedia('(pointer:coarse)').matches || innerWidth < 760;
  // mobile viewport is small -> 1.5x is sharp AND still light; desktop stays 1.0 (big viewport)
  var cap = coarse ? 1.5 : 1.0;
  Object.defineProperty(window,'devicePixelRatio',{configurable:true,get:function(){return cap;}});
}catch(e){} })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--lime:#9AFF00;--bg:#080a08;--ink:#f2f5ee}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
  #bg{position:fixed;inset:0;z-index:0;background:radial-gradient(120% 90% at 60% 40%,#12160f,#080a08 70%,#050705)}
  #bg spline-viewer{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* tall screens: render the Spline canvas slightly larger than the viewport (native pixels = sharp, no CSS-scale blur) to cover without crop-gaps */
  @media(max-aspect-ratio:4/3){ #bg spline-viewer{width:112%;height:112%;left:-6%;top:-6%;right:auto;bottom:auto} }
  @media(max-aspect-ratio:3/4){ #bg spline-viewer{width:124%;height:124%;left:-12%;top:-12%;right:auto;bottom:auto} }
  /* EYE — SOLID (alpha transparent canvas, no blend); crisp full-res */
  #app{position:fixed;inset:0;z-index:2;pointer-events:none}
  #app canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
  .ui{position:absolute;inset:0;z-index:5;pointer-events:none}
  .ui .nav span{pointer-events:auto}
  .brand{position:absolute;top:max(20px,env(safe-area-inset-top));left:24px;z-index:6}
  .brand .mark{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.14em;color:#fff;line-height:1}
  .brand .mark b{color:var(--lime)}
  .nav{position:absolute;top:24px;right:26px;display:flex;gap:24px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#8a938a}
  .nav span{cursor:pointer;transition:color .2s}.nav span:hover{color:#fff}
  .chip{position:absolute;right:14px;bottom:12px;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:#5c655c;border:1px solid #20241d;padding:4px 9px;border-radius:999px;background:rgba(8,10,8,.5)}
  @media(max-width:820px){.nav{display:none}}
  .hero{position:absolute;left:0;bottom:0;padding:0 24px max(30px,env(safe-area-inset-bottom)) 24px;max-width:640px;z-index:5}
  .hero h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(46px,9vw,116px);line-height:.9;letter-spacing:.01em;color:#fff;text-shadow:0 4px 40px rgba(0,0,0,.7)}
  .hero h1 span{color:var(--lime)}
  .hero .sub{margin-top:10px;font-size:clamp(15px,2.3vw,22px);font-weight:300;color:#e0e5da;max-width:30ch;text-shadow:0 2px 20px rgba(0,0,0,.7)}
  .hero .desc{margin-top:12px;font-size:clamp(12.5px,1.5vw,15px);font-weight:300;color:#b3b9b0;max-width:46ch;line-height:1.55;text-shadow:0 2px 20px rgba(0,0,0,.7)}
  @media(max-aspect-ratio:1/1){ .hero{max-width:none;right:0} .hero h1{font-size:clamp(44px,13vw,90px)} }
  @media(min-aspect-ratio:3/2){ .hero{max-width:52%} .hero h1{font-size:clamp(40px,5.4vw,104px)} .hero .sub{max-width:26ch} .hero .desc{max-width:40ch} }
  .fade{opacity:0;transform:translateY(16px);animation:up .9s cubic-bezier(.16,1,.3,1) forwards}
  .d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}
  @keyframes up{to{opacity:1;transform:none}}
  .loader{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);z-index:9;transition:opacity .6s;pointer-events:none}
  .loader.hide{opacity:0}
  .loader i{width:34px;height:34px;border:2px solid #223022;border-top-color:var(--lime);border-radius:50%;animation:spin 1s linear infinite;display:block}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="bg">
  <spline-viewer url="https://prod.spline.design/Slk6b8kz3LRlKiyk/scene.splinecode" loading-anim-type="none"></spline-viewer>
</div>
<div id="app"></div>
<div class="ui">
  <div class="brand fade"><span class="mark">ОКО<b>.</b></span></div>
  <div class="nav fade d1"><span>Возможности</span><span>Мини-аппы</span><span>Безопасность</span><span>О нас</span></div>
  <div class="hero">
    <h1 class="fade d1">ВИДИМ<br>ВСЁ <span>ГЛАВНОЕ</span></h1>
    <p class="sub fade d2">Супер-приложение, которое держит твою жизнь в фокусе.</p>
    <p class="desc fade d3">Оплаты, мини-приложения, ИИ-помощник и безопасность — в одном Telegram-окне.</p>
  </div>
  <div class="chip">сборка v1.4</div>
</div>
<div class="loader" id="loader"><i></i></div>

<script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.48/build/spline-viewer.js"></script>

<script type="importmap">
{ "imports": {
  "three": "../js/vendor/three.module.min.js",
  "three/addons/": "../js/vendor/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const app = document.getElementById('app');
// EYE renders at REAL device pixel ratio (max quality), independent of the capped bg
const eyeDPR = Math.min(window.__realDPR || devicePixelRatio || 1, 2.5);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, powerPreference:'high-performance'});
renderer.setPixelRatio(eyeDPR);
renderer.setClearColor(0x000000, 0);            // transparent -> eye is SOLID, bg shows around it
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.98;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const DIST = 16;                                   // far + narrow FOV = flat, telephoto-like projection
const camera = new THREE.PerspectiveCamera(24, 1, 0.1, 100);  // no perspective skew for off-centre eye
camera.position.set(0,0,DIST);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;
scene.add(new THREE.AmbientLight(0x556655, 0.7));
const key = new THREE.DirectionalLight(0xecfff0, 1.0); key.position.set(4,6,6); scene.add(key);
const rim = new THREE.DirectionalLight(0x22DD00, 0.55); rim.position.set(-4,-2,3); scene.add(rim);
const eyeLight=new THREE.PointLight(0xd6ffcf, 4.5, 24, 2); scene.add(eyeLight);   // softer travelling highlight (less white blow-out)

// soft neon halo (glow) — additive sprite behind the eye
const haloTex=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  const rg=g.createRadialGradient(128,128,0,128,128,128);
  rg.addColorStop(0,'rgba(60,230,20,.8)');rg.addColorStop(.35,'rgba(34,221,0,.4)');rg.addColorStop(1,'rgba(34,221,0,0)');
  g.fillStyle=rg;g.fillRect(0,0,256,256);return new THREE.CanvasTexture(c);})();
const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:haloTex,color:0x22DD00,blending:THREE.AdditiveBlending,transparent:true,opacity:.38,depthWrite:false,depthTest:false}));

let eye=null, eyeGroup=new THREE.Group(); scene.add(eyeGroup);
let eyeW0=1.9, eyeH0=1.32, eyeMats=[];
new GLTFLoader().load('../assets/oko-eye.glb', gltf=>{
  eye=gltf.scene;
  const box=new THREE.Box3().setFromObject(eye); const size=box.getSize(new THREE.Vector3()), c=box.getCenter(new THREE.Vector3());
  eye.position.sub(c); eyeW0=size.x; eyeH0=size.y;
  eye.traverse(n=>{ if(n.isMesh){ const old=n.material;
    const m=new THREE.MeshPhysicalMaterial({ map:old.map||null, color:0x0c110c, roughness:0.09, metalness:0.0,
      clearcoat:1.0, clearcoatRoughness:0.04, envMapIntensity:2.2, ior:1.5,
      emissive:0x22DD00, emissiveMap:old.map||null, emissiveIntensity:0.55,
      iridescence:0.3, iridescenceIOR:1.3, iridescenceThicknessRange:[220,540] });
    n.material=m; eyeMats.push(m);
  }});
  halo.position.set(0,0,-0.25); halo.scale.set(3.6,3.6,1); eyeGroup.add(halo);
  eyeGroup.add(eye); layout();
  document.getElementById('loader').classList.add('hide'); window.__eyeReady=true;
});

// responsive layout
let target={scale:1,x:0,y:0};
function viewSize(){ const vH=2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*DIST; return {vW:vH*camera.aspect,vH}; }
function layout(){ const {vW,vH}=viewSize(); const a=camera.aspect; let maxW,maxH,x,y;
  if(a<0.85){ maxW=vW*0.78; maxH=vH*0.40; x=0; y=vH*0.16; }
  else if(a>1.5){ maxW=vW*0.42; maxH=vH*0.74; x=vW*0.18; y=vH*0.02; }
  else { maxW=vW*0.62; maxH=vH*0.60; x=vW*0.14; y=vH*0.06; }
  target={scale:Math.min(maxW/eyeW0,maxH/eyeH0), x, y}; }
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h);
  camera.aspect=w/h; camera.updateProjectionMatrix(); layout(); }
addEventListener('resize',resize); resize();

const pointer=new THREE.Vector2(0,0);
let pulse=0, hidden=false;
const clock=new THREE.Clock();
// look-follow with auto-return to center: eye follows the finger/cursor while active,
// then smoothly returns to face the viewer when you release / stop moving. All devices.
let lastMove=-99, released=true;
function setPtr(e){ pointer.x=(e.clientX/innerWidth)*2-1; pointer.y=-(e.clientY/innerHeight)*2+1; lastMove=clock.getElapsedTime(); released=false; }
addEventListener('pointermove',setPtr,{passive:true});
addEventListener('pointerdown',e=>{ setPtr(e); pulse=1; });
addEventListener('pointerup',()=>{ released=true; });
addEventListener('pointercancel',()=>{ released=true; });
addEventListener('pointerleave',()=>{ released=true; });
addEventListener('blur',()=>{ released=true; });
document.addEventListener('visibilitychange',()=>{hidden=document.hidden; if(hidden) released=true;});
function frame(){
  requestAnimationFrame(frame);
  if(hidden) return;
  const t=clock.getElapsedTime();
  pulse*=0.92;
  if(eye){
    const br=1+Math.sin(t*0.9)*0.03;
    eyeGroup.scale.lerp(new THREE.Vector3(target.scale*br,target.scale*br,target.scale*br),0.1);
    eyeGroup.position.x += (target.x-eyeGroup.position.x)*0.1;
    eyeGroup.position.y += ((target.y+Math.sin(t*0.8)*0.12)-eyeGroup.position.y)*0.1;
    // flat projection -> eye sits upright with NO base rotation; only follows the pointer, returns to 0 (straight) at rest
    const idle = released || (t - lastMove > 1.1);
    const lx = idle ? 0 : pointer.x, ly = idle ? 0 : pointer.y;
    // follow the finger — natural (non-mirrored): finger right -> lean right, finger up -> look up
    eyeGroup.rotation.y += ( lx*0.46 - eyeGroup.rotation.y)*0.06;
    eyeGroup.rotation.x += (-ly*0.36 + Math.sin(t*0.6)*0.012 - eyeGroup.rotation.x)*0.06;
    eyeGroup.rotation.z += (0 - eyeGroup.rotation.z)*0.05;   // keep dead-straight (no roll)
    eyeLight.position.set(eyeGroup.position.x+Math.cos(t*0.55)*3.2, eyeGroup.position.y+Math.sin(t*0.5)*2.2+0.6, 4.2);
    halo.material.opacity += ((0.5+pulse*0.5)-halo.material.opacity)*0.1;
    // subtle living glow via emissive pulse (liquid-glass feel from the travelling specular light)
    for(const m of eyeMats){ m.emissiveIntensity = 0.5 + Math.sin(t*1.4)*0.1 + pulse*0.35; }
  }
  renderer.render(scene,camera);
}
frame();
window.__ready=true;
</script>
</body>
</html>
