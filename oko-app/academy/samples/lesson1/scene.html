<!doctype html><html lang="ru"><head><meta charset="utf-8">
<title>OKO Academy — Карта нейросетей 2026</title>
<style>
@font-face{font-family:'Mont';src:local('Montserrat');}
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --lime:#9AFF00; --lime2:#c6ff5a; --ink:#070a04; --ink2:#0e1408;
  --white:#f4f8ee; --muted:#9aa891; --card:#121a0b; --line:#2b3a17;
  --f:'Montserrat','Arial Black',system-ui,sans-serif;
}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--ink);
  font-family:var(--f);color:var(--white);-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden}
#bg{position:absolute;inset:0;z-index:0}
#vign{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 42%,transparent 40%,rgba(0,0,0,.55) 100%)}
#grain{position:absolute;inset:0;z-index:2;opacity:.05;pointer-events:none;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
/* watermark */
#wm{position:absolute;top:40px;left:52px;z-index:40;display:flex;align-items:center;gap:15px;opacity:.92}
#wm img{width:52px;height:52px;filter:drop-shadow(0 0 14px rgba(154,255,0,.55))}
#wm .t{font-weight:800;letter-spacing:.02em;font-size:24px;line-height:1}
#wm .t b{color:var(--lime)}
#wm .t small{display:block;font-size:12px;letter-spacing:.42em;color:var(--muted);font-weight:700;margin-top:3px}
/* HUD */
#hud{position:absolute;left:0;right:0;bottom:0;z-index:40}
#bar{height:6px;width:0;background:linear-gradient(90deg,#5f9e00,var(--lime));box-shadow:0 0 18px rgba(154,255,0,.7)}
#pips{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);display:flex;gap:12px}
#pips i{width:44px;height:6px;border-radius:4px;background:#202a13;transition:.4s}
#pips i.on{background:var(--lime);box-shadow:0 0 12px rgba(154,255,0,.6)}
#chap{position:absolute;bottom:64px;left:56px;font-size:17px;letter-spacing:.32em;color:var(--muted);font-weight:700;text-transform:uppercase}
#chap b{color:var(--lime)}
/* scenes */
.scene{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 150px;opacity:0;visibility:hidden}
.kicker{font-size:22px;letter-spacing:.4em;font-weight:800;color:var(--lime);text-transform:uppercase}
.h1{font-size:130px;line-height:.94;font-weight:900;letter-spacing:-.015em;text-align:center;
  text-shadow:0 0 60px rgba(154,255,0,.18)}
.h1 .l{color:var(--lime)}
.h2{font-size:96px;line-height:.96;font-weight:900;letter-spacing:-.01em;text-align:center}
.h2 .l{color:var(--lime)}
.lead{font-size:40px;color:#d6e2c8;font-weight:600;text-align:center;max-width:1300px;line-height:1.25}
.lead .l{color:var(--lime);font-weight:800}
.small{font-size:26px;color:var(--muted);font-weight:600}
/* intro logo */
.intrologo{width:230px;height:230px;filter:drop-shadow(0 0 46px rgba(154,255,0,.55))}
/* family chips (scene2) */
.fam{position:absolute;display:flex;flex-direction:column;align-items:center;gap:14px;width:210px}
.fam .disc{width:130px;height:130px;border-radius:34px;background:linear-gradient(155deg,#1b2b09,#0b1104);
  border:2px solid var(--line);display:flex;align-items:center;justify-content:center;
  box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);position:relative}
.fam.hot .disc{border-color:var(--lime);box-shadow:0 0 42px rgba(154,255,0,.35),inset 0 1px 0 rgba(255,255,255,.06)}
.fam .disc svg{width:66px;height:66px;stroke:var(--lime);fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.fam .nm{font-size:26px;font-weight:800;letter-spacing:.01em}
#constell{position:absolute;inset:0;z-index:19;pointer-events:none}
/* model cards (scene3) */
.cards{display:flex;gap:46px;perspective:1600px;margin-top:20px}
.card{width:430px;height:520px;border-radius:30px;background:linear-gradient(165deg,var(--card),#0a0f05);
  border:1px solid var(--line);padding:44px 40px;transform-style:preserve-3d;position:relative;overflow:hidden;
  box-shadow:0 30px 70px rgba(0,0,0,.5)}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 40% at 50% 0%,rgba(154,255,0,.14),transparent 70%)}
.card .rank{position:absolute;top:28px;right:34px;font-size:80px;font-weight:900;color:transparent;-webkit-text-stroke:2px #35491d}
.card .nm{font-size:52px;font-weight:900;margin-top:10px}
.card .tag{display:inline-block;margin-top:14px;font-size:22px;font-weight:800;color:var(--ink);background:var(--lime);
  padding:8px 18px;border-radius:12px}
.card ul{margin-top:30px;list-style:none;display:flex;flex-direction:column;gap:20px}
.card li{font-size:27px;color:#d9e6cb;font-weight:600;display:flex;gap:14px;align-items:flex-start;opacity:0}
.card li b{color:var(--lime)}
.card li i{color:var(--lime);font-style:normal;font-weight:900;font-size:26px;margin-top:2px}
.verdict{margin-top:44px;font-size:34px;font-weight:800;color:#dce8cd;background:#0e1508;border:1px solid var(--line);
  padding:20px 40px;border-radius:18px;opacity:0}
.verdict .l{color:var(--lime)}
/* image mosaic (scene4) */
.mosaic{display:grid;grid-template-columns:repeat(4,235px);grid-auto-rows:150px;gap:16px;margin-top:26px}
.tile{border-radius:18px;overflow:hidden;position:relative;background:#0e1508;border:1px solid var(--line);
  display:flex;align-items:flex-end;padding:16px;opacity:0}
.tile .nm{font-size:24px;font-weight:800;position:relative;z-index:2}
.tile .pr{position:absolute;top:14px;right:16px;font-size:22px;font-weight:900;color:var(--lime);z-index:2}
.tile .gl{position:absolute;inset:0;opacity:.5}
/* video strip (scene5) */
.lb{position:absolute;left:0;right:0;height:120px;background:#000;z-index:22}
.filmrow{display:flex;gap:22px;margin-top:20px}
.vcard{width:390px;border-radius:22px;background:linear-gradient(165deg,var(--card),#0a0f05);border:1px solid var(--line);
  padding:34px 32px;opacity:0}
.vcard .nm{font-size:44px;font-weight:900}
.vcard .d{font-size:25px;color:#cfe0bd;font-weight:600;margin-top:12px;line-height:1.25}
.vcard .price{font-size:30px;font-weight:900;color:var(--lime);margin-top:18px}
.gauge{margin:0 auto}
/* code/voice/music (scene6) */
.tri{display:flex;gap:34px;margin-top:24px}
.panel{width:400px;height:470px;border-radius:26px;background:linear-gradient(165deg,var(--card),#0a0f05);
  border:1px solid var(--line);padding:34px;opacity:0;position:relative;overflow:hidden}
.panel .pt{font-size:34px;font-weight:900}
.panel .ps{font-size:22px;color:var(--muted);font-weight:700;margin-top:4px;letter-spacing:.02em}
.codeline{font-family:'DejaVu Sans Mono',monospace;font-size:20px;color:#bfe38a;margin-top:16px;white-space:nowrap;overflow:hidden}
.codeline .k{color:var(--lime)}
.wave{position:absolute;left:34px;right:34px;bottom:60px;height:150px}
.eq{position:absolute;left:34px;right:34px;bottom:56px;height:170px;display:flex;align-items:flex-end;gap:10px}
.eq b{flex:1;background:linear-gradient(180deg,var(--lime),#4f8a00);border-radius:6px 6px 0 0;height:20%}
.chips{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.chip2{font-size:22px;font-weight:800;padding:9px 16px;border-radius:12px;background:#0e1508;border:1px solid var(--line);color:#d9e6cb}
.chip2 b{color:var(--lime)}
/* лазейка (scene7) */
#spot{position:absolute;inset:0;z-index:18;opacity:0;pointer-events:none;
  background:radial-gradient(40% 40% at 50% 46%,rgba(154,255,0,.22),transparent 70%)}
.cmp{display:flex;align-items:flex-end;gap:90px;margin-top:36px;height:360px}
.colwrap{display:flex;flex-direction:column;align-items:center;gap:18px}
.colwrap .cap{font-size:28px;font-weight:800;color:#d9e6cb}
.col{width:150px;border-radius:16px 16px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:18px;
  font-size:34px;font-weight:900}
.col.bad{background:linear-gradient(180deg,#3a2020,#1a0f0f);color:#ff8a8a;border:1px solid #4a2626;border-bottom:none}
.col.good{background:linear-gradient(180deg,var(--lime),#4f8a00);color:var(--ink);border:1px solid var(--lime);border-bottom:none}
.stamp{position:absolute;font-size:50px;font-weight:900;color:var(--lime);border:5px solid var(--lime);
  padding:14px 30px;border-radius:20px;transform:rotate(-9deg);opacity:0;text-transform:uppercase;
  box-shadow:0 0 50px rgba(154,255,0,.4);text-shadow:0 0 24px rgba(154,255,0,.4);right:78px;top:452px}
/* formula (scene8) */
.formula{display:flex;align-items:center;gap:34px;margin-top:10px}
.tok{font-size:56px;font-weight:900;padding:26px 42px;border-radius:20px;background:#0e1508;border:2px solid var(--line);opacity:0}
.tok.l{color:var(--lime);border-color:var(--lime);box-shadow:0 0 34px rgba(154,255,0,.25)}
.arrow{font-size:60px;color:var(--lime);font-weight:900;opacity:0}
.recap{display:grid;grid-template-columns:repeat(2,540px);gap:18px 40px;margin-top:56px}
.rrow{display:flex;align-items:center;gap:18px;font-size:32px;font-weight:700;color:#d9e6cb;opacity:0}
.rrow .ic{width:44px;height:44px;border-radius:12px;background:var(--lime);color:var(--ink);display:flex;
  align-items:center;justify-content:center;font-weight:900;font-size:28px;flex:none}
.rrow b{color:var(--lime)}
/* outro */
.outrologo{width:250px;height:250px;filter:drop-shadow(0 0 54px rgba(154,255,0,.6))}
.cta{margin-top:30px;font-size:32px;font-weight:800;color:var(--ink);background:var(--lime);padding:18px 40px;border-radius:16px;
  box-shadow:0 14px 40px rgba(154,255,0,.35);opacity:0}
</style></head>
<body><div id="stage">
  <canvas id="bg"></canvas>
  <canvas id="constell"></canvas>
  <div id="spot"></div>
  <div id="vign"></div><div id="grain"></div>
  <div id="wm"><img src="assets/logo.png"><div class="t"><b>OKO</b><small>АКАДЕМИЯ</small></div></div>
  <div id="scenes"></div>
  <div id="hud"><div id="chap"></div><div id="pips"></div><div id="bar"></div></div>
  <div id="leader" style="position:absolute;inset:0;z-index:999;background:#000"></div>
</div>
<script src="lib/gsap.min.js"></script>
<script>
const SEG=[{"id":"s1","start":0.0,"end":28.2},{"id":"s2","start":28.75,"end":56.926},{"id":"s3","start":57.426,"end":90.282},{"id":"s4","start":90.782,"end":120.686},{"id":"s5","start":121.186,"end":146.89},{"id":"s6","start":147.39,"end":170.526},{"id":"s7","start":171.026,"end":198.026},{"id":"s8","start":198.526,"end":223.318},{"id":"s9","start":223.818,"end":236.922}];
const TOTAL=237.4;
const CH=["Вступление","Карта · 7 семей","Текст","Картинки","Видео","Код · Озвучка · Музыка","Лазейка","Формула","Итог"];
const $=(s,r=document)=>r.querySelector(s); const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};

/* ---------- living GRID background (glowing cells, ripple waves) ---------- */
let hueRef={h:.23}; // ~lime hue (0.23*360≈83)
let bgctx,GW=1920,GH=1080,CELL=78,ripples=[],nextRip=0,ambient=[],lastSeg=-1;
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function initBG(){
  const cv=$('#bg');cv.width=GW;cv.height=GH;bgctx=cv.getContext('2d');
  const cols=Math.ceil(GW/CELL)+1,rows=Math.ceil(GH/CELL)+1;
  for(let i=0;i<30;i++)ambient.push({c:Math.floor(Math.random()*cols),r:Math.floor(Math.random()*rows),
    ph:Math.random()*6.28,sp:0.4+Math.random()*0.9});
}
function spawnRipple(t,gx,gy){
  const cols=Math.ceil(GW/CELL),rows=Math.ceil(GH/CELL);
  const x=(gx==null?Math.floor(Math.random()*cols):gx)*CELL+CELL/2;
  const y=(gy==null?Math.floor(Math.random()*rows):gy)*CELL+CELL/2;
  ripples.push({x,y,t0:t}); if(ripples.length>9)ripples.shift();
}
function renderBG(t){
  if(!bgctx)return; const ctx=bgctx; ctx.clearRect(0,0,GW,GH);
  const hue=hueRef.h*360;
  const drift=Math.sin(t*0.05)*9, driftY=Math.cos(t*0.045)*7;
  const cols=Math.ceil(GW/CELL)+1,rows=Math.ceil(GH/CELL)+1;
  // scene-change pulse from center
  let cs=SEG.findIndex(s=>t>=s.start&&t<s.end); if(cs<0)cs=t<0?0:SEG.length-1;
  if(cs!==lastSeg){lastSeg=cs; spawnRipple(t,Math.floor(cols/2),Math.floor(rows/2));
    spawnRipple(t+0.001,Math.floor(cols/2),Math.floor(rows/2));}
  if(t>nextRip){spawnRipple(t); nextRip=t+1.2+Math.random()*0.7;}
  // base grid lines
  ctx.lineWidth=1; ctx.strokeStyle=`hsla(${hue},100%,55%,0.055)`; ctx.beginPath();
  for(let c=0;c<=cols;c++){const x=c*CELL+drift;ctx.moveTo(x,0);ctx.lineTo(x,GH);}
  for(let r=0;r<=rows;r++){const y=r*CELL+driftY;ctx.moveTo(0,y);ctx.lineTo(GW,y);}
  ctx.stroke();
  // ambient soft twinkle cells
  ctx.save();
  for(const a of ambient){const g=0.5+0.5*Math.sin(t*a.sp+a.ph); if(g<0.15)continue;
    const x=a.c*CELL+drift,y=a.r*CELL+driftY;
    ctx.shadowColor=`hsla(${hue},100%,55%,${0.4*g})`;ctx.shadowBlur=16*g;
    ctx.fillStyle=`hsla(${hue},100%,58%,${0.07*g})`; rrect(ctx,x+7,y+7,CELL-14,CELL-14,11);ctx.fill();}
  // ripple wavefront cells
  for(let c=0;c<cols;c++)for(let r=0;r<rows;r++){
    const x=c*CELL+drift,y=r*CELL+driftY,mx=x+CELL/2,my=y+CELL/2; let inten=0;
    for(const rp of ripples){const age=t-rp.t0; if(age<0||age>3.0)continue;
      const wf=age*450, d=Math.hypot(mx-rp.x,my-rp.y);
      inten+=Math.exp(-Math.pow((d-wf)/64,2))*Math.max(0,1-age/3.0);}
    if(inten>0.05){inten=Math.min(1,inten);
      ctx.shadowColor=`hsla(${hue},100%,55%,${0.9*inten})`;ctx.shadowBlur=28*inten;
      ctx.fillStyle=`hsla(${hue},100%,${54+inten*12}%,${0.20*inten})`; rrect(ctx,x+7,y+7,CELL-14,CELL-14,11);ctx.fill();
      ctx.shadowBlur=10*inten; ctx.fillStyle=`hsla(${hue},100%,72%,${0.55*inten})`;
      ctx.beginPath();ctx.arc(mx,my,2.5+inten*3.5,0,6.28);ctx.fill();}
  }
  ctx.restore(); ctx.shadowBlur=0;
}

/* ---------- SVG icon set for families ---------- */
const IC={
  text:'<path d="M14 18h36M14 32h36M14 46h22"/>',
  img:'<rect x="12" y="14" width="40" height="36" rx="5"/><circle cx="24" cy="27" r="5"/><path d="M14 44l12-11 10 8 8-6 8 7"/>',
  video:'<rect x="12" y="16" width="34" height="32" rx="5"/><path d="M46 26l10-6v24l-10-6z"/>',
  code:'<path d="M24 20L12 32l12 12M40 20l12 12-12 12"/>',
  voice:'<rect x="26" y="12" width="12" height="26" rx="6"/><path d="M18 32a14 14 0 0 0 28 0M32 46v8"/>',
  music:'<path d="M26 44V16l22-4v28"/><circle cx="20" cy="46" r="6"/><circle cx="42" cy="42" r="6"/>',
  auto:'<circle cx="32" cy="32" r="9"/><path d="M32 12v8M32 44v8M12 32h8M44 32h8M18 18l6 6M40 40l6 6M46 18l-6 6M24 40l-6 6"/>'
};
const FAMS=[['text','Текст'],['img','Картинки'],['video','Видео'],['code','Код'],['voice','Озвучка'],['music','Музыка'],['auto','Авто']];

/* ---------- build scenes ---------- */
const root=$('#scenes'); const scenes=[];
function mk(i){const s=el('div','scene');s.dataset.i=i;root.appendChild(s);scenes.push(s);return s;}

// S1 intro
(()=>{const s=mk(0);
  s.append(el('img','intrologo'),0);
  const lg=el('img','intrologo');lg.src='assets/logo.png';s.innerHTML='';s.appendChild(lg);
  s.appendChild(el('div','kicker','АКАДЕМИЯ OKO · НЕЙРОСЕТИ'));
  s.appendChild(el('div','h1','Карта <span class="l">нейросетей</span><br>2026'));
  s.appendChild(el('div','lead','Одна схема: <span class="l">задача → категория → модель</span>'));
  s.querySelector('.kicker').style.margin='30px 0 22px'; s.querySelector('.lead').style.marginTop='30px';
})();
// S2 families
(()=>{const s=mk(1);
  s.appendChild(el('div','kicker','СНАЧАЛА — ЗАДАЧА, ПОТОМ МОДЕЛЬ'));
  s.appendChild(el('div','h2','7 семей нейросетей'));
  const wrap=el('div');wrap.style.cssText='position:absolute;inset:0';s.appendChild(wrap);
  const cx=960,cy=632,R=330;
  FAMS.forEach((f,k)=>{const a=-Math.PI/2+k*(2*Math.PI/7);
    const x=cx+Math.cos(a)*R, y=cy+Math.sin(a)*R*0.72;
    const node=el('div','fam');node.dataset.k=k;node.style.left=(x-105)+'px';node.style.top=(y-95)+'px';
    node.innerHTML=`<div class="disc"><svg viewBox="0 0 64 64">${IC[f[0]]}</svg></div><div class="nm">${f[1]}</div>`;
    node.dataset.cx=x;node.dataset.cy=y; wrap.appendChild(node);});
  s.querySelector('.kicker').style.cssText+=';position:absolute;top:118px;left:0;right:0;text-align:center';
  s.querySelector('.h2').style.cssText+=';position:absolute;top:158px;left:0;right:0';
})();
// S3 text cards
(()=>{const s=mk(2);
  s.appendChild(el('div','kicker','СЕМЬЯ 1 · ТЕКСТ — ТВОЙ РАБОЧИЙ КОНЬ'));
  const row=el('div','cards');
  const data=[['01','ChatGPT','универсал',['Хорош <b>почти во всём</b>','Быстрый старт любой задачи']],
    ['02','Claude','код · длинные тексты',['Держит <b>десятки страниц</b> контекста','Король кода и документов']],
    ['03','Gemini','поиск · Google',['<b>Свежие факты</b> из сети','Связка с сервисами Google']]];
  data.forEach(d=>{const c=el('div','card');
    c.innerHTML=`<div class="rank">${d[0]}</div><div class="nm">${d[1]}</div><span class="tag">${d[2]}</span>
      <ul>${d[3].map(x=>`<li><i>›</i><span>${x}</span></li>`).join('')}</ul>`;row.appendChild(c);});
  s.appendChild(row);
  s.appendChild(el('div','verdict','Код или документ → <span class="l">Claude</span> · факт из сети → <span class="l">Gemini</span> · остальное → <span class="l">ChatGPT</span>'));
  s.querySelector('.kicker').style.marginBottom='6px';
})();
// S4 images
(()=>{const s=mk(3);
  s.appendChild(el('div','kicker','СЕМЬЯ 2 · КАРТИНКИ — ЗДЕСЬ ДЕНЬГИ'));
  s.appendChild(el('div','h2','Картинки'));
  const m=el('div','mosaic');
  const data=[['Midjourney','арт · эстетика','$10','.28'],['Flux','фотореализм','$0.05','.33'],
    ['Nano Banana','правки + текст','$0.05','.24'],['Higgsfield','всё в одном','Ultra','.30'],
    ['стиль','вау-визуал','MJ','.20'],['объём','дёшево','Flux','.36'],
    ['текст на арте','без перегена','NB','.26'],['одно окно','десятки моделей','HG','.31']];
  data.forEach((d,i)=>{const t=el('div','tile');t.style.gridColumn=(i<4?'span 1':'span 1');
    t.innerHTML=`<div class="gl" style="background:radial-gradient(120% 100% at 30% 0%,hsl(${80+i*8} 90% 22%),transparent)"></div>
      <div class="pr">${d[2]}</div><div class="nm">${d[0]}<div style="font-size:17px;color:#aab89c;font-weight:600;margin-top:3px">${d[1]}</div></div>`;
    m.appendChild(t);});
  s.appendChild(m);
  s.querySelector('.h2').style.margin='6px 0 4px';
})();

/* ---------- constellation canvas (scene2) ---------- */
const cc=$('#constell'),cx2=cc.getContext('2d');cc.width=1920;cc.height=1080;
function drawConstell(prog){cx2.clearRect(0,0,1920,1080);
  const nodes=$$('#scenes .scene[data-i="1"] .fam').map(n=>({x:+n.dataset.cx,y:+n.dataset.cy}));
  if(!nodes.length)return; cx2.strokeStyle='rgba(154,255,0,0.35)';cx2.lineWidth=2;
  const cxx=960,cyy=632;
  nodes.forEach((n,i)=>{const p=Math.max(0,Math.min(1,(prog*8)-i));if(p<=0)return;
    cx2.globalAlpha=p*0.6;cx2.beginPath();cx2.moveTo(cxx,cyy);
    cx2.lineTo(cxx+(n.x-cxx)*p,cyy+(n.y-cyy)*p);cx2.stroke();});
  cx2.globalAlpha=1;
}

}
// generic scene fade in/out
scenes.forEach((s,i)=>{

  master.to(s,{opacity:0,duration:0.5,ease:'power2.in'},en-0.35);

});

/* HUD build */
SEG.forEach(()=>{$('#pips').appendChild(el('i'));});
const pipEls=$$('#pips i');
function hud(t){ $('#bar').style.width=Math.min(100,t/TOTAL*100)+'%';
  let cur=SEG.findIndex(s=>t>=s.start&&t<s.end); if(cur<0)cur=t<0?0:SEG.length-1;
  pipEls.forEach((p,i)=>p.classList.toggle('on',i<=cur));
  $('#chap').innerHTML='0'+(cur+1)+' · <b>'+CH[cur]+'</b>';
}

/* run loop */
let rafT0=null;
function loop(ts){ if(rafT0===null)rafT0=ts; const t=(ts-rafT0)/1000;
  master.time(Math.min(t,master.duration())); renderBG(t); hud(t);
  if(t<TOTAL+0.4) requestAnimationFrame(loop);
}
initBG();
window.SEEK=(t)=>{const L=document.getElementById('leader');if(L)L.style.display='none';lastSeg=-1;master.time(t);renderBG(t);hud(t);};
window.START=()=>{const L=document.getElementById('leader');if(L)L.style.display='none';rafT0=null;requestAnimationFrame(loop);};
// initial paint
master.time(0.001); renderBG(0); hud(0);
