<!doctype html><html lang="ru"><head><meta charset="utf-8">
<title>OKO Academy — Карта нейросетей 2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--lime:#9AFF00;--lime2:#c6ff5a;--ink:#070a04;--white:#f4f8ee;--muted:#9aa891;--card:#121a0b;--line:#2b3a17}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--ink);
  font-family:'Montserrat','Arial Black',system-ui,sans-serif;color:var(--white);-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden}
#bg{position:absolute;inset:0;z-index:0}
#vign{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 42%,transparent 42%,rgba(0,0,0,.5) 100%)}
#wm{position:absolute;top:40px;left:52px;z-index:40;display:flex;align-items:center;gap:15px}
#wm img{width:52px;height:52px;filter:drop-shadow(0 0 14px rgba(154,255,0,.55))}
#wm .t{font-weight:800;font-size:24px;line-height:1}#wm .t b{color:var(--lime)}
#wm .t small{display:block;font-size:12px;letter-spacing:.42em;color:var(--muted);font-weight:700;margin-top:3px}
#hud{position:absolute;left:0;right:0;bottom:0;z-index:40}
#bar{height:6px;width:0;background:linear-gradient(90deg,#5f9e00,var(--lime));box-shadow:0 0 18px rgba(154,255,0,.7)}
#pips{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);display:flex;gap:12px}
#pips i{width:40px;height:6px;border-radius:4px;background:#202a13;transition:.4s}
#pips i.on{background:var(--lime);box-shadow:0 0 12px rgba(154,255,0,.6)}
#chap{position:absolute;bottom:64px;left:56px;font-size:17px;letter-spacing:.3em;color:var(--muted);font-weight:700;text-transform:uppercase}
#chap b{color:var(--lime)}
.scene{position:absolute;inset:0;z-index:20;opacity:0;visibility:hidden}
.drift{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 140px;will-change:transform}
.kicker{font-size:22px;letter-spacing:.38em;font-weight:800;color:var(--lime);text-transform:uppercase}
.h1{font-size:132px;line-height:.92;font-weight:900;letter-spacing:-.015em;text-align:center;text-shadow:0 0 60px rgba(154,255,0,.18)}
.h1 .l{color:var(--lime)}
.h2{font-size:98px;line-height:.95;font-weight:900;letter-spacing:-.01em;text-align:center}
.h2 .l{color:var(--lime)}
.lead{font-size:40px;color:#d6e2c8;font-weight:600;text-align:center;max-width:1320px;line-height:1.24}
.lead .l{color:var(--lime);font-weight:800}
.intrologo{width:230px;height:230px;filter:drop-shadow(0 0 46px rgba(154,255,0,.55))}
.ring{position:absolute;border-radius:50%;border:2px solid rgba(154,255,0,.16);pointer-events:none}
/* families */
.fam{position:absolute;display:flex;flex-direction:column;align-items:center;gap:12px;width:190px;will-change:transform}
.fam .disc{width:120px;height:120px;border-radius:32px;background:linear-gradient(155deg,#1b2b09,#0b1104);
  border:2px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;
  box-shadow:0 16px 46px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);transition:border-color .3s,box-shadow .3s}
.fam.hot .disc{border-color:var(--lime);box-shadow:0 0 46px rgba(154,255,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
.fam .disc svg{width:60px;height:60px;stroke:var(--lime);fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.fam .nm{font-size:25px;font-weight:800}
/* cards */
.cards{display:flex;gap:44px;perspective:1600px}
.card{width:426px;height:520px;border-radius:30px;background:linear-gradient(165deg,var(--card),#0a0f05);
  border:1px solid var(--line);padding:42px 38px;position:relative;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.5);transition:border-color .3s,box-shadow .3s}
.card.hot{border-color:var(--lime);box-shadow:0 0 50px rgba(154,255,0,.3)}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 40% at 50% 0%,rgba(154,255,0,.14),transparent 70%)}
.card .rank{position:absolute;top:26px;right:32px;font-size:78px;font-weight:900;color:transparent;-webkit-text-stroke:2px #35491d}
.card .nm{font-size:50px;font-weight:900;margin-top:8px}
.card .tag{display:inline-block;margin-top:14px;font-size:22px;font-weight:800;color:var(--ink);background:var(--lime);padding:8px 18px;border-radius:12px}
.card ul{margin-top:28px;list-style:none;display:flex;flex-direction:column;gap:18px}
.card li{font-size:26px;color:#d9e6cb;font-weight:600;display:flex;gap:12px;align-items:flex-start}
.card li b{color:var(--lime)} .card li i{color:var(--lime);font-style:normal;font-weight:900}
.verdict{margin-top:40px;font-size:33px;font-weight:800;color:#dce8cd;background:#0e1508;border:1px solid var(--line);padding:18px 38px;border-radius:16px}
.verdict .l{color:var(--lime)}
/* mosaic */
.mosaic{display:grid;grid-template-columns:repeat(4,232px);grid-auto-rows:150px;gap:15px}
.tile{border-radius:18px;overflow:hidden;position:relative;background:#0e1508;border:1px solid var(--line);display:flex;align-items:flex-end;padding:16px;transition:border-color .3s,transform .3s}
.tile.hot{border-color:var(--lime)}
.tile .nm{font-size:23px;font-weight:800;position:relative;z-index:2}
.tile .pr{position:absolute;top:13px;right:15px;font-size:22px;font-weight:900;color:var(--lime);z-index:2}
.tile .gl{position:absolute;inset:0;opacity:.5}
/* video */
.filmrow{display:flex;gap:22px}
.vcard{width:388px;border-radius:22px;background:linear-gradient(165deg,var(--card),#0a0f05);border:1px solid var(--line);padding:32px 30px;transition:border-color .3s,box-shadow .3s}
.vcard.hot{border-color:var(--lime);box-shadow:0 0 40px rgba(154,255,0,.28)}
.vcard .nm{font-size:44px;font-weight:900} .vcard .d{font-size:24px;color:#cfe0bd;font-weight:600;margin-top:10px;line-height:1.22}
.vcard .price{font-size:29px;font-weight:900;color:var(--lime);margin-top:16px}
/* code/voice/music */
.tri{display:flex;gap:32px}
.panel{width:398px;height:456px;border-radius:26px;background:linear-gradient(165deg,var(--card),#0a0f05);border:1px solid var(--line);padding:32px;position:relative;overflow:hidden;transition:border-color .3s}
.panel.hot{border-color:var(--lime)}
.panel .pt{font-size:33px;font-weight:900}.panel .ps{font-size:21px;color:var(--muted);font-weight:700;margin-top:4px;letter-spacing:.02em}
.codeline{font-family:'DejaVu Sans Mono',monospace;font-size:20px;color:#bfe38a;margin-top:14px;white-space:nowrap;overflow:hidden}
.codeline .k{color:var(--lime)}
.wave,.eq{position:absolute;left:32px;right:32px;bottom:52px}
.eq{height:160px;display:flex;align-items:flex-end;gap:9px}.eq b{flex:1;background:linear-gradient(180deg,var(--lime),#4f8a00);border-radius:6px 6px 0 0;height:20%}
.chips{display:flex;gap:11px;flex-wrap:wrap;margin-top:18px}
.chip2{font-size:21px;font-weight:800;padding:8px 15px;border-radius:12px;background:#0e1508;border:1px solid var(--line);color:#d9e6cb}.chip2 b{color:var(--lime)}
/* лазейка */
.cmp{display:flex;align-items:flex-end;gap:88px;height:340px}
.colwrap{display:flex;flex-direction:column;align-items:center;gap:16px}.colwrap .cap{font-size:27px;font-weight:800;color:#d9e6cb;text-align:center}
.col{width:150px;border-radius:16px 16px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:16px;font-size:34px;font-weight:900;height:0}
.col.bad{background:linear-gradient(180deg,#3a2020,#1a0f0f);color:#ff8a8a;border:1px solid #4a2626;border-bottom:none}
.col.good{background:linear-gradient(180deg,var(--lime),#4f8a00);color:var(--ink);border:1px solid var(--lime);border-bottom:none}
.stamp{position:absolute;font-size:50px;font-weight:900;color:var(--lime);border:5px solid var(--lime);padding:12px 26px;border-radius:18px;
  transform:rotate(-9deg);text-transform:uppercase;box-shadow:0 0 50px rgba(154,255,0,.4);text-shadow:0 0 22px rgba(154,255,0,.4);right:104px;top:150px;white-space:nowrap}
/* formula */
.formula{display:flex;align-items:center;gap:32px}
.tok{font-size:54px;font-weight:900;padding:24px 40px;border-radius:20px;background:#0e1508;border:2px solid var(--line)}
.tok.l{color:var(--lime);border-color:var(--lime);box-shadow:0 0 34px rgba(154,255,0,.25)}
.arrow{font-size:58px;color:var(--lime);font-weight:900}
.recap{display:grid;grid-template-columns:repeat(2,530px);gap:16px 38px;margin-top:52px}
.rrow{display:flex;align-items:center;gap:16px;font-size:31px;font-weight:700;color:#d9e6cb;transition:color .3s}
.rrow .ic{width:44px;height:44px;border-radius:12px;background:var(--lime);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;flex:none}
.rrow b{color:var(--lime)}
.outrologo{width:250px;height:250px;filter:drop-shadow(0 0 54px rgba(154,255,0,.6))}
.cta{margin-top:28px;font-size:31px;font-weight:800;color:var(--ink);background:var(--lime);padding:16px 38px;border-radius:16px;box-shadow:0 14px 40px rgba(154,255,0,.35)}
#leader{position:absolute;inset:0;z-index:999;background:#000}
</style></head>
<body><div id="stage">
  <canvas id="bg"></canvas><canvas id="constell"></canvas>
  <div id="vign"></div>
  <div id="wm"><img src="assets/logo.png"><div class="t"><b>OKO</b><small>АКАДЕМИЯ</small></div></div>
  <div id="scenes"></div>
  <div id="hud"><div id="chap"></div><div id="pips"></div><div id="bar"></div></div>
  <div id="leader"></div>
</div>
<script src="lib/gsap.min.js"></script>
<script>
const SEG=[{"id": "s1", "start": 0.0, "end": 18.025}, {"id": "s2", "start": 18.525, "end": 34.75}, {"id": "s3", "start": 35.2, "end": 56.488}, {"id": "s4", "start": 56.938, "end": 76.513}, {"id": "s5", "start": 76.963, "end": 95.263}, {"id": "s6", "start": 95.713, "end": 113.138}, {"id": "s7", "start": 113.588, "end": 128.1}, {"id": "s8", "start": 128.55, "end": 143.925}, {"id": "s9", "start": 144.375, "end": 152.65}];
const TOTAL=153.25;
const CH=["Вступление","Карта · 7 семей","Текст","Картинки","Видео","Код · Озвучка · Музыка","Лазейка","Формула","Итог"];
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

/* ---------- premium animated NEURAL-NET background (nodes + traveling pulses + aurora) ---------- */
let bgc,GW=1920,GH=1080,lastSeg=-1,glowSprite,softSprite,NODES=[],EDGES=[],AUR=[];
function mkGlow(s,cols){const c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
  const g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);cols.forEach(([o,col])=>g.addColorStop(o,col));
  x.fillStyle=g;x.fillRect(0,0,s,s);return c;}
function lcg(seed){return()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};}
function initBG(){bgc=$('#bg').getContext('2d');$('#bg').width=GW;$('#bg').height=GH;
  glowSprite=mkGlow(64,[[0,'rgba(190,255,110,0.95)'],[.35,'rgba(154,255,0,0.5)'],[1,'rgba(154,255,0,0)']]);
  softSprite=mkGlow(512,[[0,'rgba(120,230,40,0.5)'],[.5,'rgba(90,180,20,0.12)'],[1,'rgba(0,0,0,0)']]);
  const R=lcg(1337),N=46;
  for(let i=0;i<N;i++)NODES.push({bx:R()*1920,by:R()*1080,ax:14+R()*26,ay:12+R()*22,ph:R()*6.28,sp:0.15+R()*0.25,r:1.6+R()*3.4,tw:R()*6.28});
  // edges: connect each node to its 2 nearest
  NODES.forEach((n,i)=>{const d=NODES.map((m,j)=>[j,Math.hypot(m.bx-n.bx,m.by-n.by)]).filter(x=>x[0]!==i).sort((a,b)=>a[1]-b[1]);
    for(let k=0;k<2;k++){const j=d[k][0];if(!EDGES.some(e=>(e.a===j&&e.b===i)))EDGES.push({a:i,b:j,off:R(),sp:0.12+R()*0.18,np:1+(R()*2|0)});}});
  AUR=[{x:0.72,y:0.32,r:640,sp:0.03,ph:0},{x:0.2,y:0.8,r:560,sp:0.025,ph:2},{x:0.5,y:0.5,r:720,sp:0.018,ph:4}];
}
function npos(n,t){return[n.bx+Math.sin(t*n.sp+n.ph)*n.ax, n.by+Math.cos(t*n.sp*0.9+n.ph)*n.ay];}
function drawG(x,y,sz,a){bgc.globalAlpha=clamp(a,0,1);bgc.drawImage(glowSprite,x-sz/2,y-sz/2,sz,sz);}
function renderBG(t){if(!bgc)return;const ctx=bgc;ctx.clearRect(0,0,GW,GH);
  let cs=SEG.findIndex(s=>t>=s.start&&t<s.end);if(cs<0)cs=t<0?0:SEG.length-1;lastSeg=cs;
  // aurora blobs (soft, drifting)
  ctx.globalCompositeOperation='lighter';
  AUR.forEach(b=>{const x=(b.x+Math.sin(t*b.sp+b.ph)*0.06)*GW,y=(b.y+Math.cos(t*b.sp*1.1+b.ph)*0.06)*GH;
    ctx.globalAlpha=0.5;ctx.drawImage(softSprite,x-b.r,y-b.r,b.r*2,b.r*2);});
  // edges
  ctx.lineWidth=1.4;
  EDGES.forEach(e=>{const [x1,y1]=npos(NODES[e.a],t),[x2,y2]=npos(NODES[e.b],t);
    ctx.globalAlpha=0.10;ctx.strokeStyle='#9AFF00';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    for(let m=0;m<e.np;m++){const f=(t*e.sp+e.off+m/e.np)%1;drawG(x1+(x2-x1)*f,y1+(y2-y1)*f,16,0.55);}});
  // nodes
  NODES.forEach(n=>{const [x,y]=npos(n,t);const pu=0.6+0.4*Math.sin(t*1.6+n.tw);drawG(x,y,n.r*3.4*pu,0.5*pu);
    ctx.globalAlpha=0.9;ctx.fillStyle='#c6ff5a';ctx.beginPath();ctx.arc(x,y,n.r*0.8,0,6.28);ctx.fill();});
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
}

/* icons */
const IC={text:'<path d="M14 18h36M14 32h36M14 46h22"/>',img:'<rect x="12" y="14" width="40" height="36" rx="5"/><circle cx="24" cy="27" r="5"/><path d="M14 44l12-11 10 8 8-6 8 7"/>',
video:'<rect x="12" y="16" width="34" height="32" rx="5"/><path d="M46 26l10-6v24l-10-6z"/>',code:'<path d="M24 20L12 32l12 12M40 20l12 12-12 12"/>',
voice:'<rect x="26" y="12" width="12" height="26" rx="6"/><path d="M18 32a14 14 0 0 0 28 0M32 46v8"/>',music:'<path d="M26 44V16l22-4v28"/><circle cx="20" cy="46" r="6"/><circle cx="42" cy="42" r="6"/>',
auto:'<circle cx="32" cy="32" r="9"/><path d="M32 12v8M32 44v8M12 32h8M44 32h8M18 18l6 6M40 40l6 6M46 18l-6 6M24 40l-6 6"/>'};
const FAMS=[['text','Текст'],['img','Картинки'],['video','Видео'],['code','Код'],['voice','Озвучка'],['music','Музыка'],['auto','Авто']];

/* ---------- build scenes (each: .scene > .drift) ---------- */
const root=$('#scenes');const scenes=[];
function mk(i){const s=el('div','scene');s.dataset.i=i;const d=el('div','drift');s.appendChild(d);root.appendChild(s);scenes.push(s);return d;}
// S1
(()=>{const d=mk(0);
  d.innerHTML=`<div class="ring" data-spin="1" style="width:360px;height:360px"></div>
    <div class="ring" data-spin="-1" style="width:520px;height:520px"></div>
    <img class="intrologo" src="assets/logo.png">
    <div class="kicker" style="margin:28px 0 20px">АКАДЕМИЯ OKO · НЕЙРОСЕТИ</div>
    <div class="h1">Карта <span class="l">нейросетей</span><br>2026</div>
    <div class="lead" style="margin-top:28px">Одна схема: <span class="l">задача → категория → модель</span></div>`;
})();
// S2 families
(()=>{const d=mk(1);
  d.style.justifyContent='flex-start';d.style.paddingTop='120px';
  d.innerHTML=`<div class="kicker">Сначала — задача, потом модель</div><div class="h2" style="margin-top:8px">7 семей нейросетей</div>`;
  const wrap=el('div');wrap.style.cssText='position:absolute;inset:0';d.appendChild(wrap);
  const cx=960,cy=640,R=330;
  FAMS.forEach((f,k)=>{const a=-Math.PI/2+k*(2*Math.PI/7);const x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R*0.72;
    const n=el('div','fam');n.dataset.k=k;n.style.left=(x-95)+'px';n.style.top=(y-84)+'px';n.dataset.cx=x;n.dataset.cy=y;
    n.innerHTML=`<div class="disc"><svg viewBox="0 0 64 64">${IC[f[0]]}</svg></div><div class="nm">${f[1]}</div>`;wrap.appendChild(n);});
})();
// S3 cards
(()=>{const d=mk(2);
  d.innerHTML=`<div class="kicker" style="margin-bottom:14px">Семья 1 · Текст — твой рабочий конь</div>`;
  const row=el('div','cards');
  [['01','ChatGPT','универсал',['Хорош <b>почти во всём</b>','Быстрый старт любой задачи']],
   ['02','Claude','код · длинные тексты',['Держит <b>десятки страниц</b>','Король кода и документов']],
   ['03','Gemini','поиск · Google',['<b>Свежие факты</b> из сети','Связка с сервисами Google']]].forEach(x=>{
    const c=el('div','card');c.innerHTML=`<div class="rank">${x[0]}</div><div class="nm">${x[1]}</div><span class="tag">${x[2]}</span>
      <ul>${x[3].map(y=>`<li><i>›</i><span>${y}</span></li>`).join('')}</ul>`;row.appendChild(c);});
  d.appendChild(row);
  d.appendChild(el('div','verdict','Код/документ → <span class="l">Claude</span> · факт из сети → <span class="l">Gemini</span> · остальное → <span class="l">ChatGPT</span>'));
})();
// S4 mosaic
(()=>{const d=mk(3);
  d.innerHTML=`<div class="kicker">Семья 2 · Картинки — здесь деньги</div><div class="h2" style="margin:8px 0 22px">Картинки</div>`;
  const m=el('div','mosaic');
  [['Midjourney','арт · эстетика','$10'],['Flux','фотореализм','$0.05'],['Nano Banana','правки + текст','$0.05'],['Higgsfield','всё в одном','Ultra'],
   ['стиль','вау-визуал','MJ'],['объём','дёшево','Flux'],['текст на арте','без перегена','NB'],['одно окно','десятки моделей','HG']].forEach((x,i)=>{
    const tl=el('div','tile');tl.innerHTML=`<div class="gl" style="background:radial-gradient(120% 100% at 30% 0%,hsl(${80+i*7} 90% 22%),transparent)"></div>
      <div class="pr">${x[2]}</div><div class="nm">${x[0]}<div style="font-size:16px;color:#aab89c;font-weight:600;margin-top:3px">${x[1]}</div></div>`;m.appendChild(tl);});
  d.appendChild(m);
})();
// S5 video
(()=>{const d=mk(4);
  d.innerHTML=`<div class="kicker" style="margin-bottom:14px">Семья 3 · Видео — дорого и зрелищно</div>`;
  const g=el('canvas');g.id='vgauge';g.width=280;g.height=280;g.style.marginBottom='10px';d.appendChild(g);
  const row=el('div','filmrow');
  [['Veo','лучшее качество + звук','премиум'],['Kling','кино за копейки','~$0.10 / сек'],['Runway','маркетинг + монтаж','гибко']].forEach(x=>{
    const c=el('div','vcard');c.innerHTML=`<div class="nm">${x[0]}</div><div class="d">${x[1]}</div><div class="price">${x[2]}</div>`;row.appendChild(c);});
  d.appendChild(row);
})();
// S6 code/voice/music
(()=>{const d=mk(5);
  d.innerHTML=`<div class="kicker" style="margin-bottom:16px">Семьи 4–6 · Код · Озвучка · Музыка</div>`;
  const tri=el('div','tri');
  const p1=el('div','panel');p1.innerHTML=`<div class="pt">Код</div><div class="ps">CURSOR · LOVABLE · CLAUDE CODE</div>
    <div class="codeline">&gt; <span class="k">собери</span> лендинг с оплатой</div><div class="codeline">&gt; <span class="k">добавь</span> вход и базу</div>
    <div class="codeline">&gt; <span class="k">деплой</span> ✓ готово</div><div class="chips"><span class="chip2">без <b>кода</b></span><span class="chip2">словами</span></div>`;

/* constellation lines (s2) */
const cc=$('#constell'),cx2=cc.getContext('2d');cc.width=1920;cc.height=1080;
function drawConstell(t){cx2.clearRect(0,0,1920,1080);
  if(lastSeg!==1){return;}
  const nodes=$$('.scene[data-i="1"] .fam');const cxx=960,cyy=640;
  cx2.strokeStyle='rgba(154,255,0,0.4)';cx2.lineWidth=2;
  nodes.forEach((n)=>{const x=+n.dataset.cx,y=+n.dataset.cy;
    const pulse=0.5+0.5*Math.sin(t*2 - Math.hypot(x-cxx,y-cyy)*0.01);
    cx2.globalAlpha=0.3+pulse*0.5;cx2.beginPath();cx2.moveTo(cxx,cyy);cx2.lineTo(x,y);cx2.stroke();});
  cx2.globalAlpha=1;}

/* ---------- master timeline: entrances + sub-beats + directional transitions ---------- */
const master=gsap.timeline({paused:true});
function at(i){return SEG[i].start}
scenes.forEach((s,i)=>{const st=at(i),en=SEG[i].end;const d=s.querySelector('.drift');
  master.set(s,{visibility:'visible'},Math.max(0,st-0.5));
  // directional slide-in + fade
  const dir=i%2?1:-1;
  master.fromTo(s,{opacity:0},{opacity:1,duration:0.5,ease:'power2.out'},st-0.4);
  master.fromTo(d,{x:120*dir,scale:.96},{x:0,scale:1,duration:0.7,ease:'power3.out'},st-0.4);
  // slide-out
  master.to(s,{opacity:0,duration:0.45,ease:'power2.in'},en-0.4);
  master.to(d,{x:-120*dir,scale:.97,duration:0.55,ease:'power2.in'},en-0.5);
  master.set(s,{visibility:'hidden'},en+0.15);
});
// sub-beat entrance staggers per scene
function stag(i,sel,from,dur=0.5,step=0.12,delay=0.5){const st=at(i);
  $$(sel,scenes[i]).forEach((e,k)=>master.fromTo(e,from,{opacity:1,x:0,y:0,scale:1,rotationY:0,duration:dur,ease:'back.out(1.4)'},st+delay+k*step));}
// S1
{const st=at(0);const s=scenes[0];
 master.fromTo(s.querySelector('.intrologo'),{scale:.5,rotate:-14,opacity:0},{scale:1,rotate:0,opacity:1,duration:1,ease:'back.out(1.6)'},st+0.1);
 master.fromTo(s.querySelector('.kicker'),{opacity:0,y:22},{opacity:1,y:0,duration:.7},st+0.7);
 master.fromTo(s.querySelector('.h1'),{opacity:0,y:36,scale:.93},{opacity:1,y:0,scale:1,duration:.9,ease:'power3.out'},st+0.95);
 master.fromTo(s.querySelector('.lead'),{opacity:0,y:20},{opacity:1,y:0,duration:.7},st+1.6);}
// S2
{const st=at(1);
 master.fromTo(scenes[1].querySelector('.kicker'),{opacity:0},{opacity:1,duration:.5},st+0.2);
 master.fromTo(scenes[1].querySelector('.h2'),{opacity:0,scale:.9},{opacity:1,scale:1,duration:.6,ease:'back.out(1.4)'},st+0.35);
 $$('.fam',scenes[1]).forEach((f,k)=>master.fromTo(f,{opacity:0,scale:.3},{opacity:1,scale:1,duration:.5,ease:'back.out(2)'},st+0.9+k*0.28));}

   $$('li',c).forEach((li,j)=>master.fromTo(li,{opacity:0,x:-14},{opacity:1,x:0,duration:.35},st+1.2+k*0.55+j*0.22));});
 master.fromTo(scenes[2].querySelector('.verdict'),{opacity:0,y:24,scale:.96},{opacity:1,y:0,scale:1,duration:.6,ease:'back.out(1.3)'},SEG[2].end-2.2);}

// S5

 $$('.vcard',scenes[4]).forEach((c,k)=>master.fromTo(c,{opacity:0,y:56},{opacity:1,y:0,duration:.55,ease:'power3.out'},st+1.4+k*0.4));}

/* ---------- PERPETUAL motion (every frame, function of t) — nothing static ---------- */
function perpetual(t){
  let cs=SEG.findIndex(s=>t>=s.start&&t<s.end);if(cs<0)cs=t<0?0:SEG.length-1;
  const lt=cs>=0?t-SEG[cs].start:0;
  // intro logo breathe (after entrance)
  if(cs===0&&lt>1.3){const il=scenes[0].querySelector('.intrologo');if(il)il.style.transform=`scale(${1+0.035*Math.sin(t*2.2)}) translateY(${Math.sin(t*1.4)*6}px)`;}
  // rings spin (own elements, no GSAP conflict)
  $$('.ring[data-spin]').forEach(r=>{const dir=+r.dataset.spin;r.style.transform=`rotate(${t*22*dir}deg)`;
    r.style.borderColor=`rgba(154,255,0,${0.10+0.10*(0.5+0.5*Math.sin(t*1.5))})`;});
  // families: float (after entrance) + cycling highlight
  if(cs===1){const fams=$$('.fam',scenes[1]);const hot=Math.floor(lt/1.4)%fams.length;
    fams.forEach((f,k)=>{if(lt>3.3)f.style.transform=`translateY(${Math.sin(t*1.3+k)*8}px)`;f.classList.toggle('hot',k===hot);});
    drawConstell(t);}
  // cards cycling highlight
  if(cs===2){const cards=$$('.card',scenes[2]);const hot=Math.floor(lt/1.6)%cards.length;
    cards.forEach((c,k)=>{c.classList.toggle('hot',k===hot);if(lt>3.6)c.style.transform=`translateY(${Math.sin(t*1.1+k*1.3)*9}px) rotateY(${Math.sin(t*0.7+k)*3}deg)`;});}
  // tiles cycling highlight
  if(cs===3){const tiles=$$('.tile',scenes[3]);const hot=Math.floor(lt/0.85)%tiles.length;
    tiles.forEach((tl,k)=>{tl.classList.toggle('hot',k===hot);if(lt>2.7)tl.style.transform=`translateY(${Math.sin(t*1.5+k*0.8)*7}px)`;});}
  // video gauge sweep + vcard highlight
  if(cs===4){const g=$('#vgauge');if(g){const x=g.getContext('2d');const v=0.5+0.5*Math.sin((t-SEG[4].start)*0.9-1.2);
    x.clearRect(0,0,280,280);x.lineWidth=20;x.lineCap='round';x.strokeStyle='#202a13';x.beginPath();x.arc(140,140,104,0,6.28);x.stroke();
    x.strokeStyle='#9AFF00';x.beginPath();x.arc(140,140,104,-Math.PI/2,-Math.PI/2+v*Math.PI*1.5);x.stroke();
    x.fillStyle='#f4f8ee';x.font='900 42px Montserrat';x.textAlign='center';x.fillText('$'+(v*0.10).toFixed(2),140,140);
    x.fillStyle='#9aa891';x.font='700 18px Montserrat';x.fillText('за секунду · Kling',140,170);}
    const vc=$$('.vcard',scenes[4]);const hot=Math.floor(lt/1.5)%vc.length;vc.forEach((c,k)=>{c.classList.toggle('hot',k===hot);if(lt>3.0)c.style.transform=`translateY(${Math.sin(t*1.2+k*1.4)*9}px)`;});}
  // waveform + equalizer + panel highlight + code typing
  if(cs===5){const wc=$('#wave');if(wc){const x=wc.getContext('2d');x.clearRect(0,0,334,150);x.strokeStyle='#9AFF00';x.lineWidth=3;x.beginPath();
    for(let px=0;px<334;px++){const y=75+Math.sin(px*0.08+t*6)*30*Math.sin(px*0.02+t)+Math.sin(px*0.05+t*4)*18;px?x.lineTo(px,y):x.moveTo(px,y);}x.stroke();}
    const bars=$$('#eq b',scenes[5]);bars.forEach((b,i)=>b.style.height=(20+Math.abs(Math.sin(t*5+i*0.6))*Math.abs(Math.sin(t*2+i))*128)+'%');
    const pans=$$('.panel',scenes[5]);const hot=Math.floor(lt/1.5)%pans.length;pans.forEach((p,k)=>{p.classList.toggle('hot',k===hot);if(lt>2.6)p.style.transform=`translateY(${Math.sin(t*1.05+k*1.2)*8}px)`;});}
  // лазейка: pulse good col + stamp bob
  if(cs===6){const good=scenes[6].querySelector('.col.good');if(good)good.style.boxShadow=`0 0 ${20+20*(0.5+0.5*Math.sin(t*3))}px rgba(154,255,0,.5)`;}
  // formula token glow + recap cycling
  if(cs===7){const l=scenes[7].querySelector('.tok.l');if(l)l.style.boxShadow=`0 0 ${30+30*(0.5+0.5*Math.sin(t*3))}px rgba(154,255,0,.5)`;
    const rows=$$('.rrow',scenes[7]);const hot=Math.floor((t-SEG[7].start)/1.2)%rows.length;rows.forEach((r,k)=>r.style.color=k===hot?'#fff':'#d9e6cb');}
  // outro logo breathe
  if(cs===8){const lg=scenes[8].querySelector('.outrologo');if(lg&&lt>1.2)lg.style.transform=`scale(${1+0.04*Math.sin(t*2.4)})`;}
}

/* HUD */
SEG.forEach(()=>$('#pips').appendChild(el('i')));const pipEls=$$('#pips i');
function hud(t){$('#bar').style.width=Math.min(100,t/TOTAL*100)+'%';
  let cur=SEG.findIndex(s=>t>=s.start&&t<s.end);if(cur<0)cur=t<0?0:SEG.length-1;
  pipEls.forEach((p,i)=>p.classList.toggle('on',i<=cur));$('#chap').innerHTML='0'+(cur+1)+' · <b>'+CH[cur]+'</b>';}

/* apply drift var via CSS on .drift (transform uses vars) */

let rafT0=null;
function loop(ts){if(rafT0===null)rafT0=ts;const t=(ts-rafT0)/1000;
  master.time(Math.min(t,master.duration()));renderBG(t);perpetual(t);hud(t);
  if(t<TOTAL+0.4)requestAnimationFrame(loop);}
function frame(t){master.time(Math.min(t,master.duration()));renderBG(t);perpetual(t);hud(t);}
initBG();
window.SEEK=(t)=>{const L=$('#leader');if(L)L.style.display='none';lastSeg=-1;frame(t);};
window.START=()=>{const L=$('#leader');if(L)L.style.display='none';rafT0=null;requestAnimationFrame(loop);};
frame(0.001);
</script></body></html>
