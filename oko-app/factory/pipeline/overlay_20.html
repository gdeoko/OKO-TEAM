<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'soyuz';src:url('file:///home/user/OKO-TEAM/oko-app/factory/fonts/SoyuzGrotesk-Bold.ttf')}
@font-face{font-family:'man8';src:url('file:///home/user/OKO-TEAM/oko-app/factory/fonts/manrope-v20-cyrillic_latin-800.ttf')}
@font-face{font-family:'mont9';src:url('file:///home/user/OKO-TEAM/oko-app/factory/fonts/montserrat-v31-cyrillic_latin-900.ttf')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
#stage{position:absolute;inset:0;font-family:'man8';color:#F6F4F1}
svg{overflow:visible}
</style></head><body><div id="stage"></div>
<script>
// BESPOKE overlays — reel #20 (batch A, МОТО распаковка). New forms, none reused:
// box-open · parts-snap assembly · contents-arc-out · leader-line spec tags · price-tag swap · ignition lockup.
const TOTAL=36.816;
const AMB="#EA5920",AMB2="#FF7A3C",WHT="#F6F4F1",DIM="#8a8178",GRN="#7CCB4B",CARD="rgba(16,12,10,.94)";
const stage=document.getElementById('stage');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,x)=>a+(b-a)*x;
const easeOut=x=>1-Math.pow(1-x,3);
const easeInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=2.1;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
function win(ts,a,b){if(ts<a-0.2||ts>b+0.3)return -1;return clamp((ts-a)/(b-a));}
function bf(ts,a,b){return clamp(Math.min((ts-a)/0.35,(b-ts)/0.35));}

// A1 — BOX-OPEN: крышка коробки откидывается, из неё свет, «ЧТО В КОРОБКЕ?»
function a1(ts){const a=1.9,b=6.7;const p=win(ts,a,b);if(p<0)return'';
  const cx=540,cy=980,bw=560,bh=300;
  const open=easeOut(clamp((p-0.1)/0.5));      // 0 closed -> 1 lid up
  let s='<svg style="position:absolute;left:0;top:0" width="1080" height="1920">';
  s+='<text x="540" y="'+(cy-360)+'" text-anchor="middle" font-family="man8" font-size="42" letter-spacing="4" fill="'+DIM+'">ЧТО РЕАЛЬНО В КОРОБКЕ?</text>';
  // glow from inside
  s+='<defs><radialGradient id="g1" cx="0.5" cy="0.2" r="0.8"><stop offset="0" stop-color="rgba(255,180,120,'+(0.55*open)+')"/><stop offset="1" stop-color="rgba(255,180,120,0)"/></radialGradient></defs>';
  s+='<rect x="'+(cx-bw/2)+'" y="'+(cy-bh/2)+'" width="'+bw+'" height="'+bh+'" fill="url(#g1)"/>';
  // box body
  s+='<rect x="'+(cx-bw/2)+'" y="'+(cy-bh/2)+'" width="'+bw+'" height="'+bh+'" rx="14" fill="'+CARD+'" stroke="'+AMB+'" stroke-width="4"/>';
  // lid (flips up, perspective via scaleY)
  const lidH=90*Math.cos(open*Math.PI*0.62);
  s+='<g transform="translate('+(cx-bw/2)+','+(cy-bh/2)+')"><rect x="0" y="'+(-lidH)+'" width="'+bw+'" height="'+lidH+'" rx="8" fill="rgba(30,20,12,.96)" stroke="'+AMB2+'" stroke-width="3"/></g>';
  // DIESEL tape on box
  s+='<rect x="'+(cx-30)+'" y="'+(cy-bh/2)+'" width="60" height="'+bh+'" fill="rgba(234,89,32,.25)"/>';
  s+='<text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" font-family="soyuz" font-size="72" fill="'+WHT+'" opacity="'+clamp((open-0.4)/0.4)+'">МОТОЦИКЛ</text>';
  s+='</svg>';
  return '<div style="opacity:'+bf(ts,a,b)+'">'+s+'</div>';
}

// A2 — PARTS-SNAP ASSEMBLY: детали прищёлкиваются к силуэту, бар сборки 0→100
function a2(ts){const a=7.0,b=12.7;const p=win(ts,a,b);if(p<0)return'';
  const cx=540,cy=900;const parts=["РУЛЬ","ЗЕРКАЛА","КОЛЕСО"];
  let s='<svg style="position:absolute;left:0;top:0" width="1080" height="1920">';
  s+='<text x="540" y="'+(cy-300)+'" text-anchor="middle" font-family="man8" font-size="42" letter-spacing="4" fill="'+DIM+'">ПОЧТИ СОБРАН</text>';
  // simplified bike silhouette (two wheels + frame)
  s+='<g opacity="0.9" stroke="'+WHT+'" stroke-width="6" fill="none"><circle cx="'+(cx-150)+'" cy="'+(cy+60)+'" r="70"/><circle cx="'+(cx+150)+'" cy="'+(cy+60)+'" r="70"/><path d="M'+(cx-150)+' '+(cy+60)+' L'+(cx-30)+' '+(cy-30)+' L'+(cx+150)+' '+(cy+60)+' M'+(cx-30)+' '+(cy-30)+' L'+(cx+40)+' '+(cy-30)+'"/></g>';
  // parts snapping in from sides with a flash
  parts.forEach((pt,i)=>{const lp=clamp((p-(0.12+i*0.22))/0.28);const e=back(lp);
    const tx=[cx-30,cx+120,cx+150][i], ty=[cy-70,cy-30,cy+60][i];
    const fromX=tx+(i%2?300:-300)*(1-e);
    s+='<g opacity="'+clamp(lp*1.6)+'"><circle cx="'+fromX+'" cy="'+ty+'" r="'+(18*e)+'" fill="'+AMB2+'"/>'
      +'<text x="'+fromX+'" y="'+(ty-30)+'" text-anchor="middle" font-family="man8" font-size="30" fill="'+WHT+'">'+pt+'</text></g>';
  });
  // assembly bar
  const asm=easeInOut(clamp(p/0.85));
  s+='<g transform="translate('+(cx-230)+','+(cy+200)+')"><rect x="0" y="0" width="460" height="30" rx="15" fill="rgba(255,255,255,.14)"/>'
    +'<rect x="0" y="0" width="'+(460*asm)+'" height="30" rx="15" fill="'+AMB+'"/>'
    +'<text x="470" y="24" font-family="mont9" font-size="34" fill="'+WHT+'">'+Math.round(asm*100)+'%</text></g>';
  s+='<text x="540" y="'+(cy+300)+'" text-anchor="middle" font-family="man8" font-size="34" fill="'+AMB2+'">полчаса — и в седле</text>';
  s+='</svg>';
  return '<div style="opacity:'+bf(ts,a,b)+'">'+s+'</div>';
}

// A3 — CONTENTS ARC-OUT: карточки комплекта вылетают из коробки по дуге
function a3(ts){const a=13.0,b=18.5;const p=win(ts,a,b);if(p<0)return'';
  const cx=540,srcY=1150;const items=["ДОКУМЕНТЫ","КЛЮЧИ","ЗАРЯДКА","ИНСТРУМЕНТ"];
  const dst=[[300,760],[770,760],[300,1000],[770,1000]];
  let s='<div style="position:absolute;left:0;top:0;width:1080px;height:1920px">';
  s+='<div style="position:absolute;top:640px;left:0;width:1080px;text-align:center;font-family:man8;font-size:42px;letter-spacing:4px;color:'+DIM+'">ВСЁ В КОМПЛЕКТЕ</div>';
  items.forEach((it,i)=>{const lp=clamp((p-(0.1+i*0.16))/0.4);const e=easeOut(clamp(lp));
    const[dx,dy]=dst[i];const x=lerp(cx,dx,e), y=lerp(srcY,dy,e)-Math.sin(e*Math.PI)*120; // arc
    const op=clamp(lp*1.8);
    s+='<div style="position:absolute;left:'+(x-130)+'px;top:'+(y-46)+'px;width:260px;height:92px;opacity:'+op+';transform:scale('+(0.6+0.4*e)+');'
      +'background:'+CARD+';border:3px solid '+AMB+';border-radius:16px;display:flex;align-items:center;justify-content:center">'
      +'<span style="font-family:soyuz;font-size:38px;color:'+WHT+'">'+it+'</span></div>';
  });
  s+='</div>';
  return '<div style="opacity:'+bf(ts,a,b)+'">'+s+'</div>';
}

// A4 — LEADER-LINE SPEC TAGS: выноски к мотоциклу (ПРОБЕГ 0 / ГАРАНТИЯ / СМАЗКА)
function a4(ts){const a=18.8,b=23.7;const p=win(ts,a,b);if(p<0)return'';
  const cx=540,cy=980;
  const tags=[["ПРОБЕГ 0","0 км",cx-180,cy-40,cx-360,cy-180],
              ["ГАРАНТИЯ","официально",cx+160,cy-20,cx+330,cy-170],
              ["ЗАВОДСКАЯ","смазка",cx+120,cy+120,cx+330,cy+230]];
  let s='<svg style="position:absolute;left:0;top:0" width="1080" height="1920">';
  s+='<text x="540" y="'+(cy-330)+'" text-anchor="middle" font-family="man8" font-size="42" letter-spacing="4" fill="'+DIM+'">НОВЫЙ, НЕ ВИТРИННЫЙ</text>';
  tags.forEach((t,i)=>{const[lbl,sub,px,py,tx,ty]=t;const lp=clamp((p-(0.1+i*0.2))/0.35);
    const grow=easeOut(clamp(lp));const ex=lerp(px,tx,grow),ey=lerp(py,ty,grow);const op=clamp(lp*1.8);
    s+='<g opacity="'+op+'"><circle cx="'+px+'" cy="'+py+'" r="9" fill="'+AMB2+'"/>'
      +'<line x1="'+px+'" y1="'+py+'" x2="'+ex+'" y2="'+ey+'" stroke="'+AMB2+'" stroke-width="3"/>';
    if(grow>0.6){const bw=280;const bx=Math.max(30,Math.min(1080-bw-30, (tx<cx?tx-bw+40:tx-40)));
      s+='<rect x="'+bx+'" y="'+(ey-46)+'" width="'+bw+'" height="92" rx="14" fill="'+CARD+'" stroke="'+AMB+'" stroke-width="3"/>'
        +'<text x="'+(bx+bw/2)+'" y="'+(ey-6)+'" text-anchor="middle" font-family="soyuz" font-size="40" fill="'+WHT+'">'+lbl+'</text>'
        +'<text x="'+(bx+bw/2)+'" y="'+(ey+28)+'" text-anchor="middle" font-family="man8" font-size="26" fill="'+GRN+'">'+sub+'</text>';}
    s+='</g>';
  });
  s+='</svg>';
  return '<div style="opacity:'+bf(ts,a,b)+'">'+s+'</div>';
}

// A5 — PRICE-TAG SWAP: ценник «САЛОН» рвётся/зачёркивается, «ЗАВОД» падает ниже
function a5(ts){const a=24.0,b=28.8;const p=win(ts,a,b);if(p<0)return'';
  const cx=540,cy=900;
  let s='<svg style="position:absolute;left:0;top:0" width="1080" height="1920">';
  s+='<text x="540" y="'+(cy-260)+'" text-anchor="middle" font-family="man8" font-size="42" letter-spacing="4" fill="'+DIM+'">БЕЗ НАЦЕНКИ САЛОНА</text>';
  // salon tag high
  const strike=clamp((p-0.25)/0.2);
  s+='<g transform="translate('+cx+','+(cy-120)+')"><rect x="-180" y="-55" width="360" height="110" rx="16" fill="rgba(60,20,12,.9)" stroke="'+DIM+'" stroke-width="3"/>'
    +'<circle cx="-150" cy="0" r="10" fill="'+DIM+'"/><text x="20" y="16" text-anchor="middle" font-family="soyuz" font-size="56" fill="'+DIM+'">САЛОН</text>';
  if(strike>0)s+='<line x1="-180" y1="0" x2="'+(-180+360*easeOut(strike))+'" y2="0" stroke="'+AMB2+'" stroke-width="12" stroke-linecap="round"/>';
  s+='</g>';
  // zavod tag drops lower with big amber
  const drop=clamp((p-0.4)/0.4);const e=back(drop);
  if(drop>0){s+='<g transform="translate('+cx+','+(cy+90+(1-e)*-80)+') scale('+(0.7+0.3*e)+')" opacity="'+clamp(drop*1.6)+'">'
    +'<rect x="-210" y="-60" width="420" height="120" rx="18" fill="'+AMB+'"/>'
    +'<circle cx="-178" cy="0" r="11" fill="#0c0a08"/><text x="20" y="18" text-anchor="middle" font-family="soyuz" font-size="64" fill="#0c0a08">ЗАВОД</text>'
    +'<text x="20" y="52" text-anchor="middle" font-family="man8" font-size="24" fill="#0c0a08">дешевле</text></g>';}
  s+='</svg>';
  return '<div style="opacity:'+bf(ts,a,b)+'">'+s+'</div>';
}

// A6 — IGNITION LOCKUP: ключ поворачивается, стрелка тахометра метёт, лого зажигается
function a6(ts){const a=29.1,b=34.3;const p=win(ts,a,b);if(p<0)return'';
  const cx=540,cy=880;
  const turn=easeInOut(clamp(p/0.4));    // key turn
  const rev=easeOut(clamp((p-0.25)/0.4));// tach sweep
  let s='<svg style="position:absolute;left:0;top:0" width="1080" height="1920">';
  // tach arc + needle
  const R=150,a0=-215,a1r=35;const ang=(a0+(a1r-a0)*rev)*Math.PI/180;
  s+='<path d="M'+(cx+Math.cos(a0*Math.PI/180)*R)+' '+(cy+Math.sin(a0*Math.PI/180)*R)+' A'+R+' '+R+' 0 1 1 '+(cx+Math.cos(a1r*Math.PI/180)*R)+' '+(cy+Math.sin(a1r*Math.PI/180)*R)+'" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="10"/>';
  s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+Math.cos(ang)*R*0.9)+'" y2="'+(cy+Math.sin(ang)*R*0.9)+'" stroke="'+AMB2+'" stroke-width="9" stroke-linecap="round" opacity="'+clamp(rev*1.5)+'"/>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="14" fill="'+AMB+'"/>';
  // ignition flash
  const fl=clamp((rev-0.7)/0.3);
  if(fl>0)s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(60+fl*180)+'" fill="none" stroke="'+AMB2+'" stroke-width="'+(10*(1-fl))+'" opacity="'+(fl*0.7)+'"/>';
  s+='</svg>';
  const lp=clamp((p-0.45)/0.28),e=back(lp);
  let lock='<div style="position:absolute;left:0;top:'+(cy-150)+'px;width:1080px;text-align:center;opacity:'+clamp(lp*1.5)+';transform:scale('+(0.72+0.28*e)+')">'
    +'<div style="font-family:soyuz;font-size:150px;line-height:.9;color:'+WHT+'">DIESEL</div>'
    +'<div style="font-family:soyuz;font-size:150px;line-height:.9;color:'+AMB2+'">CARGO</div></div>';
  const up=clamp((p-0.72)/0.22);
  lock+='<div style="position:absolute;left:'+(cx-260)+'px;top:'+(cy+120)+'px;width:'+(520*easeOut(up))+'px;height:8px;background:'+AMB+';border-radius:4px"></div>';
  lock+='<div style="position:absolute;left:0;top:'+(cy+150)+'px;width:1080px;text-align:center;font-family:man8;font-size:46px;color:'+WHT+';opacity:'+up+'">НАПИШИТЕ ГОРОД В КОММЕНТАРИЯХ</div>';
  return '<div style="opacity:'+bf(ts,a,b)+'">'+s+lock+'</div>';
}

window.render=function(t){const ts=t*TOTAL;stage.innerHTML=a1(ts)+a2(ts)+a3(ts)+a4(ts)+a5(ts)+a6(ts);};
window.render(0);
</script></body></html>
