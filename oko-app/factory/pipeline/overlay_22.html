<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'soyuz';src:url('file:///home/user/OKO-TEAM/oko-app/factory/fonts/SoyuzGrotesk-Bold.ttf')}
@font-face{font-family:'man8';src:url('file:///home/user/OKO-TEAM/oko-app/factory/fonts/manrope-v20-cyrillic_latin-800.ttf')}
@font-face{font-family:'mont9';src:url('file:///home/user/OKO-TEAM/oko-app/factory/fonts/montserrat-v31-cyrillic_latin-900.ttf')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
#stage{position:absolute;inset:0;font-family:'man8';color:#F6F4F1}
svg{overflow:visible}
</style></head><body><div id="stage"></div>
<script>
// BESPOKE overlays — reel #22 (batch A, МОТО двигатель). New forms, none reused:
// cutaway-draw · parts-spotlight · flow-path · durability-arc · blueprint-merge · liquid-fill lockup.
const TOTAL=30.72;
const AMB="#EA5920",AMB2="#FF7A3C",WHT="#F6F4F1",DIM="#8a8178",GRN="#7CCB4B",CYAN="#4FD1C5",CARD="rgba(16,12,10,.94)";
const stage=document.getElementById('stage');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,x)=>a+(b-a)*x;
const easeOut=x=>1-Math.pow(1-x,3);
const easeInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=2.1;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
function win(ts,a,b){if(ts<a-0.2||ts>b+0.3)return -1;return clamp((ts-a)/(b-a));}
function bf(ts,a,b){return clamp(Math.min((ts-a)/0.35,(b-ts)/0.35));}

// A1 — CUTAWAY-DRAW: контур разреза мотора прочерчивается линией
function a1(ts){const a=1.9,b=5.7;const p=win(ts,a,b);if(p<0)return'';
  const cx=540,cy=920;const draw=easeInOut(clamp(p/0.75));
  // engine block outline path (blocky) + cylinder circle
  const path="M-190 120 L-190 -40 L-90 -40 L-90 -160 L90 -160 L90 -40 L190 -40 L190 120 Z";
  const len=1500,off=len*(1-draw);
  let s='<svg style="position:absolute;left:0;top:0" width="1080" height="1920">';
  s+='<text x="540" y="'+(cy-320)+'" text-anchor="middle" font-family="man8" font-size="42" letter-spacing="4" fill="'+DIM+'">ЧТО РЕАЛЬНО ВНУТРИ?</text>';
  s+='<g transform="translate('+cx+','+cy+')">'
    +'<path d="'+path+'" fill="rgba(234,89,32,0.06)" stroke="'+AMB2+'" stroke-width="5" stroke-dasharray="'+len+'" stroke-dashoffset="'+off+'" stroke-linejoin="round"/>'
    +'<circle cx="0" cy="-70" r="'+(60*draw)+'" fill="none" stroke="'+CYAN+'" stroke-width="4"/>'   // cylinder bore
    +'<line x1="0" y1="-130" x2="0" y2="'+(-70+40*Math.sin(p*TOTAL*6))+'" stroke="'+WHT+'" stroke-width="10" stroke-linecap="round" opacity="'+draw+'"/>'  // piston rod hint
    +'</g>';
  s+='<text x="540" y="'+(cy+200)+'" text-anchor="middle" font-family="soyuz" font-size="58" fill="'+WHT+'" opacity="'+clamp((draw-0.7)/0.3)+'">БЕЗ МИФОВ, ПО ЖЕЛЕЗУ</text>';
  s+='</svg>';
  return '<div style="opacity:'+bf(ts,a,b)+'">'+s+'</div>';
}

// A2 — PARTS-SPOTLIGHT: прожектор по очереди подсвечивает узлы
function a2(ts){const a=5.9,b=9.8;const p=win(ts,a,b);if(p<0)return'';
  const parts=[["ЦИЛИНДР",330,860],["КОЛЕНВАЛ",540,1080],["КЛАПАНЫ",750,860]];const n=parts.length;
  const idx=Math.min(n-1,Math.floor(p*n));const[lbl,sx,sy]=parts[idx];
  let s='<svg style="position:absolute;left:0;top:0" width="1080" height="1920">';
  s+='<text x="540" y="640" text-anchor="middle" font-family="man8" font-size="42" letter-spacing="4" fill="'+DIM+'">ТА ЖЕ НАЧИНКА, ЧТО У БРЕНДОВ</text>';
  s+='<defs><radialGradient id="sp" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="rgba(255,200,140,0.35)"/><stop offset="1" stop-color="rgba(255,200,140,0)"/></radialGradient></defs>';
  // faint all parts
  parts.forEach((pt,i)=>{s+='<circle cx="'+pt[1]+'" cy="'+pt[2]+'" r="18" fill="'+(i===idx?AMB2:'rgba(255,255,255,.25)')+'"/>'
    +'<text x="'+pt[1]+'" y="'+(pt[2]+50)+'" text-anchor="middle" font-family="man8" font-size="28" fill="'+(i===idx?WHT:DIM)+'">'+pt[0]+'</text>';});
  // spotlight on current
  s+='<circle cx="'+sx+'" cy="'+sy+'" r="150" fill="url(#sp)"/>';
  s+='<circle cx="'+sx+'" cy="'+sy+'" r="40" fill="none" stroke="'+AMB+'" stroke-width="4"/>';
  s+='<text x="540" y="1250" text-anchor="middle" font-family="soyuz" font-size="70" fill="'+WHT+'">'+lbl+'</text>';
  s+='</svg>';
  return '<div style="opacity:'+bf(ts,a,b)+'">'+s+'</div>';
}

// A3 — FLOW-PATH: путь охлаждения светится бегущими штрихами, «НЕ ПЕРЕГРЕВАЕТСЯ»
function a3(ts){const a=10.1,b=13.9;const p=win(ts,a,b);if(p<0)return'';
  const cx=540,cy=920;
  const d="M-220 100 C-220 -80 -80 -120 0 -60 C 90 0 220 -40 220 -160";
  const grow=easeOut(clamp(p/0.6));const len=900,off=len*(1-grow);
  let s='<svg style="position:absolute;left:0;top:0" width="1080" height="1920">';
  s+='<text x="540" y="'+(cy-260)+'" text-anchor="middle" font-family="man8" font-size="42" letter-spacing="4" fill="'+DIM+'">ЖИДКОСТНОЕ ОХЛАЖДЕНИЕ</text>';
  s+='<g transform="translate('+cx+','+cy+')">'
    +'<path d="'+d+'" fill="none" stroke="rgba(79,209,197,.25)" stroke-width="16" stroke-linecap="round"/>'
    +'<path d="'+d+'" fill="none" stroke="'+CYAN+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="18 22" stroke-dashoffset="'+(-p*TOTAL*120)+'" opacity="'+grow+'"/>'
    +'<path d="'+d+'" fill="none" stroke="'+CYAN+'" stroke-width="10" stroke-dasharray="'+len+'" stroke-dashoffset="'+off+'" opacity="0.5"/>'
    +'</g>';
  s+='<text x="540" y="'+(cy+220)+'" text-anchor="middle" font-family="soyuz" font-size="56" fill="'+AMB2+'" opacity="'+clamp((grow-0.5)/0.4)+'">НЕ ПЕРЕГРЕВАЕТСЯ</text>';
  s+='</svg>';
  return '<div style="opacity:'+bf(ts,a,b)+'">'+s+'</div>';
}

// A4 — DURABILITY-ARC: дуга ресурса заметается + счётчик км
function a4(ts){const a=14.2,b=18.3;const p=win(ts,a,b);if(p<0)return'';
  const cx=540,cy=980,R=180;
  const sweep=easeInOut(clamp((p-0.05)/0.7));const km=Math.round(lerp(0,60000,sweep));
  const a0=140,a1r=140+260*sweep;
  function pt(deg){return[cx+Math.cos(deg*Math.PI/180)*R, cy+Math.sin(deg*Math.PI/180)*R];}
  const[sx,sy]=pt(a0),[ex,ey]=pt(a1r);const large=(a1r-a0)>180?1:0;
  let s='<svg style="position:absolute;left:0;top:0" width="1080" height="1920">';
  s+='<text x="540" y="'+(cy-300)+'" text-anchor="middle" font-family="man8" font-size="42" letter-spacing="4" fill="'+DIM+'">РЕСУРС ДВИГАТЕЛЯ</text>';
  s+='<path d="M'+cx+' '+(cy-R)+' A'+R+' '+R+' 0 1 1 '+(cx-0.01)+' '+(cy-R)+'" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="18"/>';
  s+='<path d="M'+sx+' '+sy+' A'+R+' '+R+' 0 '+large+' 1 '+ex+' '+ey+'" fill="none" stroke="'+AMB+'" stroke-width="18" stroke-linecap="round"/>';
  s+='<text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" font-family="mont9" font-size="86" fill="'+WHT+'">'+km.toLocaleString("ru-RU")+'</text>';
  s+='<text x="'+cx+'" y="'+(cy+55)+'" text-anchor="middle" font-family="man8" font-size="34" fill="'+AMB2+'">км и больше</text>';
  s+='</svg>';
  return '<div style="opacity:'+bf(ts,a,b)+'">'+s+'</div>';
}

// A5 — BLUEPRINT-MERGE: два силуэта (китай/премиум) наезжают и совпадают
function a5(ts){const a=18.5,b=22.7;const p=win(ts,a,b);if(p<0)return'';
  const cx=540,cy=900;const merge=easeInOut(clamp((p-0.1)/0.6));
  const off=(1-merge)*260;
  let s='<svg style="position:absolute;left:0;top:0" width="1080" height="1920">';
  s+='<text x="540" y="'+(cy-260)+'" text-anchor="middle" font-family="man8" font-size="42" letter-spacing="4" fill="'+DIM+'">РАЗНИЦА — ТОЛЬКО В ШИЛЬДИКЕ</text>';
  const engine="M-160 90 L-160 -30 L-80 -30 L-80 -120 L80 -120 L80 -30 L160 -30 L160 90 Z";
  s+='<g transform="translate('+(cx-off)+','+cy+')"><path d="'+engine+'" fill="none" stroke="'+CYAN+'" stroke-width="5"/><text x="0" y="150" text-anchor="middle" font-family="man8" font-size="30" fill="'+CYAN+'">КИТАЙ</text></g>';
  s+='<g transform="translate('+(cx+off)+','+cy+')"><path d="'+engine+'" fill="none" stroke="'+AMB2+'" stroke-width="5" stroke-dasharray="'+(merge>0.9?'0':'8 8')+'"/><text x="0" y="150" text-anchor="middle" font-family="man8" font-size="30" fill="'+AMB2+'">ПРЕМИУМ</text></g>';
  const eq=clamp((merge-0.85)/0.15);
  if(eq>0)s+='<text x="'+cx+'" y="'+(cy+10)+'" text-anchor="middle" font-family="soyuz" font-size="90" fill="'+WHT+'" opacity="'+eq+'">=</text>';
  s+='<text x="540" y="'+(cy+230)+'" text-anchor="middle" font-family="soyuz" font-size="52" fill="'+GRN+'" opacity="'+eq+'">ЖЕЛЕЗО ОДНО</text>';
  s+='</svg>';
  return '<div style="opacity:'+bf(ts,a,b)+'">'+s+'</div>';
}

// A6 — LIQUID-FILL LOCKUP: лого заливается амбер-жидкостью снизу вверх
function a6(ts){const a=23.0,b=28.2;const p=win(ts,a,b);if(p<0)return'';
  const cx=540,cy=880;
  const fill=easeInOut(clamp((p-0.05)/0.6));
  let s='<svg style="position:absolute;left:0;top:0" width="1080" height="1920">'
    +'<defs><clipPath id="txt"><text x="'+cx+'" y="'+cy+'" text-anchor="middle" font-family="soyuz" font-size="170" >DIESEL</text>'
    +'<text x="'+cx+'" y="'+(cy+150)+'" text-anchor="middle" font-family="soyuz" font-size="170">CARGO</text></clipPath></defs>';
  // outline text
  s+='<text x="'+cx+'" y="'+cy+'" text-anchor="middle" font-family="soyuz" font-size="170" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2">DIESEL</text>';
  s+='<text x="'+cx+'" y="'+(cy+150)+'" text-anchor="middle" font-family="soyuz" font-size="170" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2">CARGO</text>';
  // liquid fill via clip: a rising rect with wavy top
  const top=cy+180 - (cy+180-(cy-140))*fill;
  const amp=12*Math.max(0,1-fill), k=2*Math.PI/220, ph=p*TOTAL*4;
  let d='M'+(cx-380)+' '+(cy+220);
  for(let x=cx-380;x<=cx+380;x+=20){const y=top+Math.sin(x*k+ph)*amp;d+=' L'+x+' '+y.toFixed(1);}
  d+=' L'+(cx+380)+' '+(cy+220)+' Z';
  s+='<g clip-path="url(#txt)"><rect x="0" y="0" width="1080" height="1920" fill="#0c0a08"/><path d="'+d+'" fill="'+AMB2+'"/></g>';
  s+='</svg>';
  const up=clamp((p-0.7)/0.22);
  let lock='<div style="position:absolute;left:'+(cx-260)+'px;top:'+(cy+230)+'px;width:'+(520*easeOut(up))+'px;height:8px;background:'+AMB+';border-radius:4px"></div>';
  lock+='<div style="position:absolute;left:0;top:'+(cy+260)+'px;width:1080px;text-align:center;font-family:man8;font-size:46px;color:'+WHT+';opacity:'+up+'">НАПИШИТЕ ГОРОД В КОММЕНТАРИЯХ</div>';
  return '<div style="opacity:'+bf(ts,a,b)+'">'+s+lock+'</div>';
}

window.render=function(t){const ts=t*TOTAL;stage.innerHTML=a1(ts)+a2(ts)+a3(ts)+a4(ts)+a5(ts)+a6(ts);};
window.render(0);
</script></body></html>
