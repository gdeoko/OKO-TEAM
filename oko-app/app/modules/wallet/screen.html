<!-- КОШЕЛЁК v2: компактный главный экран (Сбер/Тинькофф style) -->
<section class="screen" id="screen-wallet">
  <div class="pad">

    <!-- ================= БАНКОВСКАЯ КАРТА-БАЛАНС ================= -->
    <div class="w2-card wal-hero" id="walHero">
      <div class="w2-card-top">
        <span class="w2-card-brand">OKO PAY</span>
        <button class="wal-eye" id="walEye" onclick="walToggleEye()" aria-label="Скрыть или показать баланс">
          <svg class="i"><use href="#i-eye"/></svg>
        </button>
      </div>
      <div class="w2-card-lbl">Доступно</div>
      <div class="wal-balance" id="walBalance">0 <b>₽</b></div>
      <div class="wal-hold" id="walHold" style="display:none">
        <svg class="i"><use href="#i-lock"/></svg>
        <span>В обработке: <b>0 ₽</b></span>
      </div>
      <div class="w2-card-foot">
        <button class="w2-card-num" onclick="walCopyAcc()" aria-label="Скопировать номер счёта">
          <span class="w2-card-num-dots">·· ·· ·· ··</span>
          <span class="w2-card-num-last" id="walAccLast">0000</span>
          <svg class="i"><use href="#i-copy"/></svg>
        </button>
        <span class="w2-card-acc-full" id="walAccNum">OKO-00000000</span>
      </div>
    </div>

    <!-- ================= 4 БЫСТРЫЕ КНОПКИ ================= -->
    <div class="w2-quick">
      <button class="w2-q" onclick="walOpenTopup()">
        <span class="w2-q-ic"><svg class="i"><use href="#i-plus"/></svg></span>
        <span>Пополнить</span>
      </button>
      <button class="w2-q" onclick="w2Open('transfers')">
        <span class="w2-q-ic"><svg class="i"><use href="#i-send"/></svg></span>
        <span>Перевести</span>
      </button>
      <button class="w2-q" onclick="w2OpenPay()">
        <span class="w2-q-ic"><svg class="i"><use href="#i-card"/></svg></span>
        <span>Оплатить</span>
      </button>
      <button class="w2-q" onclick="w2Open('history')">
        <span class="w2-q-ic"><svg class="i"><use href="#i-file"/></svg></span>
        <span>История</span>
      </button>
    </div>

    <!-- ================= XP-БЛОК (не валюта, а очки) ================= -->
    <button class="w2-xp" onclick="w2XpInfo()" aria-label="Про очки OKO">
      <span class="w2-xp-ic"><svg class="i"><use href="#i-xp"/></svg></span>
      <span class="w2-xp-b">
        <b><span id="walXpNum">0</span> XP</b>
        <em>Очки OKO — тратятся в Играх и Академии</em>
      </span>
      <svg class="i w2-xp-ch"><use href="#i-chev"/></svg>
    </button>

    <!-- ================= МЕНЮ-СПИСОК РАЗДЕЛОВ ================= -->
    <div class="w2-menu">
      <button class="w2-menu-r" onclick="w2Open('accounts')">
        <span class="w2-menu-ic"><svg class="i"><use href="#i-money"/></svg></span>
        <span class="w2-menu-t"><b>Мои счета</b><em id="walMenuAccSub">Рубли, TON, USDT</em></span>
        <svg class="i w2-menu-ch"><use href="#i-chev"/></svg>
      </button>
      <button class="w2-menu-r" onclick="w2Open('transfers')">
        <span class="w2-menu-ic"><svg class="i"><use href="#i-send"/></svg></span>
        <span class="w2-menu-t"><b>Переводы</b><em>Внутри OKO, на карту, в крипту</em></span>
        <svg class="i w2-menu-ch"><use href="#i-chev"/></svg>
      </button>
      <button class="w2-menu-r" onclick="w2Open('exchange')">
        <span class="w2-menu-ic"><svg class="i"><use href="#i-swap"/></svg></span>
        <span class="w2-menu-t"><b>Обмен валют</b><em>Курс OKO, комиссия 1%</em></span>
        <svg class="i w2-menu-ch"><use href="#i-chev"/></svg>
      </button>
      <button class="w2-menu-r" onclick="w2Open('autopay')">
        <span class="w2-menu-ic"><svg class="i"><use href="#i-crown"/></svg></span>
        <span class="w2-menu-t"><b>Автоплатежи и подписки</b><em id="walMenuAutoSub">Настрой шаблоны</em></span>
        <svg class="i w2-menu-ch"><use href="#i-chev"/></svg>
      </button>
      <button class="w2-menu-r" onclick="w2Open('goals')">
        <span class="w2-menu-ic"><svg class="i"><use href="#i-target"/></svg></span>
        <span class="w2-menu-t"><b>Финансовые цели</b><em id="walMenuGoalsSub">Копилки под мечты</em></span>
        <svg class="i w2-menu-ch"><use href="#i-chev"/></svg>
      </button>
      <button class="w2-menu-r" onclick="w2Open('analytics')">
        <span class="w2-menu-ic"><svg class="i"><use href="#i-briefcase"/></svg></span>
        <span class="w2-menu-t"><b>Аналитика и статистика</b><em>Расходы по категориям, график</em></span>
        <svg class="i w2-menu-ch"><use href="#i-chev"/></svg>
      </button>
      <button class="w2-menu-r" onclick="w2Open('receive')">
        <span class="w2-menu-ic"><svg class="i"><use href="#i-qr"/></svg></span>
        <span class="w2-menu-t"><b>QR-код для приёма</b><em>Пусть отсканируют и оплатят</em></span>
        <svg class="i w2-menu-ch"><use href="#i-chev"/></svg>
      </button>
      <button class="w2-menu-r" onclick="w2Open('history')">
        <span class="w2-menu-ic"><svg class="i"><use href="#i-file"/></svg></span>
        <span class="w2-menu-t"><b>История и выписка</b><em>CSV, PDF, поиск по операциям</em></span>
        <svg class="i w2-menu-ch"><use href="#i-chev"/></svg>
      </button>
      <button class="w2-menu-r" onclick="w2Open('security')">
        <span class="w2-menu-ic"><svg class="i"><use href="#i-lock"/></svg></span>
        <span class="w2-menu-t"><b>Безопасность</b><em id="walMenuSecSub">ПИН, Face-ID, лимиты</em></span>
        <svg class="i w2-menu-ch"><use href="#i-chev"/></svg>
      </button>
      <button class="w2-menu-r" onclick="w2Open('help')">
        <span class="w2-menu-ic"><svg class="i"><use href="#i-info"/></svg></span>
        <span class="w2-menu-t"><b>Помощь и лимиты</b><em>Как работает кошелёк OKO</em></span>
        <svg class="i w2-menu-ch"><use href="#i-chev"/></svg>
      </button>
    </div>

    <p class="w2-foot-note">
      Курс валют — внутренний, OKO Team. Комиссия обмена 1%.
      Крипта <b>TON</b> и <b>USDT</b> подключается через внешний кошелёк (Tonkeeper, TON Wallet).
      Вопросы — <b>@okohelp</b>.
    </p>
    <div style="height:14px"></div>
  </div>
</section>
