<!-- КОШЕЛЁК / ЛИЦЕВОЙ СЧЁТ -->
<section class="screen" id="screen-wallet">
  <div class="pad">
    <div class="wal-hero">
      <div class="wal-acc-row">
        <span class="wal-acc-label">Лицевой счёт</span>
        <button class="wal-acc" onclick="walCopyAcc()"><span id="walAccNum">OKO-00000000</span><svg class="i"><use href="#i-copy"/></svg></button>
      </div>
      <div class="wal-balance" id="walBalance">0 <b>₽</b></div>
      <div class="wal-hold" id="walHold"><svg class="i"><use href="#i-lock"/></svg><span>В холде (эскроу): <b>0 ₽</b></span></div>
      <div class="wal-actions">
        <button class="wal-act" onclick="walOpenTopup()"><svg class="i"><use href="#i-plus"/></svg>Пополнить</button>
        <button class="wal-act ghost" onclick="walOpenWithdraw()"><svg class="i"><use href="#i-card"/></svg>Вывести</button>
        <button class="wal-act ghost" onclick="walScrollHistory()"><svg class="i"><use href="#i-clock"/></svg>История</button>
      </div>
    </div>

    <h2 class="section-h" style="margin:22px 0 12px;font-size:21px">Расходы по категориям</h2>
    <div class="wal-cat-bar" id="walCatBar"></div>
    <div class="wal-cats" id="walCats"></div>

    <h2 class="section-h" id="walHistAnchor" style="margin:24px 0 4px;font-size:21px">История операций</h2>
    <div class="wal-filters" id="walFilters">
      <button class="on" data-f="all" onclick="walSetFilter('all')">Все</button>
      <button data-f="in" onclick="walSetFilter('in')">Пополнения</button>
      <button data-f="out" onclick="walSetFilter('out')">Списания</button>
    </div>
    <div class="card" style="padding:4px 14px" id="walLedger"></div>
    <div style="height:14px"></div>
  </div>
</section>
