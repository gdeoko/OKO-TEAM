<!-- РЕКЛАМНЫЙ КАБИНЕТ (модуль ads) -->
<section class="screen" id="screen-ads">
  <div class="pad">
    <div class="ads-head">
      <h2 class="section-h" style="margin-bottom:0">Рекламный кабинет</h2>
      <span class="ads-live" id="adsLive"><i></i>метрики live</span>
    </div>
    <div class="stat-grid ads-summary" id="adsSummary"></div>

    <div class="ads-tier up" id="adsTier"></div>

    <button class="btn ads-create-btn" onclick="adsOpenCreate()"><svg class="i"><use href="#i-megaphone"/></svg>Создать кампанию</button>
    <div class="ads-quick" id="adsQuick">
      <button class="ads-quick-b" onclick="adsOpenBilling()"><svg class="i"><use href="#i-card"/></svg><span>Биллинг</span><em id="adsQuickSpent">0 ₽</em></button>
      <button class="ads-quick-b" onclick="adsShowAuds()"><svg class="i"><use href="#i-bookmark"/></svg><span>Аудитории</span><em id="adsQuickAud">0</em></button>
      <button class="ads-quick-b boost" onclick="adsBoostPost()"><svg class="i"><use href="#i-rocket"/></svg><span>Boost поста</span><em>от 300 ₽</em></button>
    </div>

    <!-- Расчёт бюджета: ползунок с живым прогнозом охвата, кликов и регистраций -->
    <div class="card ads-calc" id="adsCalc"></div>

    <!-- Живые подсказки системы OKO по всем активным кампаниям (CPM, CTR, темп) -->
    <div class="ads-live-tip" id="adsLiveTip"></div>

    <!-- Промо-подсказки по постам ленты: «Твой пост Х набирает +N% CTR — запусти рекламу» -->
    <div class="ads-promo-recs" id="adsPromoRecs"></div>

    <!-- Топ-3 креатива по CTR из активных и завершённых кампаний -->
    <div class="ads-top3" id="adsTop3"></div>

    <!-- Шаблоны кампаний: клик открывает мастер с уже заполненными полями -->
    <div class="ads-presets-wrap" id="adsPresetsWrap"></div>

    <div class="card ads-ai-note">
      <span class="ads-ai-ic"><svg class="i"><use href="#i-bolt"/></svg></span>
      <div>
        <b>Модерация командой OKO</b>
        <small>Каждое объявление проверяется автоматически за ~3 секунды: запрещённые тематики, скам, азартные игры. Отклонили — бюджет вернётся на лицевой счёт мгновенно.</small>
      </div>
    </div>

    <h2 class="section-h" style="margin:22px 0 12px;font-size:21px">Кампании</h2>
    <div id="adsList"></div>
    <div style="height:14px"></div>
  </div>
</section>
