<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" width="820" height="260">
  <title>MARA — логотип</title>
  <defs>
    <pattern id="scan" width="8" height="9" patternUnits="userSpaceOnUse">
      <rect width="8" height="5" fill="#fff"/></pattern>
    <linearGradient id="dim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="ghost2">
      <rect x="0" y="88" width="200" height="90" fill="url(#scan2)" mask="url(#dim2)"/>
    </mask>
    <mask id="dim2"><rect x="0" y="88" width="200" height="90" fill="url(#dim)"/></mask>
    <pattern id="scan2" width="5" height="6" patternUnits="userSpaceOnUse">
      <rect width="5" height="3.2" fill="#fff"/></pattern>
    <filter id="g2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="820" height="260" fill="#000000"/>
  <g filter="url(#g2)">
    <path d="M124,44 L194,86 L54,86 Z" fill="#FF0A8C"/>
    <path d="M124,172 L194,90 L54,90 Z" fill="#FF0A8C" mask="url(#ghost2)"/>
    <g transform="translate(272,62)" fill="none" stroke="#FF0A8C"
       stroke-width="15" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M0,100 L0,0 L40,55 L80,0 L80,100" transform="translate(0,0)"/>
        <path d="M0,100 L40,0 L80,100" transform="translate(120,0)"/>
        <path d="M0,100 L0,0 L58,0 L74,16 L74,40 L58,56 L6,56" transform="translate(240,0)"/>
        <path d="M40,56 L80,100" transform="translate(240,0)"/>
        <path d="M0,100 L40,0 L80,100" transform="translate(360,0)"/>
    </g>
  </g>
  <text x="274" y="206" fill="#8A8792" font-family="Montserrat,system-ui,sans-serif"
        font-size="21" letter-spacing="10">ЕЁ НЕ СУЩЕСТВУЕТ</text>
</svg>
