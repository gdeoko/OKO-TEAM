<?xml version="1.0" encoding="UTF-8"?>
<!-- Concept C · Exchange Arrows E
     Буква E, где средняя черта — двунаправленная стрелка (свап). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 640" width="512" height="640">
  <rect width="512" height="640" fill="#ffffff"/>
  <g transform="translate(256 210)">
    <!-- E: три горизонтали + вертикаль -->
    <rect x="-115" y="-115" width="230" height="34" rx="4" fill="#1B5E3A"/>
    <rect x="-115" y="-115" width="34"  height="230" rx="4" fill="#1B5E3A"/>
    <rect x="-115" y="81"   width="230" height="34" rx="4" fill="#1B5E3A"/>
    <!-- средняя черта = двунаправленная стрелка -->
    <g fill="#7CC576">
      <rect x="-90" y="-17" width="180" height="34" rx="4"/>
      <polygon points="-114,0 -70,-30 -70,30"/>
      <polygon points=" 114,0  70,-30  70,30"/>
    </g>
  </g>
  <text x="256" y="460" text-anchor="middle"
        font-family="Montserrat, Arial, sans-serif"
        font-size="86" font-weight="800" fill="#1B5E3A" letter-spacing="3">EXORA</text>
  <text x="256" y="508" text-anchor="middle"
        font-family="Montserrat, Arial, sans-serif" font-size="20" font-weight="500"
        fill="#4A7A5A" letter-spacing="4">USDT · RUB · 24/7</text>
</svg>
