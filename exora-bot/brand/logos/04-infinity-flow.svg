<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <title>Exora — Infinity Flow Logo</title>
  <defs>
    <linearGradient id="gi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#68DDA6"/>
      <stop offset="60%" stop-color="#3FBF86"/>
      <stop offset="100%" stop-color="#2A9A6B"/>
    </linearGradient>
    <linearGradient id="giSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,.4)"/>
      <stop offset="30%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <linearGradient id="giInf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#04070E"/>
      <stop offset="50%" stop-color="#0a1420"/>
      <stop offset="100%" stop-color="#04070E"/>
    </linearGradient>
  </defs>

  <!-- Plate -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#gi)"/>
  <rect x="18" y="18" width="476" height="476" rx="106" fill="url(#giSheen)" opacity=".5"/>

  <!-- Infinity ∞ base -->
  <g transform="translate(256 256)">
    <path d="M -160 0
             C -160 -70, -80 -70, 0 0
             C 80 70, 160 70, 160 0
             C 160 -70, 80 -70, 0 0
             C -80 70, -160 70, -160 0 Z"
          fill="url(#giInf)"
          stroke="#062018" stroke-width="4" stroke-linejoin="round"/>
    <!-- Arrow tips on infinity (exchange indication) -->
    <path d="M -142 -22 L -168 -6 L -142 10 Z" fill="#5ED29C"/>
    <path d="M 142 22 L 168 6 L 142 -10 Z" fill="#5ED29C"/>
    <!-- E cutout in center -->
    <g transform="translate(-24 -34)" fill="#5ED29C">
      <rect x="0" y="0" width="48" height="12" rx="4"/>
      <rect x="0" y="0" width="12" height="68" rx="4"/>
      <rect x="0" y="56" width="48" height="12" rx="4"/>
      <rect x="0" y="28" width="36" height="12" rx="4"/>
    </g>
  </g>

  <!-- Wordmark below (optional) -->
  <text x="256" y="450" font-family="Inter, sans-serif" font-weight="800" font-size="42"
        letter-spacing="-1.5" text-anchor="middle" fill="#062018" opacity=".82">EXORA</text>
</svg>
