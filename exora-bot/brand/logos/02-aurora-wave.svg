<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <title>Exora — Aurora Wave Logo</title>
  <defs>
    <linearGradient id="ga" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1c2e"/>
      <stop offset="100%" stop-color="#04070E"/>
    </linearGradient>
    <linearGradient id="gaWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="45%" stop-color="#5ED29C"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="gaSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,.18)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="glow2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Dark plate -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#ga)"/>
  <rect x="18" y="18" width="476" height="476" rx="106" fill="url(#gaSheen)"/>
  <rect x="17" y="17" width="478" height="478" rx="107" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1"/>

  <!-- Aurora waves as E — 3 curved gradient strokes -->
  <g stroke="url(#gaWave)" stroke-linecap="round" fill="none" filter="url(#glow2)" opacity=".55">
    <path d="M 118 152 C 200 118, 300 118, 396 152" stroke-width="34"/>
    <path d="M 118 256 C 200 222, 300 222, 336 256" stroke-width="34"/>
    <path d="M 118 360 C 200 326, 300 326, 396 360" stroke-width="34"/>
  </g>
  <g stroke="url(#gaWave)" stroke-linecap="round" fill="none">
    <path d="M 118 152 C 200 118, 300 118, 396 152" stroke-width="28"/>
    <path d="M 118 256 C 200 222, 300 222, 336 256" stroke-width="28"/>
    <path d="M 118 360 C 200 326, 300 326, 396 360" stroke-width="28"/>
  </g>

  <!-- Left vertical stem tying the 3 waves into E -->
  <rect x="106" y="140" width="24" height="232" rx="12" fill="#5ED29C"/>
  <rect x="106" y="140" width="24" height="232" rx="12" fill="url(#gaSheen)" opacity=".7"/>
</svg>
