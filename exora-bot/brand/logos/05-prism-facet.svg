<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <title>Exora — Prism Facet Logo</title>
  <defs>
    <linearGradient id="gp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1420"/>
      <stop offset="100%" stop-color="#04070E"/>
    </linearGradient>
    <linearGradient id="gpF1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#68DDA6"/>
      <stop offset="100%" stop-color="#3FBF86"/>
    </linearGradient>
    <linearGradient id="gpF2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#5AC8FF"/>
      <stop offset="100%" stop-color="#3d8ac7"/>
    </linearGradient>
    <linearGradient id="gpF3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6D53CC"/>
    </linearGradient>
    <linearGradient id="gpSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,.14)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Dark plate -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#gp)"/>
  <rect x="18" y="18" width="476" height="476" rx="106" fill="url(#gpSheen)"/>

  <!-- Prism / faceted E — 3 diamond facets forming stacked E-shape -->
  <g transform="translate(256 256)">
    <!-- Top facet -->
    <path d="M -128 -128 L 128 -128 L 96 -60 L -96 -60 Z" fill="url(#gpF1)"/>
    <path d="M -128 -128 L 128 -128 L 96 -60 L -96 -60 Z" fill="url(#gpSheen)"/>
    <!-- Middle facet (narrower) -->
    <path d="M -96 -20 L 60 -20 L 40 32 L -76 32 Z" fill="url(#gpF2)"/>
    <path d="M -96 -20 L 60 -20 L 40 32 L -76 32 Z" fill="url(#gpSheen)"/>
    <!-- Bottom facet -->
    <path d="M -96 66 L 128 66 L 96 134 L -128 134 Z" fill="url(#gpF3)"/>
    <path d="M -96 66 L 128 66 L 96 134 L -128 134 Z" fill="url(#gpSheen)"/>
    <!-- Left spine connecting facets -->
    <path d="M -128 -128 L -96 -60 L -96 -20 L -76 32 L -96 66 L -128 134 L -114 134 L -82 66 L -62 32 L -82 -20 L -114 -60 Z" fill="rgba(255,255,255,.9)"/>
  </g>

  <!-- Corner ambient dots -->
  <circle cx="80" cy="80" r="3" fill="#5ED29C" opacity=".55"/>
  <circle cx="432" cy="80" r="3" fill="#5AC8FF" opacity=".55"/>
  <circle cx="80" cy="432" r="3" fill="#A78BFA" opacity=".55"/>
  <circle cx="432" cy="432" r="3" fill="#5ED29C" opacity=".55"/>
</svg>
