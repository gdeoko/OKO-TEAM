<!DOCTYPE html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"./three.js","three/addons/":"./addons/"}}</script>
<style>*{margin:0}body{background:transparent;width:900px;height:900px;overflow:hidden}</style>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './GLTFLoader.js';
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(900, 900); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(40, 1, 0.1, 100); cam.position.set(0, 0.6, 3.2);
scene.add(new THREE.AmbientLight(0xffffff, 1.1));
const key = new THREE.DirectionalLight(0xffe0c0, 2.2); key.position.set(2, 3, 2); scene.add(key);
const rim = new THREE.DirectionalLight(0x9CF806, 1.4); rim.position.set(-3, 1, -2); scene.add(rim);
const loader = new GLTFLoader();
window.ready = false; console.log('script start');
loader.load('../models/cam/scene.gltf', (g) => { console.log('gltf loaded');
  const obj = g.scene;
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3()).length();
  const center = box.getCenter(new THREE.Vector3());
  obj.position.sub(center); obj.scale.setScalar(2.2 / size);
  const pivot = new THREE.Group(); pivot.add(obj); scene.add(pivot);
  window.pivot = pivot; window.ready = true;
}, undefined, (e) => console.log('gltf ERROR', e.message||e));
window.renderAt = (angle) => {
  window.pivot.rotation.y = angle;
  window.pivot.rotation.x = 0.12 * Math.sin(angle * 0.7);
  renderer.render(scene, cam);
};
</script></body></html>
