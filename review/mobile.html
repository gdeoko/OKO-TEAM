<!doctype html><html lang="ru"><meta charset="utf-8"><title>Rocket · проверка адаптации</title><style>body{margin:20px;background:#1a2230;color:white;font:16px system-ui}iframe{display:block;width:320px;height:850px;border:1px solid #607080;margin:20px 0}button{font:inherit;padding:10px 16px;margin:4px;color:white;background:#263c55;border:1px solid #91b2d6;border-radius:8px}button[aria-pressed=true]{background:#2865a7}</style><p>Изолированный просмотр интерфейса · искусственные данные админки · графика проверяется отдельно</p><nav aria-label="Ширина проверки"><button aria-pressed="true">320</button><button aria-pressed="false">390</button><button aria-pressed="false">768</button><button aria-pressed="false">1440</button></nav><p id="width" aria-live="polite">Ширина: 320 px</p><iframe title="VPN" src="vpn/"></iframe><iframe title="Админка" src="admin-preview.html#настройки"></iframe><iframe title="Карточки" src="cards-preview.html"></iframe><script>document.querySelectorAll('nav button').forEach(button=>{button.onclick=()=>{let width=Number(button.textContent);document.querySelectorAll('iframe').forEach(frame=>frame.style.width=width+'px');document.querySelectorAll('nav button').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));document.getElementById('width').textContent='Ширина: '+width+' px';};});</script></html>
