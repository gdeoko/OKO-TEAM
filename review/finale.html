px; background: none; cursor: pointer;\n  color: var(--rv-текст-тихо); text-align: left;\n  font: 500 14px/1.2 var(--rv-шрифт);\n  transition: background-color .18s, color .18s;\n}\n.rv-мп-акт i {\n  font: 700 12px/1 var(--rv-шрифт-голос); font-style: normal;\n  color: var(--rv-индиго-свет); min-width: 20px;\n}\n.rv-мп-акт:hover, .rv-мп-акт:focus-visible {\n  background: rgba(var(--rv-индиго-rgb), .18); color: var(--rv-текст);\n}\n\n.rv-мп-дела { display: grid; gap: 4px; }\n.rv-мп-дело, .rv-мп-тема {\n  display: flex; align-items: center; gap: 12px;\n  width: 100%; min-height: 52px; padding: 9px 10px;\n  border: 1px solid transparent; border-radius: 4px;\n  background: none; cursor: pointer; text-align: left; text-decoration: none;\n  color: var(--rv-текст-тихо);\n  transition: background-color .18s, border-color .18s, color .18s;\n}\n.rv-мп-дело b, .rv-мп-тема b {\n  display: block; font: 600 14px/1.25 var(--rv-шрифт); color: var(--rv-текст);\n}\n.rv-мп-дело i, .rv-мп-тема i {\n  display: block; font: 400 12px/1.3 var(--rv-шрифт); font-style: normal;\n  color: var(--rv-текст-очень-тихо); margin-top: 2px;\n}\n.rv-мп-знак {\n  flex: none; width: 34px; height: 34px; display: grid; place-items: center;\n  border: 1px solid var(--rv-кромка); border-radius: 3px;\n  color: var(--rv-индиго-свет);\n}\n.rv-мп-знак svg { width: 19px; height: 19px; }\n.rv-мп-дело:hover, .rv-мп-дело:focus-visible,\n.rv-мп-тема:hover, .rv-мп-тема:focus-visible {\n  background: rgba(var(--rv-индиго-rgb), .16);\n  border-color: rgba(var(--rv-свет-rgb), .4);\n}\n/* Главное действие видно до чтения: ради него сайт и написан. */\n.rv-мп-дело.гл { border-color: rgba(var(--rv-свет-rgb), .45); background: rgba(var(--rv-индиго-rgb), .2); }\n.rv-мп-дело.гл .rv-мп-знак {\n  color: #FFFFFF; border-color: rgba(var(--rv-свет-rgb), .8);\n  box-shadow: 0 0 22px -8px rgba(var(--rv-свет-rgb), .95);\n}\n.rv-мп-тема { margin-top: 16px; border-top: 1px solid var(--rv-кромка); border-radius: 0; padding-top: 16px; }\n\n/* ── Форма обратной связи ─────────────────────────────────── */\n.rv-форма {\n  position: fixed; inset: 0; z-index: 99;\n  display: grid; place-items: center;\n  padding: 16px;\n  background: rgba(2, 3, 8, .72);\n  -webkit-backdrop-filter: blur(4px);\n  backdrop-filter: blur(4px);\n  opacity: 0; transition: opacity .26s ease;\n}\n.rv-форма-открыта .rv-форма { opacity: 1; }\n.rv-форма-плита {\n  position: relative;\n  width: min(460px, 100%);\n  max-height: calc(100vh - 32px); overflow-y: auto;\n  padding: 26px 22px 22px;\n  border: 1px solid var(--rv-кромка); border-radius: 6px;\n  background: var(--rv-меню-фон);\n  -webkit-backdrop-filter: blur(18px);\n  backdrop-filter: blur(18px);\n  transform: translateY(14px) scale(.985);\n  transition: transform .26s cubic-bezier(.2,.8,.2,1);\n}\n.rv-форма-открыта .rv-форма-плита { transform: none; }\n.rv-форма-плита .rv-мп-закрыть { position: absolute; top: 12px; right: 12px; }\n\n/* Та же плита, но стоящая в ленте подвала. Отменяем ровно три вещи из\n   оконного вида: подъезд снизу (окно приезжает, а лента стоит),\n   ограничение высоты экраном (в ленте резать нечего) и собственную\n   прокрутку (внутренняя полоса внутри страницы это ловушка для пальца:\n   человек тянет страницу, а уезжает форма). */\n.rv-связь { display: grid; justify-items: center; }\n.rv-форма-вподвале {\n  width: min(520px, 100%);\n  max-height: none; overflow: visible;\n  transform: none;\n  margin: calc(var(--rv-шаг) * 2) 0;\n}\n/* Подвал набран мелким и тихим - это его роль. Форма внутри него роль\n   меняет: у неё главное действие страницы, и тихой она быть не может. */\n.rv-форма-вподвале .rv-форма-заг { color: var(--rv-текст); }\n.rv-форма-вподвале a { min-height: 0; display: inline; }\n.rv-форма-заг {\n  margin: 0 0 6px; font: 700 clamp(22px, 5vw, 28px)/1.1 var(--rv-шрифт-голос);\n  color: var(--rv-текст);\n}\n.rv-форма-под { margin: 0 0 18px; font: 400 14px/1.5 var(--rv-шрифт); color: var(--rv-текст-тихо); }\n.rv-поле { display: block; margin-bottom: 14px; }\n.rv-поле > span {\n  display: block; margin-bottom: 6px;\n  font: 500 12px/1 var(--rv-шрифт); letter-spacing: .06em;\n  color: var(--rv-текст-тихо);\n}\n.rv-поле input, .rv-поле textarea {\n  width: 100%; padding: 11px 12px;\n  border: 1px solid var(--rv-кромка); border-radius: 3px;\n  background: var(--rv-поле-фон); color: var(--rv-текст);\n  font: 400 15px/1.4 var(--rv-шрифт);\n  transition: border-color .2s, box-shadow .2s;\n}\n.rv-поле textarea { resize: vertical; min-height: 76px; }\n.rv-поле input:focus, .rv-поле textarea:focus {\n  outline: none; border-color: rgba(var(--rv-свет-rgb), .8);\n  box-shadow: 0 0 0 3px rgba(var(--rv-индиго-rgb), .22);\n}\n.rv-согласие {\n  display: flex; gap: 10px; align-items: flex-start;\n  margin: 4px 0 16px; cursor: pointer;\n  font: 400 13px/1.45 var(--rv-шрифт); color: var(--rv-текст-тихо);\n}\n.rv-согласие input { width: 18px; height: 18px; margin-top: 1px; flex: none; accent-color: var(--rv-индиго-свет); }\n.rv-форма-беда {\n  margin: 0 0 12px; padding: 9px 11px;\n  border: 1px solid rgba(var(--rv-тревога-rgb), .5); border-radius: 3px;\n  background: rgba(var(--rv-тревога-rgb), .12);\n  font: 500 13px/1.4 var(--rv-шрифт); color: var(--rv-тревога);\n}\n/* Ловушка для роботов. Не display:none: часть роботов пропускает\n   скрытое так же, как его пропускает браузер, а вот увести поле за\n   край экрана и снять с обхода по табу видят единицы. */\n.rv-ловушка {\n  position: absolute; left: -9999px; top: auto;\n  width: 1px; height: 1px; overflow: hidden;\n}\n\n/* ═══ СВЕТЛАЯ ТЕМА ═══════════════════════════════════════════\n   Не «инверсия», а второе время суток одного мира. Сайт это космос, и\n   белая бумага ему чужая: днём здесь рассвет над планетой - холодная\n   светлая дымка, а не лист. Поэтому фон не #FFF, а светлый сине-серый,\n   и текст не чёрный, а очень тёмный индиго: чистый чёрный на голубом\n   даёт звон и режет глаз на просвет.\n\n   Марка не меняется ни на йоту: индиго остаётся индиго, темнеет\n   только его светлая ступень, чтобы буквы на светлом читались. */\n/* Схема цвета для СОБСТВЕННЫХ частей браузера: галочек, ползунков\n   прокрутки, курсора в поле. В разметке она прибита к тёмной ещё до\n   стилей, и в светлой теме галочка согласия рисовалась чёрным\n   квадратом на белой плите - не понять, стоит она или нет (поймано\n   снимком подвала на мониторе). Сама тема меняет её здесь. */\n:root { color-scheme: dark; }\n:root[data-тема=\"светлая\"] { color-scheme: light; }\n\n:root[data-тема=\"светлая\"] {\n  /* Средний холодный тон, а не белая бумага. На белом фоне светлые\n     карточки и светлое небо сливаются в одно молоко, и любое светлое\n     место кадра читается пересветом. Со средним тоном светлое снова\n     работает светлым. */\n  --rv-фон:        #D5DBEA;\n  --rv-подложка:   #D5DBEA;\n  --rv-фон-глубже: #D5DBEA00;\n  --rv-текст:      #0E1330;\n  /* Днём тихие ступени плотнее ночных. Ночью 62% и 38% светлой буквы\n     на тёмном читаются, а те же доли чернил на белом дают серый\n     #9AA0B5, и сноски пропадали (снимок акта «выход» на ПК). */\n  --rv-текст-тихо: rgba(14,19,48,.82);\n  --rv-текст-очень-тихо: rgba(14,19,48,.72);\n\n  --rv-индиго-тень: #1B2666;\n  --rv-индиго:      #2A3F9C;\n  --rv-индиго-свет: #2F49B8;\n  --rv-индиго-rgb:  42,63,156;\n  --rv-свет-rgb:    47,73,184;\n\n  --rv-кромка:      rgba(42,63,156,.26);\n  --rv-плита:       rgba(255,255,255,.76);\n  --rv-орган-фон:   rgba(255,255,255,.82);\n  --rv-меню-фон:    rgba(240,243,252,.94);\n  --rv-поле-фон:    rgba(255,255,255,.9);\n\n  /* Неон днём гаснет почти полностью. Свечение это свойство ТЕМНОТЫ:\n     на светлом фоне тот же ореол превращается в грязный ком вокруг\n     букв, и заголовок перестаёт читаться совсем. */\n  --rv-неон-ядро: rgba(42,63,156,.30);\n  --rv-неон-тело: rgba(42,63,156,.16);\n  --rv-неон-нимб: rgba(42,63,156,.08);\n  --rv-неон-сила: .35;\n}\n:root[data-тема=\"светлая\"] .rv-мп-пелена { background: rgba(20,26,54,.42); }\n:root[data-тема=\"светлая\"] .rv-форма { background: rgba(20,26,54,.5); }\n:root[data-тема=\"светлая\"] .rv-меню { box-shadow: 26px 0 60px -34px rgba(20,26,54,.5); }\n\n@media (max-width: 480px) {\n  .rv-меню { width: 100vw; border-right: 0; }\n  .rv-мп-акт { min-height: 48px; }\n}\n\n/* Заголовки в светлой теме. Свечение это свойство темноты: тот же\n   ореол на светлом фоне превращается в грязный ком вокруг знака, и\n   белая буква пропадает совсем. Днём заголовок держат КРАСКА и вес, а\n   свет остаётся ровно намёком под буквой. */\n:root[data-тема=\"светлая\"] .rv-заг {\n  color: #101838;\n  text-shadow: 0 1px 0 rgba(255,255,255,.6), 0 0 22px rgba(42,63,156,.10);\n}\n:root[data-тема=\"светлая\"] .rv-заг em {\n  color: #2A3F9C;\n  text-shadow: 0 1px 0 rgba(255,255,255,.6), 0 0 18px rgba(42,63,156,.16);\n}\n:root[data-тема=\"светлая\"] .rv-над i { color: #2A3F9C; }\n:root[data-тема=\"светлая\"] .rv-абз b { color: #101838; }\n\n/* ═══ МИР ДНЁМ ═══════════════════════════════════════════════\n   Объёмный мир нарисован СВЕТОМ ПО ЧЁРНОМУ: звёзды, ореолы, шлейфы -\n   всё это сложение яркостей. На светлом фоне сложение упирается в\n   белое, и мир пропадает целиком: остаётся пустая светлая страница с\n   текстом. Ровно это и значит «на светлой сливается всё».\n\n   Перекрашивать сам мир нельзя: у него полсотни материалов в шести\n   файлах, и половина из них светится по устройству, а не по краске.\n   Поэтому днём холст мира переворачивается по ЯРКОСТИ с сохранением\n   цвета: чёрное небо становится светлой дымкой, светящиеся линии -\n   чернильными. Поворот тона возвращает индиго индиго, иначе инверсия\n   увела бы его в оранжевый.\n\n   Прозрачность чуть ниже единицы: днём мир это подложка под чтение, а\n   не главный герой кадра. Ночью он остаётся героем. */\n:root[data-тема=\"светлая\"] .rv-мир {\n  /* Насыщенность поднята, контраст приспущен, прозрачность ниже.\n\n     Голая инверсия давала ровно то, чего днём быть не должно: серую\n     муть во весь экран. Причина простая - ночное небо почти\n     обесцвечено, и перевёрнутое оно даёт не голубое утро, а грязный\n     светло-серый. Насыщенность возвращает миру его индиго, приспущенный\n     контраст убирает грязь в полутонах, а меньшая прозрачность ставит\n     мир туда, где ему днём и место: за текст, воздухом. */\n  /* ПЕРЕВОРОТА ХОЛСТА БОЛЬШЕ НЕТ.\n\n     Он и был причиной двух жалоб сразу: «в светлой теме 3D пересвечен и\n     сливается с фоном» и «многое пересвечено непонятными нереалистичными\n     тонами». Переворот брал ночную сцену и выдавал почти белый кадр с\n     вывернутыми красками. Замер показал это прямо: холст в обеих темах\n     совпадал до долей процента, отличалась только обработка поверх.\n\n     Теперь день рисуется САМОЙ СЦЕНОЙ: дневное небо в шейдере\n     (rv-world.js, uDen), туман цвета неба, дневной стан света\n     (rv-real.js, светПоТеме). Мир днём остаётся миром, а не негативом. */\n  filter: none;\n  opacity: 1;\n}\n/* Холсты актов красятся своими красками из темы и переворачивать их\n   НЕЛЬЗЯ: они уже нарисованы чернилами по светлому, и вторая\n   инверсия вернула бы их в ночь поверх дневной страницы. */\n:root[data-тема=\"светлая\"] .rv-холст { filter: none; }\n\n/* ── Органы и мелочи в светлой теме ─────────────────────────── */\n\n/* Подложки постоянных органов были прибиты почти чёрным цветом. Днём\n   тёмная плашка в углу светлой страницы читается дырой, а не кнопкой:\n   берём ту же переменную, что у бургера и меню. */\n:root[data-тема=\"светлая\"] .rv-вход,\n:root[data-тема=\"светлая\"] .rv-звук { background: var(--rv-орган-фон); }\n:root[data-тема=\"светлая\"] .rv-вход { color: #1B2666; }\n:root[data-тема=\"светлая\"] .rv-звук { color: rgba(14,19,48,.7); }\n:root[data-тема=\"светлая\"] .rv-вход:hover,\n:root[data-тема=\"светлая\"] .rv-вход:focus-visible {\n  color: #FFFFFF; background: var(--rv-индиго);\n  text-shadow: none;\n}\n\n/* ТЁМНЫЕ ТЕНИ ПОД ТЕКСТОМ СНИМАЮТСЯ ЦЕЛИКОМ.\n\n   Они писались, чтобы светлая буква не пропадала на светящейся сцене:\n   ночью это правильно. Днём тот же приём даёт под каждой строкой\n   тёмный ореол, и текст выглядит грязно вдавленным - будто его\n   отпечатали через копирку. Владелец назвал это «сливается».\n\n   Заголовки перекрашены выше отдельно и своё лёгкое свечение\n   сохраняют, поэтому их здесь не трогаем. */\n:root[data-тема=\"светлая\"] .rv-абз,\n:root[data-тема=\"светлая\"] .rv-абз b,\n:root[data-тема=\"светлая\"] .rv-над,\n:root[data-тема=\"светлая\"] .rv-над span,\n:root[data-тема=\"светлая\"] .rv-сноска,\n:root[data-тема=\"светлая\"] .rv-плита,\n:root[data-тема=\"светлая\"] .rv-плита * { text-shadow: none; }\n\n/* Марка набрана светлыми буквами и на светлом фоне пропадает. Логотип\n   не перекрашиваем НИКОГДА - под него кладётся своя тёмная подушка.\n\n   Подушка растёт ТЕНЬЮ, а не отступом. Отступ с content-box менял\n   размер самой марки, и верх панели меню днём становился выше, чем\n   ночью: владелец увидел это как «размер шапки меняется при\n   переключении темы», и заодно назвал заплатку убогой. Тень с\n   разбегом даёт ту же подушку, не трогая раскладку ни на точку, а\n   мягкий ореол под ней превращает заплатку в табличку. */\n:root[data-тема=\"светлая\"] .rv-марка-гл,\n:root[data-тема=\"светлая\"] .rv-мп-марка {\n  border-radius: 12px;\n  background: #0C1026;\n  box-shadow: 0 0 0 9px #0C1026,\n              0 0 0 10px rgba(96,120,216,.30),\n              0 10px 24px -12px rgba(12,16,38,.7);\n}\n\n/* Тень под текстом снимается СПЛОШЬ, а не перечислением классов.\n\n   Перечисление я уже пробовал: карточки орбит остались с тёмным\n   ореолом, потому что их класс в список не попал. Список классов\n   всегда отстаёт от вёрстки на один класс. Правило одно: днём текст\n   держит краска, тени нет ни у кого. Заголовкам своё лёгкое свечение\n   возвращаем следующей же строкой - они и есть исключение. */\n:root[data-тема=\"светлая\"] .rv-слой *,\n:root[data-тема=\"светлая\"] .rv-меню *,\n:root[data-тема=\"светлая\"] .rv-подвал * { text-shadow: none; }\n:root[data-тема=\"светлая\"] .rv-заг {\n  text-shadow: 0 1px 0 rgba(255,255,255,.6), 0 0 22px rgba(42,63,156,.10);\n}\n:root[data-тема=\"светлая\"] .rv-заг em {\n  text-shadow: 0 1px 0 rgba(255,255,255,.6), 0 0 18px rgba(42,63,156,.16);\n}\n\n/* ═══ ПЛИТЫ ДНЁМ ════════════════════════════════════════════\n   Ночью плита это подсвеченный прибор: тёмное стекло, светящаяся\n   кромка. Днём тот же приём не работает - свечению не по чему\n   светиться, и от прибора остаётся серое пятно с размытым краем.\n\n   Днём плита это КАРТОЧКА: чистая светлая поверхность, тонкая\n   чернильная кромка, ровный край. Никакого размытия под ней. Выбранная\n   отличается заливкой и цветной рейкой слева, а не силой тени.\n   Отличать элементы яркостью тени - самый дешёвый приём, какой есть. */\n:root[data-тема=\"светлая\"] .rv-станции li,\n:root[data-тема=\"светлая\"] .rv-тех li,\n:root[data-тема=\"светлая\"] .rv-док,\n:root[data-тема=\"светлая\"] .rv-орбита {\n  background: rgba(255,255,255,.82);\n  border: 1px solid rgba(42,63,156,.18);\n  border-left-width: 3px;\n  border-left-color: rgba(42,63,156,.22);\n  box-shadow: none;\n}\n:root[data-тема=\"светлая\"] .rv-станции li:hover,\n:root[data-тема=\"светлая\"] .rv-тех li:hover,\n:root[data-тема=\"светлая\"] .rv-док:hover,\n:root[data-тема=\"светлая\"] .rv-орбита:hover,\n:root[data-тема=\"светлая\"] .rv-станции li.rv-станция-выбрана {\n  background: rgba(255,255,255,.95);\n  border-color: rgba(42,63,156,.34);\n  border-left-color: var(--rv-индиго);\n  box-shadow: none;\n}\n\n/* Выбранная станция днём: плотная светлая заливка с синим оттенком и\n   рейка, без свечения. Была прозрачная на 10%: там, где под колонкой\n   инвертированный мир серый, карточка уходила в тёмное, а буквы на ней\n   пропадали (снимок акта «выход»). */\n:root[data-тема=\"светлая\"] .rv-станции li.rv-станция-выбрана {\n  background: rgba(226,231,250,.96);\n  border-color: rgba(42,63,156,.34);\n  border-left-color: var(--rv-индиго);\n  box-shadow: none;\n}\n\n/* Цифры тарифов и долей днём. Ночью цена светлая с ореолом, и на\n   белой карточке та же строка становилась бледно-сиреневой, а\n   проценты бонусов пропадали вовсе (снимок акта «рубка» на телефоне\n   днём). Днём цифра чернильная, без свечения. */\n:root[data-тема=\"светлая\"] .rv-док u,\n:root[data-тема=\"светлая\"] .rv-орбита b {\n  color: #1B2666;\n  text-shadow: none;\n}\n:root[data-тема=\"светлая\"] .rv-шаги u { color: var(--rv-текст-тихо); }\n\n/* ═══ ШАПКА ═════════════════════════════════════════════════\n   Планка на всю ширину: марка слева, органы справа. Тёмная в обеих\n   темах - см. объяснение в rv-меню.js. */\n.rv-шапка {\n  position: fixed; top: 0; left: 0; right: 0;\n  z-index: 96;\n  display: flex; align-items: center; justify-content: space-between;\n  gap: 12px;\n  padding: 8px max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));\n  padding-top: max(8px, env(safe-area-inset-top));\n  /* Ровный тон, а не растяжка в прозрачность. Растяжка снизу мутнела\n     на светлой странице и читалась грязным краем; планка держится\n     кромкой, и край у неё должен быть чистый. */\n  background: rgba(7, 10, 24, .92);\n  -webkit-backdrop-filter: blur(14px) saturate(130%);\n  backdrop-filter: blur(14px) saturate(130%);\n  border-bottom: 1px solid rgba(96,120,216,.20);\n}\n.rv-шапка-марка {\n  display: flex; align-items: center;\n  min-height: 44px; padding: 0 4px;\n  text-decoration: none;\n}\n.rv-шапка-марка img { width: 38px; height: 38px; display: block; }\n.rv-шапка-право { display: flex; align-items: center; gap: 8px; }\n\n/* Органы внутри шапки перестают быть плавающими квадратами: они уже\n   стоят на её подложке, и вторая подложка под каждым читалась бы\n   кнопкой в кнопке. */\n.rv-шапка .rv-вход,\n.rv-шапка .rv-бургер {\n  position: static;\n  background: none;\n  -webkit-backdrop-filter: none;\n  backdrop-filter: none;\n}\n.rv-шапка .rv-вход {\n  border-color: rgba(96,120,216,.45);\n  color: #C7D0F5;\n}\n.rv-шапка .rv-вход:hover, .rv-шапка .rv-вход:focus-visible {\n  background: rgba(48,72,168,.42);\n  color: #FFFFFF;\n}\n.rv-шапка .rv-бургер { border-color: rgba(96,120,216,.45); color: #C7D0F5; }\n.rv-шапка .rv-бургер:hover, .rv-шапка .rv-бургер:focus-visible { color: #FFFFFF; }\n/* В светлой теме планка остаётся тёмной, значит и органы на ней. */\n:root[data-тема=\"светлая\"] .rv-шапка .rv-вход,\n:root[data-тема=\"светлая\"] .rv-шапка .rv-бургер {\n  background: none; color: #C7D0F5; border-color: rgba(150,170,255,.42);\n}\n:root[data-тема=\"светлая\"] .rv-шапка .rv-вход:hover { background: rgba(96,120,216,.4); color: #FFF; }\n\n/* ── Быстрые действия в планке ──────────────────────────────\n   Форма, бот, игра и тема стоят рядом ровным шагом. Кнопки без своей\n   подложки: планка уже тёмная в обеих темах, и вторая подложка под\n   каждой читалась бы кнопкой в кнопке. Кромка появляется только под\n   рукой, поэтому в покое ряд не рябит.\n\n   Высота планки НЕ ЗАВИСИТ ОТ ТЕМЫ: у всех органов одна высота 40 (44\n   под пальцем), и ни один из них не меняет размер при смене темы. */\n.rv-шапка-органы { display: flex; align-items: center; gap: 2px; }\n.rv-орган {\n  display: inline-flex; align-items: center; justify-content: center;\n  width: 40px; height: 40px; flex: none;\n  padding: 0; border: 1px solid transparent; border-radius: 3px;\n  background: none; color: #A9B4E4;\n  cursor: pointer;\n  transition: color .18s ease, border-color .18s ease, background-color .18s ease;\n}\n.rv-орган svg { width: 19px; height: 19px; display: block; }\n.rv-орган:hover, .rv-орган:focus-visible {\n  color: #FFFFFF;\n  border-color: rgba(96,120,216,.55);\n  background: rgba(48,72,168,.34);\n}\n/* Днём кнопка темы показывает луну: человеку нужно видеть, КУДА он\n   переключит, а не где стоит. Ночью остаётся солнце. */\n.rv-орган[aria-pressed=\"true\"] svg circle:first-child { fill: currentColor; }\n@media (pointer: coarse) { .rv-орган { width: 44px; height: 44px; } }\n/* Узкий экран: шаг мельче, чтобы шесть органов и марка встали в ряд\n   без переноса. Считано по 412 точкам: марка 38, шесть целей по 40,\n   поля по 12. */\n@media (max-width: 560px) {\n  .rv-шапка { gap: 6px; }\n  .rv-шапка-право { gap: 2px; }\n  .rv-орган { width: 38px; height: 40px; }\n  .rv-орган svg { width: 18px; height: 18px; }\n}\n@media (max-width: 400px) {\n  .rv-орган { width: 34px; }\n  .rv-орган svg { width: 17px; height: 17px; }\n}\n\n/* Плёнка уезжает под шапку: планка полупрозрачная и живёт поверх\n   мира, а не отнимает у него высоту. Отступ нужен только первому\n   экрану, чтобы марка акта не оказалась под планкой. */\n\n/* ── Телефон: слова стоят выше середины ────────────────────────\n   Слой акта выравнивается по центру кадра, и на широком экране это\n   верно: колонка слов слева, мир справа, глазу есть куда смотреть.\n   На телефоне колонка занимает всю ширину, и центрирование давало\n   пустую верхнюю половину: снимок 412x880 показал заголовок «видно»\n   на 452 из 1760 точек, выше него ни слова, ни мира. Рецензия назвала\n   это пустым верхом, и была права: человек открыл сайт и видит\n   полэкрана ничего.\n\n   Здесь колонка прижимается к верху и стоит на 19 процентах высоты\n   кадра, под шапкой (60 точек) остаётся воздух, а мир виден ниже и\n   вокруг слов. Девятнадцать, а не шестнадцать: в середине акта плёнка\n   ещё приподнимает слой на полсотни точек, и с меньшим полем заголовок\n   подходил к шапке на сорок точек. Границы clamp: ниже 130 точек\n   колонка залезает под шапку на низком экране, выше 190 верх снова\n   пустеет на высоком.\n\n   Только под плёнкой: без движения акты идут лентой с полями 12vh, и\n   там центрировать нечего. rv-лист.js учитывает это поле при замере\n   тесноты, иначе высокий акт, который раньше помещался впритык, теперь\n   уезжал бы низом за кромку. */\n@media (max-width: 760px) {\n  .rv-плёнка-идёт .rv-акт > .rv-кадр > .rv-слой {\n    align-content: start;\n    padding-top: clamp(130px, 19svh, 190px);\n  }\n  /* ── КНОПКИ ВНИЗУ, СЛОВА СВЕРХУ, ПРЕДМЕТ МЕЖДУ ─────────────\n     Владелец про телефон: «заголовок и подзаголовок сверху одна\n     третья часть экрана, а 3D объект в центре и снизу».\n\n     Слова уехали в объём и заняли верхнюю треть кадра сами. Скрытые\n     узлы разметки схлопнулись в точку, и всё, что осталось в слое -\n     кнопки - подъезжало к верху вслед за ними: замер на телефоне\n     ловил кнопку на 177 точке, то есть ровно в блоке слов сцены.\n\n     Прижимаем остаток слоя к низу. Правило стоит после общего и\n     весомее его на один класс: иначе выигрывало бы «сверху». */\n  html.рв-слова-в-сцене.rv-плёнка-идёт .rv-акт > .rv-кадр > .rv-слой {\n    align-content: end;\n    padding-top: 0;\n    padding-bottom: clamp(72px, 13svh, 132px);\n  }\n  /* Визитка первого кадра на телефоне уходит совсем. Марка уже стоит в\n     шапке, и второй логотип на экране спорил с заголовком сцены за одни\n     и те же восемьдесят точек. */\n  .rv-визитка { display: none; }\n}\n\n/* Марка первого экрана убрана: её место в шапке.\n\n   Она стояла крупно и одна, и это было верно, пока шапки не было.\n   Теперь брендов на экране два, причём нижний на светлой теме требовал\n   подложки и читался заплаткой. Первый экран ведут номер акта и\n   заголовок - типографикой, а не логотипом во второй раз. */\n.rv-марка-гл { display: none; }\n\n@media (max-width: 420px) {\n  .rv-шапка-марка img { width: 32px; height: 32px; }\n  .rv-шапка { gap: 8px; }\n}\n\n/* ══════════════════════════════════════════════════════════════\n   ОПОЗНАВАТЕЛИ: ПРИБОРНАЯ РАЗМЕТКА ПОВЕРХ МИРА\n\n   Владелец показал кадры igloo.inc: «текст как у них крутой с какими-то\n   опознавателями крутыми». У них поверх каждого предмета лежит тонкая\n   приборная разметка - крестики в точках съёма, волосяные линии между\n   ними, номера и подписи моноширинным.\n\n   Разметка делает предмет ИЗМЕРЯЕМЫМ. Пока картинка просто красивая,\n   глаз скользит мимо; как только на ней появляются точки съёма и\n   показания, мозг читает её как настоящий объект под наблюдением.\n\n   Всё здесь волосяное и тихое нарочно. Приборная разметка не спорит с\n   заголовком за внимание: она фон, который замечают вторым взглядом.\n   Толще одного пикселя линия сразу читается украшением.\n   ══════════════════════════════════════════════════════════════ */\n.rv-опозн {\n  position: fixed; inset: 0;\n  width: 100%; height: 100%;\n  pointer-events: none;\n  z-index: 2;\n  opacity: 0;\n  visibility: hidden;\n  /* Разметка живёт над холстом мира и ПОД колонкой слов: заголовок\n     всегда важнее показаний. */\n}\nhtml[data-тема=\"светлая\"] .rv-опозн { mix-blend-mode: multiply; }\n\n.rv-опозн-линия {\n  stroke: rgba(196, 210, 255, .42);\n  stroke-width: 1;\n  shape-rendering: crispEdges;\n}\n.rv-опозн-точка line {\n  stroke: rgba(214, 226, 255, .92);\n  stroke-width: 1;\n  shape-rendering: crispEdges;\n}\n.rv-опозн-точка text {\n  font-family: 'IBM Plex Mono', ui-monospace, monospace;\n  font-size: 10px; font-weight: 500;\n  letter-spacing: .06em;\n  fill: rgba(206, 219, 255, .82);\n}\n.rv-опозн-код text {\n  font-family: 'IBM Plex Mono', ui-monospace, monospace;\n  font-size: 11px; font-weight: 500;\n  letter-spacing: .10em;\n  fill: rgba(224, 233, 255, .95);\n}\n.rv-опозн-строка {\n  font-size: 10px !important;\n  fill: rgba(150, 172, 255, .78) !important;\n  letter-spacing: .08em !important;\n}\n.rv-опозн-черта {\n  stroke: rgba(150, 172, 255, .5);\n  stroke-width: 1;\n  shape-rendering: crispEdges;\n}\nhtml[data-тема=\"светлая\"] .rv-опозн-линия { stroke: rgba(30, 44, 92, .38); }\nhtml[data-тема=\"светлая\"] .rv-опозн-точка line { stroke: rgba(22, 34, 74, .85); }\nhtml[data-тема=\"светлая\"] .rv-опозн-точка text { fill: rgba(26, 38, 80, .8); }\nhtml[data-тема=\"светлая\"] .rv-опозн-код text { fill: rgba(18, 28, 66, .95); }\nhtml[data-тема=\"светлая\"] .rv-опозн-строка { fill: rgba(48, 72, 168, .8) !important; }\nhtml[data-тема=\"светлая\"] .rv-опозн-черта { stroke: rgba(48, 72, 168, .5); }\n\n@media (prefers-reduced-motion: reduce) { .rv-опозн { display: none; } }\n\n/* ══ Мини-игра ангара ═════════════════════════════════════════════\n   Панель только пишет и считает: створки, проём и ракета живут в сцене\n   (rv-игра.js). Отсюда и вид - не игровое поле, а приборная строка\n   рядом со словами акта.\n\n   Три точки заходов вместо цифры «2 из 3»: цифра требует прочитать и\n   сопоставить, точки читаются краем глаза, а игра идёт на ходу. */\n.rv-игра {\n  margin-top: 18px;\n  padding: 16px 18px 14px;\n  border: 1px solid var(--rv-кромка);\n  border-radius: 14px;\n  background: var(--rv-плита);\n  -webkit-backdrop-filter: blur(8px);\n  backdrop-filter: blur(8px);\n  max-width: 460px;\n}\n.rv-игра-звать {\n  margin: 0 0 12px;\n  font-size: 14px;\n  line-height: 1.45;\n  color: var(--rv-текст-тихо);\n}\n.rv-игра-счёт {\n  display: flex;\n  gap: 8px;\n  margin-bottom: 12px;\n}\n.rv-игра-счёт i {\n  width: 26px;\n  height: 4px;\n  border-radius: 2px;\n  background: rgba(var(--rv-свет-rgb), .22);\n  transition: background .28s ease, box-shadow .28s ease;\n}\n.rv-игра-счёт i[data-взят=\"1\"] {\n  background: var(--rv-индиго-свет);\n  box-shadow: 0 0 10px rgba(var(--rv-свет-rgb), .7);\n}\n.rv-игра .rv-кн { margin: 0; }\n/* Выигранная кнопка ведёт в бот и обязана выглядеть иначе, чем «Пуск»:\n   это уже не ход игры, а дверь наружу. */\n.rv-игра .rv-кн[data-победа=\"1\"] {\n  background: linear-gradient(135deg, #2E7D5B, #46C48A);\n  border-color: rgba(70, 196, 138, .5);\n}\n.rv-игра-итог {\n  margin: 10px 0 0;\n  min-height: 1.2em;\n  font-size: 13px;\n  line-height: 1.4;\n  color: var(--rv-текст-тихо);\n}\n@media (max-width: 640px) {\n  .rv-игра { padding: 14px 14px 12px; margin-top: 14px; }\n  .rv-игра-звать { font-size: 13px; }\n}\nhtml[data-тема=\"светлая\"] .rv-игра-счёт i { background: rgba(48, 72, 168, .2); }\n\n/* ══ Вступление ═══════════════════════════════════════════════════\n   Пока камера спускается на Луну, кадр принадлежит миру. Заголовок\n   поверх пролёта отнимает у пролёта ровно то, ради чего он и делается,\n   поэтому слова первого акта ждут посадки и проявляются после неё.\n\n   Прячется только СЛОЙ СЛОВ. Шапка, вход в кабинет и кнопка звука\n   остаются: это органы управления, и человек, пришедший войти в\n   кабинет, не обязан ждать пять секунд ради красоты.\n\n   Гасим прозрачностью и сдвигом, а не display: скрытый через display\n   элемент теряет высоту, и разметка на его возврате прыгает. */\nhtml.рв-вступление .rv-акт[data-акт=\"станция\"] .rv-слой {\n  opacity: 0;\n  transform: translateY(14px);\n  pointer-events: none;\n}\n.rv-акт[data-акт=\"станция\"] .rv-слой {\n  transition: opacity .7s cubic-bezier(.4,0,.2,1) .15s,\n              transform .7s cubic-bezier(.4,0,.2,1) .15s;\n}\n@media (prefers-reduced-motion: reduce) {\n  html.рв-вступление .rv-акт[data-акт=\"станция\"] .rv-слой {\n    opacity: 1; transform: none;\n  }\n  .rv-акт[data-акт=\"станция\"] .rv-слой { transition: none; }\n}\n\n/* ══ Карточки актов ═══════════════════════════════════════════════\n   Четыре боли периметра, что внутри подписки в ангаре, цены и даты\n   падений в пуске. Один класс на все три места: карточка везде живёт\n   по одному закону, и разводить три похожих списка значило бы завести\n   три места, где потом придётся править одно и то же.\n\n   В периметре эти карточки по сценарию прилетают в стену снарядами и\n   втыкаются в неё. Разметка держит текст и порядок, полёт идёт в\n   сцене: слова обязаны остаться словами, даже если объём не собрался. */\n.rv-карты {\n  list-style: none;\n  margin: 18px 0 0;\n  padding: 0;\n  display: grid;\n  gap: 10px;\n  max-width: 560px;\n}\n.rv-карты li {\n  padding: 12px 14px;\n  border: 1px solid var(--rv-кромка);\n  border-radius: 12px;\n  background: var(--rv-плита);\n  -webkit-backdrop-filter: blur(8px);\n  backdrop-filter: blur(8px);\n}\n.rv-карты b {\n  display: block;\n  font-size: 13px;\n  letter-spacing: .02em;\n  margin-bottom: 4px;\n  color: var(--rv-текст);\n}\n.rv-карты span {\n  display: block;\n  font-size: 13px;\n  line-height: 1.45;\n  color: var(--rv-текст-тихо);\n}\n/* Четыре карточки боли в две колонки: на широком экране колонка в один\n   ряд уводит последнюю карточку под обрез кадра. */\n@media (min-width: 900px) {\n  .rv-карты { grid-template-columns: 1fr 1fr; max-width: 720px; }\n}\n@media (max-width: 640px) {\n  .rv-карты { margin-top: 12px; gap: 8px; }\n  .rv-карты li { padding: 10px 12px; }\n  .rv-карты b, .rv-карты span { font-size: 12px; }\n}\n\n/* ══ Слова уехали в сцену ═════════════════════════════════════════\n   Признак ставится только когда объём собрался и атлас доехал\n   (rv-слово3d.js). Не собрался - человек видит обычный текст и не\n   теряет ничего.\n\n   Разметка остаётся в дереве, а не удаляется: её читают поисковик и\n   голосовой помощник, а у холста для них нет ни строчки. Прячем\n   способом, который не выносит узел из потока чтения. */\nhtml.рв-слова-в-сцене .rv-слой .rv-над,\nhtml.рв-слова-в-сцене .rv-слой .rv-заг,\nhtml.рв-слова-в-сцене .rv-слой .rv-абз,\nhtml.рв-слова-в-сцене .rv-слой .rv-сноска,\nhtml.рв-слова-в-сцене .rv-слой .rv-карты {\n  position: absolute;\n  width: 1px; height: 1px;\n  overflow: hidden;\n  clip-path: inset(50%);\n  white-space: nowrap;\n}\n/* Кнопки и всё, по чему кликают, остаются на месте: в холсте по ним не\n   попасть пальцем, а увести их в объём значит отобрать у человека\n   единственное действие на экране. */\n\n/* ══ Визитка первого кадра и манифест ═════════════════════════════\n   Набор igloo: слева вверху марка крупно, под ней мелкая строка, справа\n   вверху манифест. У них марка и есть заголовок; у нас заголовок ниже и\n   продающий, потому что задача другая - продать подписку, а не\n   представить студию.\n\n   Оба блока живут в разметке, а не в сцене, и это осознанно. Марка это\n   настоящий логотип картинкой (правило проекта: лого только настоящее,\n   без перерисовок), а по ней ещё и кликают. Манифест держит ей пару по\n   набору, и разводить их по разным слоям значило бы развести и их\n   типографику.\n\n   Стоят они НАД холстом и НЕ участвуют в прокрутке акта: это шапка\n   кадра, она принадлежит первому экрану целиком. */\n.rv-визитка,\n.rv-манифест {\n  position: absolute;\n  top: clamp(72px, 9vh, 104px);\n  z-index: 3;\n  pointer-events: none;\n}\n.rv-визитка { left: clamp(16px, 4vw, 56px); }\n/* ── МАНИФЕСТ УЖЕ НА СОРОК ТОЧЕК ──────────────────────────────────\n   Слова первого акта переехали из левой колонки в середину кадра\n   (см. data-слова у секции «станция»). Колонка сцены занимает средние\n   пятьдесят два процента ширины, то есть на мониторе в 1440 её правый\n   край стоит на 1094. Манифест шириной 320 начинался на 1064 - тридцать\n   точек наложения, ровно та «невидимая херня», которой владелец\n   недоволен каждым письмом.\n   280 отодвигают его начало на 1104: между колонкой и манифестом\n   остаётся воздух, а сам он читается так же. */\n.rv-манифест {\n  right: clamp(16px, 4vw, 56px);\n  max-width: min(26vw, 280px);\n  text-align: right;\n}\n.rv-визитка-марка {\n  display: flex; align-items: center; gap: 12px;\n  text-decoration: none; color: inherit;\n  pointer-events: auto;\n}\n.rv-визитка-марка img {\n  width: clamp(44px, 5vw, 64px); height: auto; display: block;\n}\n/* Слово марки набрано тем же моноширинным, что и весь текст сайта.\n   Второй строкой VPN в лайме: у igloo слово логотипа тоже двухцветное\n   по весу, и этот приём связывает визитку с приборной графикой. */\n.rv-визитка-марка b {\n  font-family: var(--rv-шрифт-моно, ui-monospace, \"IBM Plex Mono\", monospace);\n  font-size: clamp(20px, 2.2vw, 30px);\n  font-weight: 600;\n  letter-spacing: .10em;\n  line-height: 1;\n  color: var(--rv-текст);\n  display: block;\n}\n.rv-визитка-марка i {\n  display: block; font-style: normal;\n  font-size: .62em; letter-spacing: .34em;\n  color: var(--rv-индиго-свет);\n  margin-top: 4px;\n}\n.rv-визитка-низ,\n.rv-манифест-шапка,\n.rv-манифест-текст {\n  font-family: var(--rv-шрифт-моно, ui-monospace, \"IBM Plex Mono\", monospace);\n  font-size: clamp(10px, 1vw, 12px);\n  line-height: 1.55;\n  margin: 0;\n}\n.rv-визитка-низ {\n  margin-top: 14px;\n  color: var(--rv-текст-очень-тихо);\n  letter-spacing: .04em;\n}\n.rv-манифест-шапка {\n  color: var(--rv-индиго-свет);\n  letter-spacing: .16em;\n  margin-bottom: 8px;\n}\n.rv-манифест-текст { color: var(--rv-текст-тихо); }\n\n/* На узком экране манифест уходит: он украшение, а место на телефоне\n   принадлежит заголовку и кнопке. */\n@media (max-width: 720px) {\n  .rv-манифест { display: none; }\n  .rv-визитка { top: clamp(64px, 8vh, 84px); }\n  .rv-визитка-низ { display: none; }\n}\n\n/* ══ Кнопка, когда слова уехали в сцену ═══════════════════════════\n   Слой слов раскладывается сеткой по центру кадра. Пока в нём лежали\n   заголовок и абзац, кнопка стояла под ними и попадала в нижнюю треть\n   сама собой. Слова уехали в объём, скрытые узлы схлопнулись в точку, и\n   кнопка подъехала к середине - ровно туда, где теперь стоит абзац из\n   сцены. На снимке они легли друг на друга.\n\n   Прижимаем содержимое слоя к низу и оставляем сверху место под блок\n   слов сцены: он занимает примерно верхние две трети кадра. */\nhtml.рв-слова-в-сцене .rv-слой {\n  align-content: end;\n  padding-bottom: clamp(64px, 16vh, 160px);\n}\n@media (max-width: 720px) {\n  html.рв-слова-в-сцене .rv-слой { padding-bottom: clamp(48px, 12vh, 96px); }\n}\n\n/* Блоки, которые заполняет скрипт (технологии, станции, тарифы, шаги,\n   надёжность), тоже слова акта. Пока текст жил поверх холста, они были\n   его частью; после переезда слов в сцену они остались висеть плитками\n   поверх мира и повторяли то, что уже сказано в объёме.\n\n   Прячем тем же способом: узел остаётся в дереве для поисковика. */\nhtml.рв-слова-в-сцене .rv-слой [data-заполнить] {\n  position: absolute;\n  width: 1px; height: 1px;\n  overflow: hidden;\n  clip-path: inset(50%);\n}\n\n/* ══ Дела обхода: кнопки и анкета по разделам ═════════════════════\n   Владелец про комнату с частицами: «по скроллу мы обходим вокруг,\n   потом смотрим разделы с текстом и анкету и кнопки всякие. Главное,\n   что текст не перекрывает наши 3D объекты и сцену, текст часть этой\n   сцены как у igloo».\n\n   Слова разделов уехали в объём, а по кнопке в холсте пальцем не\n   попасть - значит, действия остаются разметкой. Чтобы они всё-таки\n   читались частью сцены, а не панелью поверх неё, держим два правила.\n\n   ПЕРВОЕ: стоят там же, где говорят слова. Колонка слов в комнате\n   правая (rv-слово3d.js, раскладка «справа»): правый край на семи\n   процентах от кромки кадра, ширина сорок два процента. Повторяем те же\n   доли - действие продолжает свой абзац, а не спорит с ним за место.\n   Панель мини-игры раньше стояла слева внизу и ложилась прямо на фигуру\n   из частиц; это ровно то, на что владелец и указал.\n\n   ВТОРОЕ: показывается ровно одно, то же, что говорит сцена. Признак\n   data-сектор ставит слой слов при каждой смене раздела. */\n.rv-дело {\n  position: absolute;\n  right: 7%;\n  top: 62%;\n  width: 42%;\n  display: flex; flex-wrap: wrap; justify-content: flex-end;\n  gap: 10px;\n  z-index: 4;\n  /* Скрыто, пока сцена не назвала свой раздел. Гасим прозрачностью и\n     сдвигом, как гаснут строки в объёме: у них тоже нет мгновенных\n     переключений. */\n  opacity: 0; transform: translateY(10px);\n  pointer-events: none;\n  transition: opacity .32s ease, transform .32s ease;\n}\n/* ── ПЕРЕЧЕНЬ СВЕРЕН С РАЗМЕТКОЙ, А НЕ ДОПИСАН ПРО ЗАПАС ─────────\n   Здесь не было строки «рубка:0», и кнопка первого раздела зала\n   («Проверить маршрут») не показывалась НИКОГДА - раздел есть, кнопка\n   в разметке есть, правила показа нет. Зато стояли рубка:3, рубка:4 и\n   четыре строки про пуск: разделов с такими номерами в разметке нет\n   вовсе, в зале их три, а пуск по сценарию владельца идёт молча. */\nhtml[data-сектор=\"рубка:0\"] .rv-дело[data-сектор=\"рубка:0\"],\nhtml[data-сектор=\"рубка:1\"] .rv-дело[data-сектор=\"рубка:1\"],\nhtml[data-сектор=\"рубка:2\"] .rv-дело[data-сектор=\"рубка:2\"] {\n  opacity: 1; transform: none;\n  pointer-events: auto;\n}\n/* Пока объём не поднялся, слова живут в разметке обычным текстом, и\n   вторая колонка справа тогда лишняя: действия встают в поток под\n   словами, как на любой странице. */\nhtml:not(.рв-слова-в-сцене) .rv-дело {\n  position: static; width: auto; opacity: 1; transform: none;\n  pointer-events: auto; justify-content: flex-start; margin-top: 16px;\n}\n@media (max-width: 720px) {\n  /* На телефоне колонки нет вовсе: слова идут во всю ширину, и действие\n     под ними тоже. Прижимаем к низу кадра, чтобы кнопка попадала под\n     большой палец. */\n  .rv-дело {\n    right: var(--rv-поле); left: var(--rv-поле);\n    width: auto; top: auto; bottom: clamp(48px, 12vh, 96px);\n    justify-content: flex-start;\n  }\n  .rv-дело > .rv-кн { flex: 1 1 auto; justify-content: center; }\n}\n\n/* ── Анкета ──────────────────────────────────────────────────────\n   Три поля и одна кнопка. Подложки у полей нет, только нижняя черта:\n   плита под формой закрыла бы комнату ровно так же, как её закрывала\n   панель игры. */\n.rv-анкета { width: 100%; display: grid; gap: 12px; text-align: left; }\n.rv-анкета label { display: grid; gap: 5px; }\n.rv-анкета label span {\n  font: 600 11px/1 var(--rv-шрифт); letter-spacing: .14em;\n  text-transform: uppercase; color: var(--rv-текст-тихо);\n}\n.rv-анкета input,\n.rv-анкета textarea {\n  width: 100%; padding: 9px 2px;\n  border: 0; border-bottom: 1px solid var(--rv-кромка);\n  background: transparent; color: var(--rv-текст);\n  font: 400 14px/1.45 var(--rv-шрифт);\n  resize: vertical;\n  transition: border-color .2s, box-shadow .2s;\n}\n.rv-анкета input::placeholder,\n.rv-анкета textarea::placeholder { color: var(--rv-текст-тихо); opacity: .55; }\n.rv-анкета input:focus,\n.rv-анкета textarea:focus {\n  outline: none;\n  border-bottom-color: rgba(var(--rv-свет-rgb), .9);\n  box-shadow: 0 1px 0 0 rgba(var(--rv-свет-rgb), .5);\n}\n.rv-анкета-ряд { display: flex; flex-wrap: wrap; gap: 10px; margin: 2px 0 0; }\n.rv-анкета-итог {\n  margin: 0; min-height: 1.2em;\n  font-size: 13px; line-height: 1.4; color: var(--rv-текст-тихо);\n}\n/* Панель игры внутри колонки уже не плита поверх мира: рамку и фон\n   снимаем, остаётся строка приборов рядом со словами. */\n.rv-дело .rv-игра {\n  margin: 0; padding: 0; max-width: none; width: 100%;\n  border: 0; background: none;\n  -webkit-backdrop-filter: none; backdrop-filter: none;\n  text-align: left;\n}\n\n\n/* ══ ЛЕНТА ЗАПЕРТА, ПОКА КАМЕРА САДИТСЯ ═══════════════════════════\n   Владелец: «на стартовой загрузке у них нельзя скроллить вниз, пока\n   камера не отпустится и пока загрузка не пройдёт».\n\n   Замок ставит и снимает мир (rv-world.js): он один знает, когда\n   вступление кончилось. Здесь только сам запрет - разметкой, а не\n   скриптом, иначе между отрисовкой страницы и запуском скрипта\n   остаётся окно, в которое ленту успевают дёрнуть.\n\n   overscroll-behavior обязателен вместе с overflow: без него телефон\n   отдаёт жест «потянуть вниз» браузеру и страница дёргается целиком. */\nhtml.рв-замок,\nhtml.рв-замок body {\n  overflow: hidden !important;\n  overscroll-behavior: none;\n  touch-action: none;\n}\n\n\n/* ══ СТРАНИЦА ВНУТРИ ГЛЫБЫ ЛЬДА ═══════════════════════════════════\n   Сценарий владельца: «если нажать на глыбу, внутрь уходит камера с\n   ускорением, там фон соответствующий, как будто мы внутри льдины, эта\n   иконка с небольшой подсветкой и текст, описание, и кнопка выхода как\n   у них, прямо один в один».\n\n   У igloo это тёмная страница поверх сцены: слева вверху марка, справа\n   вверху «Close» в уголках рамки, ниже «////// Summary» и абзацы\n   моноширинным набором. За текстом просвечивает толща льда - у них\n   видны грани самой глыбы, в которую мы вошли.\n\n   Здесь то же самое. Подложка полупрозрачная и размытая, поэтому лёд,\n   который в этот момент накрыл объектив, остаётся виден за словами и\n   держит обещание «мы внутри предмета», а не «поверх него открылась\n   панель». */\n.rv-внутрь {\n  position: fixed; inset: 0; z-index: 60;\n  display: grid; grid-template-rows: auto 1fr;\n  padding: clamp(16px, 3vw, 34px);\n  gap: clamp(18px, 4vh, 44px);\n  color: var(--rv-текст, #E8ECF7);\n  /* Подложка ЛЁГКАЯ: за словами обязана просвечивать толща льда, в\n     которую мы вошли. На плотной заливке кадр выходил чёрным листом с\n     текстом, и обещание «мы внутри предмета» не читалось вовсе. */\n  background: linear-gradient(180deg,\n              rgba(9, 13, 26, 0.30) 0%, rgba(9, 13, 26, 0.62) 46%,\n              rgba(6, 9, 18, 0.86) 100%);\n  -webkit-backdrop-filter: blur(2px) saturate(1.05);\n  backdrop-filter: blur(2px) saturate(1.05);\n  opacity: 0; pointer-events: none;\n  transition: opacity .42s cubic-bezier(.4,0,.2,1);\n}\n.rv-внутрь.рв-видно { opacity: 1; pointer-events: auto; }\n/* На влёте страница ещё не показана, но подложка уже собирается: без\n   этого лёд накрывает объектив и кадр на четверть секунды остаётся\n   пустым. */\n.rv-внутрь.рв-влёт { opacity: .18; }\n\n.rv-внутрь-шапка {\n  display: flex; align-items: center; justify-content: space-between;\n  gap: 16px;\n}\n.rv-внутрь-марка {\n  margin: 0; font-family: var(--rv-моно, ui-monospace, monospace);\n  font-size: clamp(15px, 2.2vw, 22px); letter-spacing: .16em;\n  font-weight: 700; color: #FFFFFF;\n}\n.rv-внутрь-марка i { font-style: normal; color: var(--rv-акцент, #7C8CFF); }\n\n/* Кнопка выхода в уголках рамки - их приём. Уголки рисуются двумя\n   градиентами, а не картинкой: их четыре штуки и они обязаны тянуться\n   за размером кнопки. */\n.rv-внутрь-выход {\n  position: relative;\n  appearance: none; -webkit-appearance: none;\n  background: none; border: 0; cursor: pointer;\n  color: #FFFFFF;\n  font-family: var(--rv-моно, ui-monospace, monospace);\n  font-size: clamp(13px, 1.6vw, 16px); letter-spacing: .12em;\n  padding: clamp(10px, 1.4vw, 14px) clamp(20px, 2.6vw, 30px);\n  min-height: 44px;\n}\n.rv-внутрь-уголки {\n  position: absolute; inset: 0; pointer-events: none;\n  background:\n    linear-gradient(#FFF, #FFF) left top / 12px 1px no-repeat,\n    linear-gradient(#FFF, #FFF) left top / 1px 12px no-repeat,\n    linear-gradient(#FFF, #FFF) right top / 12px 1px no-repeat,\n    linear-gradient(#FFF, #FFF) right top / 1px 12px no-repeat,\n    linear-gradient(#FFF, #FFF) left bottom / 12px 1px no-repeat,\n    linear-gradient(#FFF, #FFF) left bottom / 1px 12px no-repeat,\n    linear-gradient(#FFF, #FFF) right bottom / 12px 1px no-repeat,\n    linear-gradient(#FFF, #FFF) right bottom / 1px 12px no-repeat;\n  opacity: .85;\n  transition: opacity .2s ease;\n}\n.rv-внутрь-выход:hover .rv-внутрь-уголки,\n.rv-внутрь-выход:focus-visible .rv-внутрь-уголки { opacity: 1; }\n\n.rv-внутрь-лист {\n  align-self: start;\n  max-width: min(62ch, 92vw);\n  margin: 0 auto;\n  width: 100%;\n}\n.rv-внутрь-над {\n  margin: 0 0 clamp(10px, 1.6vh, 18px);\n  font-family: var(--rv-моно, ui-monospace, monospace);\n  font-size: clamp(12px, 1.4vw, 15px); letter-spacing: .18em;\n  text-transform: uppercase;\n  color: rgba(198, 210, 240, .62);\n}\n.rv-внутрь-заг {\n  margin: 0 0 clamp(12px, 2vh, 22px);\n  font-family: var(--rv-моно, ui-monospace, monospace);\n  font-size: clamp(22px, 3.4vw, 38px); line-height: 1.24;\n  letter-spacing: .04em; font-weight: 700; color: #FFFFFF;\n}\n.rv-внутрь-текст {\n  margin: 0;\n  font-family: var(--rv-моно, ui-monospace, monospace);\n  font-size: clamp(15px, 1.9vw, 19px); line-height: 1.72;\n  letter-spacing: .01em;\n  color: rgba(226, 233, 250, .92);\n}\n\n/* Пока мы внутри глыбы, лента заперта: мы в предмете, а не на ленте. */\nhtml.рв-внутри,\nhtml.рв-внутри body { overflow: hidden !important; overscroll-behavior: none; }\n/* И слой слов акта уходит: он говорит про стену, а мы уже во льду. */\nhtml.рв-внутри .rv-акт > .rv-кадр > .rv-слой { opacity: 0; pointer-events: none; }\n/* И шапка сайта: она перекрывала марку и кнопку выхода страницы внутри,\n   а действовать в этот момент можно только одним - выйти. */\nhtml.рв-внутри .rv-шапка,\nhtml.рв-внутри .rv-орган,\nhtml.рв-внутри .rv-визитка,\nhtml.рв-внутри .rv-манифест {\n  opacity: 0; pointer-events: none;\n  transition: opacity .3s ease;\n}\n/* Блок слов сдвинут вниз: знак стоит в верхней трети кадра, слова под\n   ним. Та же раскладка, что во всех сценах сайта. */\n/* Текст начинается СВЕРХУ. Владелец про их страницу: «там внутри\n   точно такой же текст с анимацией, как на всём сайте, и он сверху\n   начинается, и более детальная информация». Отступ оставлен только\n   под шапку страницы, знак виден за словами. */\n.rv-внутрь-лист { margin-top: min(12vh, 110px); }\n\n@media (prefers-reduced-motion: reduce) {\n  .rv-внутрь { transition: none; }\n}\n\n\n/* ══ ЧЕРТЁЖНАЯ СЕТКА ЗАГРУЗКИ ═════════════════════════════════════\n   Владелец: «у них ещё есть какая-то сетка рисованная красивая\n   анимационная при загрузочном экране».\n\n   Холст висит поверх сцены, но НИЖЕ шапки и слов: чертёж накрывает\n   мир, а не интерфейс. Событий не ловит - по нему нечего нажимать, а\n   перехваченный им клик стоил бы человеку первого касания. */\n.rv-сетка {\n  position: fixed; inset: 0;\n  z-index: 25;\n  pointer-events: none;\n  mix-blend-mode: screen;\n}\n@media (prefers-reduced-motion: reduce) { .rv-сетка { display: none; } }\n\n\n/* ══ ПРИБОРНАЯ РАЗМЕТКА ТОЛЬКО НА ЛЕЖАЧЕМ КАДРЕ ═══════════════════\n   Опознаватели («СТАНЦИЯ_LUNA_01», дальность, ход) писались под\n   монитор, где сбоку от предмета есть поле. На телефоне поля нет: на\n   снимке владельца весь набор лёг прямо на кладку дома и читался\n   мусором поверх модели. Скрываем - на стоячем кадре важнее сам\n   предмет. */\n@media (max-width: 760px) { .rv-опозн { display: none !important; } }\n\n\n/* Действия под описанием внутри глыбы. Стоят там же, где у igloo стоит\n   «/// Discover» с ссылками: человек дочитал, что даёт функция, и здесь\n   же может ею воспользоваться. */\n.rv-внутрь-над2 { margin-top: clamp(22px, 4vh, 40px); }\n.rv-внутрь-кнопки {\n  margin: clamp(10px, 1.6vh, 18px) 0 0;\n  display: flex; flex-wrap: wrap; gap: 12px;\n}\n\n\n/* Два действия в первом кадре стоят рядом и переносятся на телефоне. */\n.rv-кнопки { display: flex; flex-wrap: wrap; gap: 12px; margin: 0; }\n@media (max-width: 480px) { .rv-кнопки { gap: 10px; } .rv-кнопки .rv-кн { flex: 1 1 100%; text-align: center; } }\n\n\n/* ══ ПУЛЬТ ФИНАЛА ═════════════════════════════════════════════════\n   Владелец про конец сценария: «мы просто заходим внутрь и подходим к\n   панели управления, на которой будет анкета, часто задаваемые вопросы,\n   кнопка запустить VPN и кнопка запустить игру».\n\n   Разметка тут НЕ ВЁРСТКА ПОВЕРХ СЦЕНЫ. Каждый блок стоит ровно там,\n   где на экране стоит его экран на настоящей приборной стойке: места\n   считает rv-финал.js по мировой геометрии и публикует их переменными\n   --рв-фин-<имя>-x/y/ш/в в процентах кадра. Камера едет - блоки едут\n   вместе с ней, потому что едут сами экраны. Это то же правило, по\n   которому в остальных актах слова живут буквами в объёме.\n\n   Пока сцена не поднялась (без объёма, с отключённой анимацией, на\n   старом устройстве), переменных нет, и запасная раскладка ставит те же\n   три блока обычным потоком. Проверка запаса тут обязательна: пульт это\n   анкета и клавиши, терять их нельзя ни при каких условиях. */\n.rv-пульт {\n  position: absolute; inset: 0;\n  z-index: 4;\n  pointer-events: none;\n}\n.рв-фин {\n  position: absolute;\n  left: var(--рв-фин-x, 50%);\n  top: var(--рв-фин-y, 50%);\n  width: var(--рв-фин-ш, 40%);\n  height: var(--рв-фин-в, 30%);\n  /* ── ЧТО НЕ ВЛЕЗЛО, ТО ПРОКРУЧИВАЕТСЯ, А НЕ ОБРЕЗАЕТСЯ ────────\n     Здесь стояло `overflow: hidden` при выравнивании по середине.\n     Экран пульта считает сцена, и его высота зависит от кадра: на\n     телефоне она вдвое меньше, чем на мониторе. Всё, что не влезло,\n     срезалось СРАЗУ С ДВУХ СТОРОН - и сверху, и снизу, потому что\n     содержимое стояло по центру. На снимках владельца от «Частых\n     вопросов» видно две с половиной строки, у анкеты обрезаны и\n     заголовок, и кнопка: «полная каша, всё обрезано».\n\n     Содержимое теперь начинается сверху и прокручивается внутри\n     своего экрана. Цепочку прокрутки обрываем: докрутил до низа\n     вопросов - лента сайта под пальцем не поедет. */\n  overflow: hidden auto;\n  overscroll-behavior: contain;\n  -webkit-overflow-scrolling: touch;\n  scrollbar-width: thin;\n  /* Свет экрана идёт ИЗ-ПОД текста, а не плитой поверх: сам экран уже\n     нарисован в сцене, и вторая подложка читалась бы наклейкой. */\n  color: var(--rv-текст);\n  font-family: var(--rv-шрифт);\n  display: flex; flex-direction: column;\n  justify-content: flex-start;\n  padding: 0.6% 1.2%;\n  opacity: 0;\n  /* Место блока переезжает один раз за фильм: с объёмной стойки в окно\n     рамы рубки (признак рв-кабина-есть). Без перехода это прыжок на\n     половину кадра; с ним - тот же переезд, но за треть секунды и под\n     уже проступившей рамой. */\n  transition: opacity .35s ease, left .32s ease, right .32s ease,\n              top .32s ease, width .32s ease, height .32s ease;\n}\n/* Признак ставит сама сцена, когда человек дошёл до пульта. Раньше\n   этого момента экраны стоят тёмными, и текст на них не проступает. */\nhtml.рв-финал-пульт .рв-фин { opacity: 1; pointer-events: auto; }\n\n/* ── ИГРА СТОИТ ТАМ ЖЕ, ГДЕ СТОЯЛИ ВОПРОСЫ ────────────────────────\n   У гнезда игры (frame.html, id rvИграГнездо) не было НИ ОДНОГО\n   правила: разбор искал «рв-фин-игра» по всему rocketvpn и нашёл ровно\n   одну строку - саму разметку. Гнездо садилось по запасным числам\n   базового .рв-фин, то есть от середины кадра вправо-вниз, и наезжало\n   на ряд клавиш пульта. И не ехало вместе с камерой: правила\n   html.рв-кабина-есть двигают в окно рамы только вопросы и кнопки.\n\n   Игра ЗАМЕНЯЕТ вопросы (rv-панель-кнопки.js прячет одно и показывает\n   другое), значит и место у неё то же самое. Везде ниже она идёт\n   вторым именем в тех же правилах, что и .рв-фин-впр. */\n.рв-фин-впр,\n.рв-фин-игра { left: var(--рв-фин-впр-x, 58%); top: var(--рв-фин-впр-y, 30%); width: var(--рв-фин-впр-ш, 30%); height: var(--рв-фин-впр-в, 40%); }\n.рв-фин-анк { left: var(--рв-фин-анк-x, 10%); top: var(--рв-фин-анк-y, 30%); width: var(--рв-фин-анк-ш, 42%); height: var(--рв-фин-анк-в, 40%); }\n.рв-фин-кн  { left: var(--рв-фин-кн-x, 22%);  top: var(--рв-фин-кн-y, 76%);  width: var(--рв-фин-кн-ш, 56%);  height: var(--рв-фин-кн-в, 12%); }\n\n/* Кегль считается от ВЫСОТЫ СВОЕГО ЭКРАНА, а не от кадра: экран растёт\n   по мере подхода, и текст обязан расти вместе с ним, иначе на подходе\n   он занимает весь экран, а у пульта теряется в углу. */\n.рв-фин h3 {\n  margin: 0 0 .5em;\n  font-family: var(--rv-шрифт-голос);\n  font-size: clamp(11px, 12cqh, 22px);\n  letter-spacing: .04em;\n  text-transform: uppercase;\n  color: var(--rv-индиго-свет);\n}\n.рв-фин { container-type: size; }\n.рв-фин dl { margin: 0; font-size: clamp(10px, 8.4cqh, 17px); line-height: 1.42; }\n.рв-фин dt { font-weight: 600; color: var(--rv-текст); }\n.рв-фин dd { margin: 0 0 .7em; color: var(--rv-текст-тихо); }\n.рв-фин-кн { flex-direction: row; align-items: center; justify-content: center; gap: 3%; }\n.рв-фин-кн .rv-кн { font-size: clamp(11px, 34cqh, 18px); padding: .5em 1.1em; }\n.рв-фин-анк .rv-форма-плита { background: none; border: 0; padding: 0; box-shadow: none; }\n.рв-фин-анк .rv-форма-плита label { font-size: clamp(9px, 7cqh, 15px); }\n\n/* ЗАПАС БЕЗ ОБЪЁМА. Сцены нет - пульт становится обычным разделом в\n   конце ленты. Ни одного блока при этом не пропадает. */\nhtml:not(.рв-слова-в-сцене) .rv-пульт {\n  position: static; padding: clamp(24px, 5vh, 56px) 0;\n}\nhtml:not(.рв-слова-в-сцене) .рв-фин {\n  position: static; width: auto; height: auto;\n  opacity: 1; pointer-events: auto;\n  padding: 0 0 clamp(18px, 3vh, 30px);\n  container-type: normal;\n}\nhtml:not(.рв-слова-в-сцене) .рв-фин h3 { font-size: clamp(15px, 2.4vw, 22px); }\nhtml:not(.рв-слова-в-сцене) .рв-фин dl { font-size: clamp(13px, 1.7vw, 17px); }\nhtml:not(.рв-слова-в-сцене) .рв-фин-кн { flex-wrap: wrap; justify-content: flex-start; gap: 12px; }\nhtml:not(.рв-слова-в-сцене) .рв-фин-кн .rv-кн { font-size: inherit; padding: .7em 1.3em; }\n\n/* ── Кабина финала ─────────────────────────────────────────────\n   Рама рубки соседнего сайта: фотореальный кадр с прозрачной дырой на\n   месте окна. Владелец: «финальную сцену 1:1 как на сайте CDN, такая\n   же ракета, салон, панель, просто скопируй её».\n\n   Слой стоит НАД холстом и ПОД шапкой: сквозь окно виден настоящий зал\n   корабля, а кнопки шапки должны остаться нажимаемыми. Мышь он не\n   ловит вовсе - нажимать в раме нечего.\n\n   Появление ведёт акт финала (rv-кабина.js, «сила»), поэтому здесь\n   только переход: резкое включение картинки во весь экран читается\n   склейкой, а не приездом. */\n.рв-каб {\n  position: fixed; inset: 0; z-index: 6;\n  pointer-events: none;\n  opacity: 0;\n  transition: opacity .35s ease;\n  contain: strict;\n}\n.рв-каб-кадр {\n  position: absolute; inset: 0;\n  width: 100%; height: 100%;\n  object-fit: cover;\n  /* Кадр держится не по центру, а низом: на широком мониторе снимок\n     обрезается сверху и снизу почти на четверть, и первым уходит\n     пульт. То же число стоит в rv-кабина.js (ДНО), и они обязаны\n     двигаться вместе. */\n  object-position: 50% 97.8%;\n  user-select: none;\n}\n\n/* ВОПРОСЫ И КНОПКИ САДЯТСЯ В ОКНО РАМЫ. Владелец: «вопросы и кнопки\n   поставить на самый последний кадр». Окно считает rv-кабина.js по\n   паспорту снимка и отдаёт четырьмя переменными; здесь блоки только\n   встают в него. Без рамы всё остаётся как было - переменные просто\n   не объявлены, и работают прежние места от объёмного пульта. */\nhtml.рв-кабина-есть .рв-фин-впр,\nhtml.рв-кабина-есть .рв-фин-игра {\n  left: auto;\n  right: calc(100% - var(--рв-каб-п, 92%));\n  top: var(--рв-каб-в, 12%);\n  width: calc(var(--рв-каб-ш, 80%) * 0.44);\n  height: calc(var(--рв-каб-выс, 60%) * 0.62);\n  justify-content: flex-start;\n}\n/* Анкете отдана бОльшая доля высоты, чем вопросам, и это не вкус.\n   В ней три поля с подписями, согласие и кнопка - на первом снимке\n   при 0.62 согласие и кнопка вылезали за низ коробки и обрезались.\n   Вопросам столько не нужно: три пары «вопрос-ответ» встают в 0.62 с\n   запасом. */\nhtml.рв-кабина-есть .рв-фин-анк {\n  left: var(--рв-каб-л, 8%);\n  top: var(--рв-каб-в, 12%);\n  width: calc(var(--рв-каб-ш, 80%) * 0.46);\n  height: calc(var(--рв-каб-выс, 60%) * 0.76);\n  justify-content: flex-start;\n}\n/* ── КЛАВИШИ СТОЯТ ПОД СВОЕЙ КАРТОЧКОЙ ──────────────────────────\n   Ряд занимал ВСЮ ширину окна рубки, а карточка вопросов - сорок\n   четыре сотых её, у правого края. На снимке это читалось тремя\n   полосами поперёк остекления: «Запустить VPN» тянулся от края до\n   края и висел в пустоте под карточкой, стоящей справа.\n\n   Владелец про этот экран: «на Vpn только в конце вопросы и кнопки\n   как на сайте cdn 1:1». У соседей кнопка стоит ВНУТРИ своей карточки\n   (epi-holo), а не отдельной полосой во весь кадр. Ставим ряд по той\n   же правой кромке и той же ширины, что вопросы: вопросы и действия\n   читаются одним щитом, левая половина остекления остаётся видом. */\nhtml.рв-кабина-есть .рв-фин-кн {\n  left: auto;\n  right: calc(100% - var(--рв-каб-п, 92%));\n  top: calc(var(--рв-каб-в, 12%) + var(--рв-каб-выс, 60%) * 0.66);\n  width: calc(var(--рв-каб-ш, 80%) * 0.44);\n  height: calc(var(--рв-каб-выс, 60%) * 0.20);\n}\n\n/* На телефоне окно узкое и высокое: два блока рядом не встают, они\n   идут столбиком. Числа те же, делёж другой. */\n@media (max-aspect-ratio: 1/1) {\n  /* ── НА ПАНЕЛИ ТОЛЬКО ВОПРОСЫ И КНОПКИ ─────────────────────\n     Здесь делили высоту на три: анкета 46 процентов, вопросы 30,\n     кнопки 16. Анкету с панели сняли (владелец: «там должны быть\n     вопросы и 2 кнопки с кнопкой назад»), и вопросов стало восемь\n     пар вместо пяти. Тридцати процентов им мало вдвое: список лез на\n     ряд кнопок, а ряд срезался снизу.\n\n     Вопросам отдана вся середина, кнопкам ровно столько, сколько\n     нужно трём клавишам в один ряд с запасом на перенос. */\n  html.рв-кабина-есть .рв-фин-впр,\n  html.рв-кабина-есть .рв-фин-игра {\n    left: var(--рв-каб-л, 8%);\n    right: auto;\n    top: var(--рв-каб-в, 12%);\n    width: var(--рв-каб-ш, 80%);\n    /* ── КАРТОЧКА ПО СОДЕРЖИМОМУ, А НЕ ПО ДОЛЕ ОКНА ──────────────\n       Высота стояла жёсткой долей окна, и на снимке доли 0.92 под\n       последним вопросом оставалась сотня точек пустого стекла: у\n       соседей карточка кончается там же, где кончается список.\n       Потолок держим прежней долей - список длиннее окна прокрутится\n       внутри, как и прокручивался. */\n    /* ── ВЫСОТА ВОЗВРАЩЕНА ДОЛЕЙ ОКНА ────────────────────────────\n       auto я поставила, чтобы карточка кончалась там, где кончается\n       список. На стоячем кадре это дало обратное: у родителя высота\n       задана в процентах, у ребёнка auto, и карточка схлопнулась до\n       пятидесяти двух точек - список вопросов пропал целиком с\n       последнего экрана сайта. Доля окна работает на обеих раскладках,\n       а лишний воздух под списком снимает выравнивание содержимого. */\n    height: calc(var(--рв-каб-выс, 60%) * 0.72);\n  }\n  /* На стоячем кадре карточка занимает всю ширину окна, значит и ряд\n     клавиш под ней тоже: делить узкое окно надвое нечем. */\n  html.рв-кабина-есть .рв-фин-кн {\n    left: var(--рв-каб-л, 8%);\n    right: auto;\n    width: var(--рв-каб-ш, 80%);\n    top: calc(var(--рв-каб-в, 12%) + var(--рв-каб-выс, 60%) * 0.76);\n    height: calc(var(--рв-каб-выс, 60%) * 0.22);\n    flex-wrap: wrap;\n    align-content: center;\n  }\n  /* На узком кадре анкете нужен весь кегль, какой влезает: три поля с\n     подписями в сорока шести сотых окна встают только ужатыми. */\n  html.рв-кабина-есть .рв-фин-анк .rv-форма-плита label { font-size: clamp(9px, 5.2cqh, 13px); }\n  html.рв-кабина-есть .рв-фин dl { font-size: clamp(10px, 7.4cqh, 15px); }\n}\n\n/* Дека рамы: тела клавиш и свет над ними. Порядок обязателен -\n   колпачок ЗАСЛОНЯЕТ дно ниши, а слой света этого не умеет, он только\n   складывается. Числа и имена классов те же, что у соседей: холсты\n   рисует перенесённый rv-настил.js и знает их по этим именам. */\n.рв-каб .rcf-caps {\n  position: absolute; inset: 0; z-index: 3;\n  pointer-events: none;\n}\n.рв-каб .rcf-instr {\n  position: absolute; inset: 0; z-index: 4;\n  pointer-events: none;\n  mix-blend-mode: screen;\n}\n\n/* ── Стеклянная карточка пульта, как у соседей ──────────────────\n   Владелец прислал седьмой и восьмой кадры их финала: содержимое в\n   окне рубки стоит не голым текстом, а КАРТОЧКОЙ - тёмное стекло с\n   тонкой бирюзовой кромкой и скобками по углам. Скобки не украшение:\n   они отделяют слой разметки от снимка рамы, иначе текст читается\n   написанным прямо по железу.\n\n   Живёт только в раме: без неё блоки садятся на объёмные экраны\n   стойки, у которых своя подложка, и вторая была бы наклейкой на\n   наклейке. */\nhtml.рв-кабина-есть .рв-фин-анк,\nhtml.рв-кабина-есть .рв-фин-впр,\nhtml.рв-кабина-есть .рв-фин-игра {\n  padding: 2.4% 3%;\n  background: linear-gradient(160deg,\n              rgba(10, 20, 34, .78), rgba(6, 13, 24, .86));\n  border: 1px solid rgba(95, 200, 239, .28);\n  border-radius: 10px;\n  box-shadow: 0 0 0 1px rgba(4, 9, 18, .55) inset,\n              0 10px 34px -18px rgba(0, 0, 0, .9);\n  -webkit-backdrop-filter: blur(2px);\n  backdrop-filter: blur(2px);\n  /* ── ПРОКРУЧИВАЕТСЯ СПИСОК, А НЕ КАРТОЧКА ────────────────────────\n     Прокрутка стояла на самой карточке, и вместе с содержимым уезжали\n     её угловые скобки: на снимке доли 0.92 верхняя скобка висела\n     посреди заголовка отдельной чёрточкой. Скобки принадлежат рамке,\n     а не тексту, значит рамка обязана стоять.\n\n     Карточка теперь не прокручивается вовсе, а список внутри неё\n     прокручивается по своей высоте. */\n  overflow: hidden;\n}\n/* Список вопросов внутри карточки: своя прокрутка и растворение по\n   нижней кромке. Обрыв строки посередине читается ошибкой вёрстки, а\n   растворение читается тем, чем оно и является, - «дальше есть ещё». */\nhtml.рв-кабина-есть .рв-фин-впр,\nhtml.рв-кабина-есть .рв-фин-игра,\nhtml.рв-кабина-есть .рв-фин-анк { display: flex; flex-direction: column; }\nhtml.рв-кабина-есть .рв-фин-впр > h3 { flex: 0 0 auto; }\n/* Прокручивается ОБЁРТКА списка и товара, а не каждый по отдельности:\n   двумя полосами прокрутки в одном окне человек не пользуется. */\nhtml.рв-кабина-есть .рв-фин-впр > .рв-впр-обёртка,\nhtml.рв-кабина-есть .рв-фин-игра > .рв-впр-обёртка,\nhtml.рв-кабина-есть .рв-фин-впр dl,\nhtml.рв-кабина-есть .рв-фин-игра dl,\nhtml.рв-кабина-есть .рв-фин-впр .рв-впр-список,\nhtml.рв-кабина-есть .рв-фин-игра .рв-впр-список,\nhtml.рв-кабина-есть .рв-фин-анк .rv-форма-плита {\n  flex: 1 1 auto;\n  min-height: 0;\n  max-height: 100%;\n  overflow: auto;\n  scrollbar-width: thin;\n  overscroll-behavior: contain;\n  -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 88%, transparent 100%);\n  mask-image: linear-gradient(to bottom, #000 0, #000 88%, transparent 100%);\n}\n/* Прежние две скобки на псевдоэлементах отсюда сняты. У соседей на\n   кадре их ЧЕТЫРЕ, и рисует их одна рамка с вырезом - правило ниже,\n   в разделе «карточка панели - стиль соседей». Держать два набора\n   скобок на одном блоке значило бы получить шесть углов. */\n\n\n/* ═══ НИЖЕ ПАНЕЛИ НИЧЕГО НЕ ПРОКРУЧИВАЕТСЯ ═══════════════════════\n   Владелец: «панель управления это финал каждого из сайтов, дальше неё\n   ничего не скроллится вниз вообще».\n\n   Так у соседей и есть: их страница кончается рубкой с пультом. У нас\n   под финалом стоял подвал - марка, итог, форма «Написать нам», ссылка\n   на Rocket CDN и контакты, - и человек, дочитавший панель, уезжал с\n   последнего кадра фильма в обычный футер.\n\n   Подвал не удаляем: в нём правовые ссылки и контакты, они обязаны\n   быть в разметке. Он уходит из ПОТОКА, пока лента идёт объёмным\n   фильмом, и остаётся на месте там, где объёма нет вовсе (слабое\n   устройство, отключённая анимация) - иначе с такого устройства\n   пропали бы и контакты.\n\n   Форма никуда не девается: она открывается кнопкой в шапке и лежит в\n   том же rv-меню.js, что и здесь. Уход на соседний сайт стоит на самой\n   панели кнопкой «Назад». */\nhtml.рв-слова-в-сцене .rv-подвал {\n  display: none;\n}\n\n/* ═══ КАРТОЧКА ПАНЕЛИ - СТИЛЬ СОСЕДЕЙ, ПЕРЕНЕСЁННЫЙ КАК ЕСТЬ ═══════\n   Владелец прислал кадры панели rocketcdn и сказал: «вот так должно\n   быть 1:1 как на cdn и на vpn стиль текстуры размеры шрифты и тд я же\n   сказал скопировать вставить с cdn».\n\n   Ниже перенесены их числа из assets/rc-cockpit.css (.epi-holo) и\n   assets/rc-interior.css: полосатая развёртка через две точки, циановая\n   кромка в тридцать четыре сотых, свечение наружу и скобки прицела по\n   четырём углам через clip-path. Наши прежние две скобки на\n   псевдоэлементах отсюда сняты: у соседей их четыре, и это видно на\n   кадре.\n\n   Цвета их же, разложенные по составляющим для rgba:\n     циан   66,178,220\n     свет  207,233,245\n     глубь   5, 12, 21   */\nhtml.рв-кабина-есть .рв-фин-впр,\nhtml.рв-кабина-есть .рв-фин-игра,\nhtml.рв-кабина-есть .рв-фин-анк {\n  padding: clamp(14px, 3.4cqh, 26px) clamp(12px, 3.4cqw, 26px);\n  border: 0;\n  border-radius: 14px;\n  background: none;\n  box-shadow: none;\n  -webkit-backdrop-filter: none;\n  backdrop-filter: none;\n}\nhtml.рв-кабина-есть .рв-фин-впр::before,\nhtml.рв-кабина-есть .рв-фин-игра::before,\nhtml.рв-кабина-есть .рв-фин-анк::before {\n  content: \"\";\n  position: absolute; inset: 0;\n  width: auto; height: auto;\n  border-radius: inherit;\n  border: 1px solid rgba(66, 178, 220, .34);\n  background:\n    repeating-linear-gradient(180deg,\n      rgba(66, 178, 220, .06) 0 2px,\n      transparent 2px 4px),\n    linear-gradient(180deg,\n      rgba(5, 12, 21, .72),\n      rgba(5, 12, 21, .84));\n  box-shadow:\n    0 0 60px -18px rgba(66, 178, 220, .7),\n    inset 0 1px 0 rgba(207, 233, 245, .16);\n  pointer-events: none;\n}\n/* Скобки прицела по ЧЕТЫРЁМ углам одной рамкой с вырезом. Их приём:\n   рамка в отступе шесть точек, из которой clip-path оставляет по\n   двадцать две точки в каждом углу. */\nhtml.рв-кабина-есть .рв-фин-впр::after,\nhtml.рв-кабина-есть .рв-фин-игра::after,\nhtml.рв-кабина-есть .рв-фин-анк::after {\n  content: \"\";\n  position: absolute; inset: 6px;\n  left: 6px; top: 6px; right: 6px; bottom: 6px;\n  width: auto; height: auto;\n  border-radius: 10px;\n  border: 1px solid rgba(66, 178, 220, .5);\n  clip-path: polygon(\n    0 0, 22px 0, 22px 1px, 1px 1px, 1px 22px, 0 22px,\n    0 100%, 22px 100%, 22px calc(100% - 1px), 1px calc(100% - 1px), 1px calc(100% - 22px), 0 calc(100% - 22px),\n    100% 100%, calc(100% - 22px) 100%, calc(100% - 22px) calc(100% - 1px), calc(100% - 1px) calc(100% - 1px), calc(100% - 1px) calc(100% - 22px), 100% calc(100% - 22px),\n    100% 0, calc(100% - 22px) 0, calc(100% - 22px) 1px, calc(100% - 1px) 1px, calc(100% - 1px) 22px, 100% 22px);\n  opacity: .9;\n  pointer-events: none;\n}\nhtml.рв-кабина-есть .рв-фин-впр > * { position: relative; z-index: 1; }\n\n/* Заголовок карточки: мелкий, разрядкой, циановый - как «КОРОТКО О\n   ГЛАВНОМ» на их кадре. Не заголовок раздела, а надпись на приборе. */\nhtml.рв-кабина-есть .рв-фин-впр > h3,\nhtml.рв-кабина-есть .рв-фин-игра > h3 {\n  margin: 0 0 clamp(8px, 2.2cqh, 18px);\n  font-family: var(--rv-шрифт-голос, var(--rv-шрифт));\n  font-size: clamp(10px, 3.4cqh, 15px);\n  font-weight: 700;\n  letter-spacing: .22em;\n  text-transform: uppercase;\n  color: rgba(159, 224, 246, .95);\n  text-shadow: 0 1px 8px rgba(0, 0, 0, .8), 0 0 26px rgba(66, 178, 220, .55);\n}\n\n/* ── СПИСОК ОДНИХ ВОПРОСОВ, ПО РОМБИКУ НА КАЖДЫЙ ─────────────────\n   На кадре соседей в окне панели стоят ВОПРОСЫ и больше ничего:\n   ответов там нет, они раскрываются в ленте выше. Ромбик перед\n   строкой - их же приём. */\n.рв-впр-список {\n  margin: 0; padding: 0;\n  list-style: none;\n  display: flex; flex-dir
