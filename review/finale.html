<h1>Финальная панель VPN</h1><p>Проверка настоящей разметки и CSS. 3D-сцена здесь не отображается, производительность графики не измеряется.</p>

<script>const fixture="<!doctype html><html lang=\"ru\" class=\"рв-слова-в-сцене рв-живая-рубка рв-финал-пульт\" data-тема=\"тёмная\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><style>/* Rocket VPN. Основа оформления.\n\n   Палитра снята с логотипа клиента, а не выбрана на вкус: у марки VPN\n   преобладает индиго #3048A8 с переходом в #6078D8. У родственного\n   сайта Rocket CDN та же чёрная основа, но акцент бирюзовый #30A8D8.\n   Держать эти два акцента строго врозь - единственная защита от того,\n   чтобы два сайта одной семьи слились в один.\n\n   Тёплый янтарь здесь ровно один и появляется ровно в одном месте: на\n   лучах досмотра в акте «Периметр». Он единственное тёплое пятно на\n   сайте, поэтому и читается как тревога. Если растащить его по другим\n   блокам, тревога исчезнет. */\n\n:root {\n  /* Основа */\n  --rv-фон:        #05060C;\n  /* Цвет неба сцены снизу: им закрашена подложка страницы, чтобы\n     зазор при скрытии адресной строки не читался чёрной полосой. */\n  --rv-подложка:   #0A0E1C;\n  --rv-фон-глубже: #02030700;\n  --rv-текст:      #E8EAF6;\n  --rv-текст-тихо: rgba(232,234,246,.62);\n  --rv-текст-очень-тихо: rgba(232,234,246,.38);\n\n  /* Марка. Три ступени одного индиго: тень, тело, свет. */\n  --rv-индиго-тень: #2A3A8C;\n  --rv-индиго:      #3048A8;\n  --rv-индиго-свет: #6078D8;\n  --rv-индиго-rgb:  48,72,168;\n  --rv-свет-rgb:    96,120,216;\n\n  /* Тревога. Только акт «Периметр». */\n  --rv-тревога:     #FF6A3C;\n  --rv-тревога-rgb: 255,106,60;\n\n  /* Бирюза родственного сайта. Нужна ровно в одном месте - на воротах\n     стыковки с Rocket CDN, чтобы прокол в его сторону был его цвета. */\n  --rv-cdn:         #30A8D8;\n  --rv-cdn-rgb:     48,168,216;\n\n  --rv-кромка:      rgba(96,120,216,.22);\n  --rv-плита:       rgba(10,14,32,.72);\n\n  /* Подложки постоянных органов, меню и полей ввода. Стоят здесь, в\n     основном наборе, а не в блоке тёмной темы: пока скрипт не проставил\n     признак темы, признака на корне НЕТ, и значения, объявленные только\n     под ним, не действуют - на первом кадре бургер и панель уходили в\n     прозрачность. Светлая тема их перекрывает. */\n  --rv-орган-фон:   rgba(8,11,24,.72);\n  --rv-меню-фон:    rgba(7,10,22,.92);\n  --rv-поле-фон:    rgba(6,9,20,.7);\n\n  --rv-шрифт: \"Golos Text\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  /* Гарнитура заголовков и чисел. Отдельной переменной, чтобы смена\n     была одной правкой, а не поиском по файлу. */\n  --rv-шрифт-голос: \"Unbounded\", \"Golos Text\", system-ui, sans-serif;\n\n  /* НЕОН. Три слоя одного свечения: ядро вплотную к букве, тело и\n     широкий нимб. Так устроен настоящий газоразрядный свет, и так же\n     устроен ореол в объёмных актах (rv-real.js) - сайт светится\n     одинаково в разметке и в мире.\n\n     Держим переменными: неон должен уметь дышать по ходу ленты, а\n     переписывать четыре тени в пяти местах - верный способ развести\n     их между собой. */\n  --rv-неон-ядро: rgba(150, 170, 255, .95);\n  --rv-неон-тело: rgba(96, 120, 216, .75);\n  --rv-неон-нимб: rgba(48, 72, 168, .55);\n  --rv-неон-сила: 1;\n\n  /* Ритм. Один шаг, от него всё остальное: так вертикальный ритм\n     держится сам, без подгонки каждого блока руками. */\n  --rv-шаг: 8px;\n  --rv-поле: clamp(18px, 5vw, 64px);\n}\n\n* { box-sizing: border-box; }\n\n/* ── ПОДЛОЖКА СТРАНИЦЫ ЦВЕТА НЕБА СЦЕНЫ ────────────────────────\n   Владелец с телефона: «как только я начинаю скроллить, весь сайт\n   поднимается на фулл экран, и снизу чёрная полоса какая-то».\n\n   Подъём это адресная строка браузера: она прячется на первом же\n   движении, окно вырастает, и помешать этому нельзя. А вот полоса\n   наша. Кадр меряется динамической единицей и едет за окном, но\n   браузер меняет высоту РАНЬШЕ, чем пересчитывает единицу, и на эти\n   кадры снизу открывается подложка страницы. Она стояла на #05060C,\n   то есть темнее неба сцены (0x070A14..0x1A2238), и зазор читался\n   чёрной полосой.\n\n   Подложка теперь того же цвета, что низ неба. Зазор в те же кадры\n   остаётся, но увидеть его нельзя: он одного цвета с тем, что рядом. */\nhtml, body {\n  margin: 0; padding: 0;\n  background: var(--rv-подложка, var(--rv-фон));\n  color: var(--rv-текст);\n  font-family: var(--rv-шрифт);\n  -webkit-font-smoothing: antialiased;\n}\n\n/* Горизонтального выезда быть не должно ни на одной ширине. Это не\n   украшение: на телефоне выезд превращает вертикальную прокрутку в\n   диагональную, и плёнка сайта начинает дёргаться. */\nhtml, body { overflow-x: clip; }\n\nimg, canvas, svg { max-width: 100%; display: block; }\n\na { color: inherit; }\n\n/* ── Плёнка ────────────────────────────────────────────────────\n   Каждый акт это отрезок прокрутки. Высота задаётся в экранах, а\n   содержимое липнет к окну: так доля внутри акта считается честно и\n   одинаково на любом устройстве. */\n/* ПРОКРУТКА СТОПОРИТСЯ НА КАЖДОЙ ИДЕЕ, А НЕ ЛЬЁТСЯ КАК ВОДА.\n\n   Прямое слово тестировщика: «прокрутка должна стопориться на каждой\n   вашей доносимой идее, а не листаться, как вода». Каждый акт это одна\n   идея, и лента теперь притягивается к его началу.\n\n   Мягкий притяг (proximity), а НЕ жёсткий (mandatory), и это не\n   осторожность ради осторожности: длинные акты разведены по фазам\n   (у «Рубки» тарифы всплывают во второй фазе, у «Точки выхода» - числа),\n   и жёсткий снап прыгал бы мимо середины прямо к следующему акту,\n   пряча фазу. Proximity даёт осесть у идеи и при этом пройти акт до\n   конца. scroll-snap-stop: always запрещает пролёт мимо акта на\n   быстром взмахе: как раз тот пролёт «водой», на который жаловались.\n\n   Камера читает scrollY напрямую и снапу не мешает: снап меняет только\n   то, ГДЕ прокрутка останавливается, а не саму величину. */\n/* ── СНАПА НЕТ ───────────────────────────────────────────────────\n   Здесь стояли `scroll-snap-type: y proximity` на документе и\n   `scroll-snap-align: start; scroll-snap-stop: always` на каждом акте.\n   Замысел был честный: остановить ленту на начале сцены. Цена\n   оказалась выше замысла.\n\n   Акт высотой от трёх до семи экранов, а `scroll-snap-stop: always`\n   обязывает браузер ДОВЕСТИ прокрутку до начала следующего акта, чем\n   бы взмах ни кончился. Отпустил палец на середине сцены - лента едет\n   дальше сама. Владелец называет это двумя разными словами и оба раза\n   про одно: «весь сайт поднимается зачем-то наверх» и «если резко\n   свайп сделаю вниз, то сразу переходит во вторую сцену, мы не видим\n   вообще анимацию».\n\n   Фильм ведёт прокрутка, и она обязана останавливаться там, где её\n   отпустила рука. Плавность даёт сглаживание камеры (две подтяжки\n   igloo), а не притягивание ленты. */\n.rv-акт { position: relative; }\n.rv-акт > .rv-кадр {\n  position: sticky; top: 0;\n  /* ── ВЫСОТА КАДРА ИДЁТ ЗА АДРЕСНОЙ СТРОКОЙ ────────────────────\n     Владелец с телефона: «снизу во время скролла появляется какая-то\n     чёрная полоса, и весь сайт куда-то наверх ходит».\n\n     Здесь стояло только `100svh`. Малая единица это высота окна, когда\n     адресная строка ПОКАЗАНА. Стоит человеку тронуть страницу, браузер\n     её прячет, окно вырастает на восемь-десять процентов, а липкий\n     кадр остаётся прежней высоты - и снизу открывается полоса\n     подложки ровно на разницу. Она чёрная, потому что за кадром лежит\n     фон страницы, а не сцена.\n\n     Динамическая единица меряет окно КАК ОНО ЕСТЬ прямо сейчас и едет\n     вместе с адресной строкой. Малая остаётся первой строкой: браузер,\n     который не знает dvh, возьмёт её и получит прежнее поведение\n     вместо сломанной раскладки. */\n  height: 100svh;\n  height: 100dvh;\n  overflow: hidden;\n  /* Кромки кадра растворены. Кадр липкий, и на смене акта его уносит\n     вверх вместе со всем, что в нём: стеной блокпоста, холстом акта,\n     подложкой под словами. Пока всё это обрезалось краем кадра, по\n     экрану шла жёсткая горизонтальная линия, слева тёмная плашка,\n     справа прозрачная, и стык читался краем слайда. Маска сводит\n     содержимое кадра в ноль у верхней и нижней кромки, и два соседних\n     кадра на стыке перетекают друг в друга поверх одного мира.\n     Заодно слова уходящего акта тают до шапки, а не заезжают под неё.\n     Полосы узкие: девять сотых экрана, это меньше, чем поле над\n     текстом, и в покое их не видно. */\n  -webkit-mask-image: linear-gradient(to bottom,\n    rgba(0,0,0,0) 0%, #000 9%, #000 91%, rgba(0,0,0,0) 100%);\n  mask-image: linear-gradient(to bottom,\n    rgba(0,0,0,0) 0%, #000 9%, #000 91%, rgba(0,0,0,0) 100%);\n}\n\n.rv-слой {\n  position: absolute; inset: 0;\n  display: grid; align-content: center;\n  padding: 0 var(--rv-поле);\n  pointer-events: none;\n}\n.rv-слой > * { pointer-events: auto; }\n\n.rv-холст { position: absolute; inset: 0; width: 100%; height: 100%; }\n\n/* ── Типографика ───────────────────────────────────────────────\n   Заголовок набирается от ширины окна, но с потолком: на широком\n   мониторе строка иначе разъезжается до плаката и перестаёт читаться\n   как речь. */\n/* ══════════════════════════════════════════════════════════════\n   СЛЕЙТ АКТА\n\n   Было: строка прописными с разрядкой, тихой краской. Читалась\n   подписью к картинке и ничем больше - «просто белый текст на чёрном».\n\n   Стало: киношная хлопушка. Номер акта индиго, волосяная линия, имя\n   акта. Номер здесь работает не как украшение: сайт это ЛЕНТА из семи\n   актов, и человек в любой момент должен понимать, где он в ней стоит.\n   Ни одного нового файла шрифта - только вес, разрядка и цвет.\n   ══════════════════════════════════════════════════════════════ */\n.rv-над {\n  display: flex; align-items: center; gap: calc(var(--rv-шаг) * 1.5);\n  /* Нижняя граница поднята с десяти точек до двенадцати. Десять - это\n     не «мелко на вкус»: набор идёт прописными с разрядкой в 0,28em и\n     самой тихой краской палитры, и на узком телефоне строка\n     превращалась в серую полосу без букв. Замер посадки ловил её на\n     всех семи размерах экрана и во всех семи актах. */\n  font-size: clamp(12px, 1.1vw, 13px);\n  letter-spacing: .24em; text-transform: uppercase; font-weight: 600;\n  color: var(--rv-текст-очень-тихо);\n  margin: 0 0 calc(var(--rv-шаг) * 1.6);\n}\n/* НУМЕРАЦИИ РАЗДЕЛОВ БОЛЬШЕ НЕТ. Владелец: «зачем ты нумерацию разделов\n   делаешь? это же сайт а не слайд шоу». Номер превращал ленту в колоду\n   слайдов и обещал человеку, что впереди ровно семь пунктов, которые\n   можно пересчитать. Сайт устроен иначе: это непрерывный мир, у него\n   нет оглавления.\n\n   Правило оставлено пустым намеренно, а не удалено: тег <i> из разметки\n   вычищен, и если он где-то вернётся, лучше пусть будет виден обычным\n   курсивом, чем внезапно загорится неоном. */\n/* Волосяная линия между номером и именем. Идёт от индиго в никуда:\n   у слейта нет правого края, он уходит в кадр. */\n.rv-над::after {\n  content: \"\"; flex: 1 1 auto; height: 1px; min-width: 24px;\n  max-width: clamp(40px, 12vw, 140px);\n  background: linear-gradient(90deg,\n    rgba(var(--rv-свет-rgb), .85), rgba(var(--rv-свет-rgb), 0));\n  box-shadow: 0 0 8px rgba(var(--rv-свет-rgb), .7);\n}\n/* Порядок в разметке: номер, имя, линия. Линия рисуется\n   псевдоэлементом и встаёт последней сама. */\n\n/* ══════════════════════════════════════════════════════════════\n   ЗАГОЛОВОК\n\n   Было: ровный белый, вес 700. Заголовок такого размера ровной\n   заливкой выглядит наклейкой поверх кадра, а не частью кадра.\n\n   Стало: заливка градиентом от белого к светлому индиго и вес 800.\n   Градиент идёт по строке слева направо - в ту же сторону, куда\n   смотрит свет в объёмных актах, - поэтому заголовок читается\n   освещённым, а не нарисованным.\n\n   Ключевая часть фразы берётся в <em> и получает чистый индиго: в\n   каждом акте есть одно слово, ради которого акт и написан.\n   ══════════════════════════════════════════════════════════════ */\n.rv-заг {\n  font-family: var(--rv-шрифт-голос);\n  /* Unbounded шире Golos почти на четверть, поэтому потолок кегля\n     снижен, а межстрочное поднято: широкий рисунок при line-height 1.02\n     слипается строками. */\n  font-size: clamp(26px, 4.4vw, 56px);\n  line-height: 1.16; letter-spacing: -.012em; font-weight: 900;\n  /* ── ПОД ЗАГОЛОВКОМ УЖЕ ────────────────────────────────────\n     Стояло 3.5 шага. Владелец: «на всём сайте расстояние между\n     заголовок и подзаголовок слишком большое». Тот же счёт, что и у\n     объёмного текста (rv-слово3d.js, «ЗАЗОРЫ УЖАТЫ НА ТРЕТЬ»): пара\n     «заголовок плюс подпись» обязана читаться одним куском. */\n  margin: 0 0 calc(var(--rv-шаг) * 2.2);\n  /* Потолок в знаках, но не шире экрана. Без второй половины на 412\n     точках заголовок в 16 знаков занимал 667 и уезжал за правую\n     кромку. Документ при этом не выезжал вбок (его режет overflow-x у\n     корня), поэтому замер выезда документа показывал ноль - а текст\n     всё равно обрезался. Меряем слой, а не документ. */\n  max-width: min(15ch, 100%);\n  /* ОБРЕЗКИ ФОНА ПО ТЕКСТУ ЗДЕСЬ БОЛЬШЕ НЕТ, и это не отказ от красоты.\n\n     Заливка градиентом делает букву ПРОЗРАЧНОЙ, а прозрачная буква не\n     умеет светиться: свечение это тень, тень рисуется формой буквы и\n     видна сквозь неё - поверх заливки. На кадре это выглядело так:\n     «Всё, что ты открываешь» набрано тёмно-серым, хотя градиент задан\n     белым. Неон и заливка градиентом взаимно исключают друг друга, и\n     выбран неон: он и есть стиль сайта.\n\n     Цвет ровный, светлый, чуть голубее чистого белого - чтобы\n     заголовок принадлежал холодному миру, а не лежал на нём. */\n  /* ЗАЛИВКА ГРАДИЕНТОМ ВЕРНУЛАСЬ, И ТЕПЕРЬ ОНА НЕ СПОРИТ СО СВЕЧЕНИЕМ.\n\n     В прошлый заход градиент сняли с выводом «неон и заливка взаимно\n     исключают друг друга». Вывод был верен ровно для text-shadow: он\n     рисуется ПОД заливкой, и при прозрачной заливке видно тень, а не\n     букву. Но есть filter: drop-shadow, и он работает иначе - берёт\n     готовый растр элемента вместе с его альфой и отбрасывает тень по\n     ФОРМЕ ЗНАКА. Прозрачная заливка ему не мешает вовсе.\n\n     Отсюда решение: цвет буквы даёт градиент от белого к светлому\n     индиго (заголовок принадлежит холодному миру и уходит в его тон к\n     нижней строке), а зарево и тёмную отбивку даёт drop-shadow. Оба\n     приёма работают одновременно, чего не умел прежний набор. */\n  background: linear-gradient(166deg, #FFFFFF 0%, #EAEFFF 38%, #AFC0FF 100%);\n  -webkit-background-clip: text;\n  background-clip: text;\n  -webkit-text-fill-color: transparent;\n  color: transparent;\n  /* СВЕЧЕНИЕ НЕ ДОЛЖНО ЕСТЬ БУКВУ.\n\n     Ядро стояло десять точек размытия, и на этом радиусе оно\n     размазывало САМ рисунок знака: заголовок в три строки сливался в\n     светлое пятно, а владелец прочёл это как «пересвечены, сливаются».\n     У настоящей газоразрядной трубки наоборот - тело стекла режет\n     глаз чёткой линией, а мягкое только зарево вокруг.\n\n     Поэтому ядро прижато к букве (четыре точки), середина убрана\n     вдвое, а широкий нимб оставлен: он и даёт ночную атмосферу, но за\n     форму знака не отвечает. Тонкая тёмная подложка снизу отделяет\n     строку от собственного зарева соседней. */\n  /* Зарево и отбивка идут фильтром, а не тенью текста: тень текста при\n     прозрачной заливке легла бы ПОВЕРХ градиента и съела бы его.\n     Порядок важен: сначала плотная тёмная отбивка (она и заменяет\n     снятую заслонку под колонкой), потом ядро, потом широкий нимб. */\n  text-shadow: none;\n  filter:\n    drop-shadow(0 2px 3px rgba(4, 5, 11, .92))\n    drop-shadow(0 0 calc(4px * var(--rv-неон-сила)) var(--rv-неон-ядро))\n    drop-shadow(0 0 calc(16px * var(--rv-неон-сила)) var(--rv-неон-тело))\n    drop-shadow(0 0 calc(46px * var(--rv-неон-сила)) var(--rv-неон-нимб));\n}\n/* Ключевое слово акта. Индиго и горит сильнее остального: в каждом\n   акте есть одна мысль, ради которой акт написан, и она обязана\n   светиться ярче фразы вокруг неё. */\n.rv-заг em {\n  font-style: normal;\n  /* Ключевое слово было светлее собственного зарева и тонуло в нём.\n     Тон опущен до тела индиго, зарево прижато к знаку: слово теперь\n     отличается от остального заголовка КРАСКОЙ, а не яркостью. */\n  /* Своя заливка обязательна. Прозрачность буквы (-webkit-text-fill-color)\n     наследуется, и без собственного градиента ключевое слово красил бы\n     градиент заголовка: слово перестало бы отличаться вовсе. */\n  background: linear-gradient(166deg, #C8D4FF 0%, #93A6FF 55%, #6E86F5 100%);\n  -webkit-background-clip: text;\n  background-clip: text;\n  -webkit-text-fill-color: transparent;\n  color: transparent;\n  text-shadow: none;\n}\n\n/* ══════════════════════════════════════════════════════════════\n   НЕОН ДЫШИТ ПО ХОДУ АКТА\n\n   Сила свечения идёт от той же величины, что и всё остальное на сайте,\n   от доли хода --д. Заголовок разгорается на входе в акт, держится и\n   притухает на выходе. Это не мигание по таймеру: прокрутка вверх\n   гасит его ровно так же, как прокрутка вниз зажигала.\n\n   Ключевое слово вдобавок коротко вспыхивает в тот момент, когда акт\n   выходит на середину, - там, где сцена показывает то самое, о чём\n   слово написано.\n   ══════════════════════════════════════════════════════════════ */\n/* СИЛА НЕОНА ИДЁТ ОТ ФАЗЫ, А НЕ ОТ ДОЛИ, И ЭТО ВОПРОС СКОРОСТИ.\n\n   Сначала она считалась из --вид, то есть менялась КАЖДЫЙ КАДР. Радиус\n   размытия тени входит в неё множителем, а смена радиуса размытия это\n   полная перерисовка светящегося текста - шестьдесят раз в секунду на\n   заголовке в семьдесят точек кегля. Замер скорости поймал это: на\n   телефоне 72,7 процента кадров выходили длиннее сорока миллисекунд,\n   то есть каждый третий кадр человек видел заминкой.\n\n   Фаза меняется трижды за акт. Разница на глаз та же (заголовок\n   разгорается к середине акта и притухает к концу), перерисовок вместо\n   шестидесяти в секунду - три за акт.\n\n   Плавный вход и выход при этом никуда не делись: их держит\n   прозрачность слоя, а прозрачность браузер умеет менять без\n   перерисовки. */\n.rv-плёнка-идёт .rv-акт { --rv-неон-сила: .72; }\n.rv-плёнка-идёт .rv-акт[data-фаза=\"1\"] { --rv-неон-сила: 1; }\n.rv-плёнка-идёт .rv-акт[data-фаза=\"2\"] { --rv-неон-сила: .86; }\n.rv-плёнка-идёт .rv-акт[data-фаза=\"1\"] .rv-заг em {\n  animation: rv-неон-вспышка 2.6s ease-in-out infinite;\n}\n@keyframes rv-неон-вспышка {\n  0%, 100% { --rv-неон-сила: 1; opacity: 1; }\n  46%      { --rv-неон-сила: 1.5; opacity: 1; }\n  52%      { --rv-неон-сила: .8; opacity: .93; }\n}\n@media (prefers-reduced-motion: reduce) {\n  .rv-плёнка-идёт .rv-акт[data-фаза=\"1\"] .rv-заг em { animation: none; }\n  .rv-плёнка-идёт .rv-акт { --rv-неон-сила: 1; }\n}\n/* Тень под буквами. Не вместо подложки, а вдобавок: подложка гасит\n   кадр целиком, тень работает вплотную к глифу и вытягивает те случаи,\n   где мир ярок ровно под одной строкой. Замер её не видит (он меряет\n   фон при убранном тексте), но человек видит. */\n/* Заголовка в этом списке НЕТ, и это не забывчивость.\n\n   У него заливка градиентом через обрезку фона по тексту, а сама\n   буква прозрачна. Тень рисуется формой буквы и краской тени - и,\n   поскольку буква прозрачная, она видна СКВОЗЬ неё, поверх градиента.\n   На кадре это выглядело так: «Всё, что ты открываешь» набрано тёмно\n   серым на чёрном, а ключевые слова индиго горят. Заголовку тень даёт\n   drop-shadow ниже: тот работает по готовой картинке элемента и на\n   заливку не лезет. */\n.rv-над, .rv-абз, .rv-сноска,\n.rv-станции li, .rv-тех li, .rv-док, .rv-орбита {\n  text-shadow: 0 1px 2px rgba(5, 6, 12, .9), 0 0 14px rgba(5, 6, 12, .75);\n}\n/* ══════════════════════════════════════════════════════════════\n   АБЗАЦ\n\n   Было: ровная серая заливка от первой буквы до последней. Читается\n   сплошняком, и глазу негде зацепиться.\n\n   Стало: первая фраза ярче и крупнее остальных - это ЛИД, он несёт\n   мысль акта, а дальше идут подробности. Слева волосяная линия\n   индиго: она привязывает колонку слов к кадру, и текст перестаёт\n   висеть в воздухе поверх картинки.\n   ══════════════════════════════════════════════════════════════ */\n.rv-абз {\n  position: relative;\n  font-size: clamp(15px, 1.35vw, 18px);\n  line-height: 1.62; color: var(--rv-текст-тихо);\n  margin: 0; max-width: min(46ch, 100%);\n  padding-left: calc(var(--rv-шаг) * 2.25);\n}\n.rv-абз::before {\n  content: \"\"; position: absolute; left: 0; top: .35em; bottom: .35em;\n  width: 2px; border-radius: 2px;\n  background: linear-gradient(180deg,\n    rgba(var(--rv-свет-rgb), .75), rgba(var(--rv-свет-rgb), .06));\n}\n.rv-абз b {\n  font-weight: 500; color: var(--rv-текст);\n  font-size: 1.06em; letter-spacing: -.004em;\n}\n\n.rv-марка { display: flex; align-items: center; gap: calc(var(--rv-шаг) * 1.5); }\n.rv-марка img { width: 44px; height: 44px; }\n.rv-марка b { font-size: 15px; letter-spacing: .16em; font-weight: 700; }\n.rv-марка i {\n  /* Слоган марки. Девять точек с разрядкой в 0,3em не читались вовсе;\n     разрядка ужата до 0,22em, кегль поднят до одиннадцати - строка\n     занимает ту же ширину и стала разборчивой. */\n  font-style: normal; font-size: 11px; letter-spacing: .22em;\n  color: var(--rv-текст-очень-тихо); display: block;\n}\n\n/* ── Створ ─────────────────────────────────────────────────────\n   Закрытый вход. Выглядит одинаково и при неверном ключе, и при его\n   отсутствии: по виду створа нельзя понять, существует ли за ним\n   что-нибудь вообще. */\n.rv-створ {\n  position: fixed; inset: 0; z-index: 90;\n  display: grid; place-content: center; justify-items: center;\n  gap: calc(var(--rv-шаг) * 3);\n  background: var(--rv-фон);\n  text-align: center; padding: var(--rv-поле);\n}\n.rv-створ p {\n  margin: 0; max-width: 34ch;\n  color: var(--rv-текст-тихо); font-size: 15px; line-height: 1.6;\n}\nhtml.rv-открыт .rv-створ { display: none; }\n/* До проверки ключа содержимое не показываем вовсе: иначе оно мигнёт\n   под створом на медленной машине.\n\n   Гасит плёнку критический стиль в шапке документа, и гасит безусловно:\n   иначе она мигнёт в тот промежуток, пока этот файл ещё едет. Значит\n   ВЕРНУТЬ видимость обязан кто-то здесь - само по себе это не\n   произойдёт. Правило ниже и есть тот самый возврат, и без него сайт\n   открывается в чёрный экран: створ уходит, а содержимое остаётся\n   невидимым. Поймано снимком экрана; проверки разметки этого не видели,\n   потому что текст узлов читается и у невидимого блока. */\nhtml:not(.rv-открыт) .rv-плёнка { visibility: hidden; }\nhtml.rv-открыт .rv-плёнка { visibility: visible; }\n\n/* ── Кнопки ────────────────────────────────────────────────────\n   Сорок четыре точки в высоту - порог, ниже которого палец начинает\n   промахиваться. Держим его сразу, а не чиним потом обмером. */\n.rv-кн {\n  display: inline-flex; align-items: center; gap: var(--rv-шаг);\n  min-height: 44px; padding: 0 calc(var(--rv-шаг) * 2.5);\n  border: 1px solid var(--rv-кромка); border-radius: 3px;\n  background: var(--rv-плита); color: var(--rv-текст);\n  font: 600 13px/1 var(--rv-шрифт); letter-spacing: .08em;\n  text-decoration: none; cursor: pointer;\n  transition: border-color .2s, box-shadow .2s;\n}\n.rv-кн:hover, .rv-кн:focus-visible {\n  border-color: rgba(var(--rv-свет-rgb), .9);\n  box-shadow: 0 0 0 1px rgba(var(--rv-свет-rgb), .35),\n              0 0 22px -4px rgba(var(--rv-свет-rgb), .85),\n              inset 0 0 18px -10px rgba(var(--rv-свет-rgb), .9);\n  text-shadow: 0 0 10px rgba(var(--rv-свет-rgb), .8);\n}\n/* ГЛАВНАЯ КНОПКА ГОРИТ САМА, а не только под пальцем. Она одна на весь\n   сайт, и до неё человек доходит через семь актов - к этому моменту\n   она обязана быть очевидной. Свечение медленно дышит: неподвижное\n   пятно света глаз перестаёт замечать через пару секунд. */\n.rv-кн-гл {\n  background: linear-gradient(120deg, var(--rv-индиго-тень), var(--rv-индиго-свет));\n  border-color: rgba(var(--rv-свет-rgb), .55);\n  color: #FFFFFF;\n  animation: rv-кн-дыхание 3.4s ease-in-out infinite;\n}\n@keyframes rv-кн-дыхание {\n  0%, 100% { box-shadow: 0 0 22px -8px rgba(var(--rv-свет-rgb), .85),\n                         0 0 0 1px rgba(var(--rv-свет-rgb), .28); }\n  50%      { box-shadow: 0 0 40px -6px rgba(var(--rv-свет-rgb), .95),\n                         0 0 0 1px rgba(var(--rv-свет-rgb), .5); }\n}\n.rv-кн-гл:hover, .rv-кн-гл:focus-visible {\n  animation: none;\n  box-shadow: 0 0 46px -6px rgba(var(--rv-свет-rgb), 1),\n              0 0 0 1px rgba(var(--rv-свет-rgb), .7);\n}\n@media (prefers-reduced-motion: reduce) {\n  .rv-кн-гл { animation: none;\n    box-shadow: 0 0 30px -8px rgba(var(--rv-свет-rgb), .9); }\n}\n/* Ворота в сторону Rocket CDN носят его цвет, а не наш: прокол туда\n   должен читаться как чужая сторона ещё до нажатия. */\n.rv-кн-cdn { border-color: rgba(var(--rv-cdn-rgb), .5); }\n.rv-кн-cdn:hover, .rv-кн-cdn:focus-visible {\n  border-color: rgba(var(--rv-cdn-rgb), .9);\n  box-shadow: 0 0 26px -8px rgba(var(--rv-cdn-rgb), .9);\n}\n\n/* ── Подвал ────────────────────────────────────────────────────*/\n.rv-подвал {\n  padding: calc(var(--rv-шаг) * 8) var(--rv-поле) calc(var(--rv-шаг) * 6);\n  border-top: 1px solid var(--rv-кромка);\n  display: grid; gap: calc(var(--rv-шаг) * 3);\n  color: var(--rv-текст-тихо); font-size: 14px;\n}\n.rv-подвал a { min-height: 44px; display: inline-flex; align-items: center; }\n\n/* ── Уважение к настройкам человека ────────────────────────────\n   При просьбе убрать движение сайт не ломается и не пустеет: акты\n   остаются, они просто перестают двигаться. Отказывать в содержимом\n   нельзя - на этом уже обожглись в родственном проекте. */\n@media (prefers-reduced-motion: reduce) {\n  .rv-акт { height: auto !important; }\n  .rv-акт > .rv-кадр { position: static; height: auto; }\n  /* Слой обязан выйти из абсолютного положения ВМЕСТЕ с кадром.\n     Пока кадр становился обычным, а слой оставался прижатым к его\n     краям, все акты наваливались друг на друга в одну кашу из\n     заголовков - поймано снимком экрана, числовой замер наложений\n     этого не увидел, потому что коробки слоёв формально не\n     пересекались.\n\n     Полей сверху и снизу тут больше, чем было у кадра: в обычном\n     потоке акты идут подряд, и без воздуха между ними лента\n     читается сплошняком. */\n  .rv-акт > .rv-кадр > .rv-слой {\n    position: static; inset: auto;\n    padding: 12vh var(--rv-поле);\n  }\n  /* Объёмный холст в этом режиме не нужен: сцена в нём не движется, а\n     место занимает. Содержимое при этом НЕ пропадает - оно всё в\n     разметке, и это принципиально. */\n  .rv-мир { display: none; }\n}\n\n@media (pointer: coarse) {\n  .rv-подвал a, .rv-кн { min-height: 44px; }\n}\n\n/* ── Блоки фактов ──────────────────────────────────────────────\n   Числа приезжают из одного файла (assets/rv-data.js), разметка держит\n   только пустые гнёзда. Оформление здесь общее для всех гнёзд: они\n   родня по смыслу, и разное оформление читалось бы как разные сущности.\n\n   Сетка везде авто-заполняемая. Причина не в красоте: у станций три\n   позиции, у тарифов две, у звена три, и жёсткие колонки под каждое\n   гнездо пришлось бы чинить на каждой новой ширине по отдельности. */\n.rv-станции, .rv-тех { list-style: none; margin: calc(var(--rv-шаг)*3) 0 0; padding: 0; }\n.rv-станции, .rv-тех, .rv-доки, .rv-звено {\n  display: grid; gap: var(--rv-шаг);\n  /* Минимум колонки тоже не шире экрана: с жёсткими 210 точками сетка\n     на узком складывала ряд в 646 точек при окне 412. */\n  grid-template-columns: repeat(auto-fit, minmax(min(210px, 100%), 1fr));\n  max-width: min(760px, 100%);\n}\n.rv-доки, .rv-звено { margin-top: calc(var(--rv-шаг)*3); }\n\n.rv-станции li, .rv-тех li, .rv-док, .rv-орбита {\n  /* Без этого длинное слово внутри ячейки распирает колонку сетки\n     шире её доли: у элементов сетки наименьшая ширина по умолчанию\n     равна ширине содержимого, а не нулю. */\n  min-width: 0;\n  border: 1px solid var(--rv-кромка); border-radius: 3px;\n  background: var(--rv-плита);\n  padding: calc(var(--rv-шаг)*2);\n  display: grid; gap: calc(var(--rv-шаг)*.5);\n  /* Левая кромка марочного цвета вместо заливки: заливка спорила бы с\n     кадром за спиной, а кромка держит принадлежность к бренду и\n     оставляет космос видимым. */\n  border-left: 2px solid rgba(var(--rv-свет-rgb), .55);\n}\n.rv-станции b, .rv-тех b, .rv-док b, .rv-орбита b {\n  font-size: 15px; letter-spacing: .04em;\n}\n/* Числа - голосом и со свечением. Процент реферальной лестницы и цена\n   тарифа это единственные числа, которые человек ЗАПОМИНАЕТ, и они\n   обязаны выглядеть как показание прибора, а не как строка прайса. */\n.rv-орбита b {\n  font-family: var(--rv-шрифт-голос); font-weight: 700;\n  font-size: 22px; letter-spacing: -.02em;\n  color: #DCE3FF;\n  text-shadow: 0 0 10px rgba(var(--rv-свет-rgb), .7),\n               0 0 26px rgba(var(--rv-индиго-rgb), .5);\n}\n.rv-станции span, .rv-тех span, .rv-док span, .rv-орбита i {\n  font-style: normal; font-size: 13px; line-height: 1.45;\n  color: var(--rv-текст-тихо);\n}\n.rv-док i {\n  font-style: normal; font-size: 12px; letter-spacing: .14em;\n  text-transform: uppercase; color: var(--rv-текст-очень-тихо);\n}\n.rv-док u {\n  text-decoration: none; font-size: 18px; font-weight: 700;\n  font-family: var(--rv-шрифт-голос); letter-spacing: -.02em;\n  color: #DCE3FF;\n  text-shadow: 0 0 10px rgba(var(--rv-свет-rgb), .65),\n               0 0 26px rgba(var(--rv-индиго-rgb), .45);\n  margin-top: calc(var(--rv-шаг)*.5);\n}\n\n/* Сноска. Это техническая приписка, и выглядеть она должна припиской:\n   разрядка шире обычного текста, метка индиго вместо отступа. Так она\n   не спорит с абзацем за внимание и при этом не теряется. */\n/* ── Три шага ──────────────────────────────────────────────────\n   Список, а не сетка карточек. У шагов есть ПОРЯДОК, и порядок здесь\n   несёт смысл: ключ без приложения бесполезен, приложение без ключа\n   пусто. Карточки в ряд этот порядок теряют - глаз читает их как три\n   равноправные штуки.\n\n   Номер шага светится, как номер акта в слейте: сайт говорит числами\n   одинаково везде. */\n.rv-шаги {\n  list-style: none; margin: calc(var(--rv-шаг) * 3) 0 0; padding: 0;\n  display: grid; gap: calc(var(--rv-шаг) * 2);\n  max-width: min(52ch, 100%);\n  counter-reset: шаг;\n}\n.rv-шаги li {\n  display: flex; align-items: flex-start; gap: calc(var(--rv-шаг) * 2);\n}\n.rv-шаги i {\n  flex: none; width: 34px; height: 34px;\n  display: grid; place-items: center;\n  font-family: var(--rv-шрифт-голос); font-style: normal;\n  font-weight: 700; font-size: 14px;\n  color: var(--rv-индиго-свет);\n  border: 1px solid rgba(var(--rv-свет-rgb), .45);\n  border-radius: 50%;\n  text-shadow: 0 0 8px var(--rv-неон-ядро);\n  box-shadow: 0 0 calc(16px * var(--rv-неон-сила, 1)) -4px rgba(var(--rv-свет-rgb), .8),\n              inset 0 0 12px -8px rgba(var(--rv-свет-rgb), .9);\n}\n.rv-шаги span { display: grid; gap: calc(var(--rv-шаг) * .5); min-width: 0; }\n.rv-шаги b {\n  font-size: clamp(16px, 1.4vw, 19px); font-weight: 600;\n  color: var(--rv-текст); letter-spacing: -.005em;\n}\n.rv-шаги u {\n  text-decoration: none;\n  font-size: 14px; line-height: 1.55; color: var(--rv-текст-тихо);\n}\n/* Линия, связывающая шаги в последовательность. Без неё три строки\n   стоят рядом, а не идут одна за другой. */\n.rv-шаги li { position: relative; }\n.rv-шаги li:not(:last-child)::before {\n  content: \"\"; position: absolute;\n  left: 17px; top: 38px; bottom: calc(var(--rv-шаг) * -2 + 4px);\n  width: 1px;\n  background: linear-gradient(180deg,\n    rgba(var(--rv-свет-rgb), .5), rgba(var(--rv-свет-rgb), .06));\n}\n\n.rv-сноска {\n  position: relative;\n  margin: calc(var(--rv-шаг)*2.5) 0 0; max-width: min(52ch, 100%);\n  font-size: 13px; line-height: 1.55; letter-spacing: .008em;\n  color: var(--rv-текст-очень-тихо);\n  padding-left: calc(var(--rv-шаг) * 2.25);\n}\n.rv-сноска::before {\n  content: \"\"; position: absolute; left: 0; top: .55em;\n  width: 10px; height: 1px;\n  background: rgba(var(--rv-свет-rgb), .6);\n}\n\n/* Подвал: ссылки в ряд, но на телефоне в столбец - иначе три ссылки по\n   44 точки не помещаются в ширину и рвутся посередине слова. */\n.rv-подвал > div[data-заполнить] {\n  display: flex; flex-wrap: wrap; gap: calc(var(--rv-шаг)*3);\n}\n/* Сноска под рядом контактов идёт целой строкой: в ряду она встала бы\n   шестой ссылкой и порвалась бы по слову. */\n.rv-подвал > div[data-заполнить] > .rv-сноска {\n  flex: 1 0 100%; margin: 0;\n}\n\n/* Крупная марка первого экрана. Размер в пределах: на телефоне 96 точек\n   съедают треть высоты кадра и вытесняют заголовок за нижнюю кромку. */\n.rv-марка-гл {\n  width: clamp(64px, 8vw, 96px); height: auto;\n  margin-bottom: calc(var(--rv-шаг) * 4);\n}\n\n/* ── Общий объёмный холст ──────────────────────────────────────\n   Один на весь сайт, неподвижен относительно окна, лежит под\n   содержимым. Не участвует в прокрутке намеренно: акты сменяются\n   движением камеры внутри него, а не проездом самого холста, и\n   поэтому склейки между актами не существует физически. */\n.rv-мир {\n  position: fixed; inset: 0; z-index: 0;\n  width: 100%; height: 100%;\n  pointer-events: none;\n}\n.rv-плёнка { position: relative; z-index: 1; }\n\n/* ── Экран загрузки ────────────────────────────────────────────\n   Кадром он не отличается от сайта: тот же чёрный, та же марка. Так\n   уход экрана читается не сменой картинки, а тем, что просто убрали\n   лишнее. У родственного проекта заставка была отдельным зрелищем, и\n   переход от неё к сайту всегда был заметным швом. */\n.rv-загр {\n  position: fixed; inset: 0; z-index: 80;\n  background: var(--rv-фон);\n  display: grid; place-content: center; justify-items: center;\n  gap: calc(var(--rv-шаг) * 3);\n  transition: opacity .52s ease;\n}\n.rv-загр.ушёл { opacity: 0; pointer-events: none; }\n.rv-загр-в { display: grid; justify-items: center; gap: calc(var(--rv-шаг) * 3); }\n.rv-загр-марка { width: clamp(56px, 7vw, 72px); height: auto; }\n\n/* Ход загрузки полосой, а не кружком. Кружок вращается независимо от\n   того, движется ли дело, и потому врёт: он крутится одинаково и когда\n   грузится, и когда всё висит. Полоса растёт только по факту. */\n.rv-загр-путь {\n  width: clamp(120px, 16vw, 180px); height: 2px;\n  background: rgba(var(--rv-свет-rgb), .14);\n  overflow: hidden;\n}\n.rv-загр-путь i {\n  display: block; width: 100%; height: 100%;\n  transform: scaleX(0); transform-origin: 0 50%;\n  background: linear-gradient(90deg, var(--rv-индиго), var(--rv-индиго-свет));\n  transition: transform .34s ease;\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .rv-загр, .rv-загр-путь i { transition: none; }\n}\n\n/* ── Карточки станций как орган выбора ─────────────────────────\n   Карточки описаны выше как простой список фактов. Здесь они получают\n   поведение: акт «Выход» делает их третьим способом выбрать станцию,\n   наравне с кадром и клавиатурой.\n\n   Вес селекторов намеренно избыточен. Правило одного класса проигрывает\n   по весу описанию «.rv-станции li» выше, и класс на карточке\n   появлялся, а цвет не менялся. Поймано опросом вычисленного стиля, а\n   не глазом: на снимке разница между выбранной и невыбранной сводилась\n   к одному ореолу и выглядела правдоподобной. */\n.rv-станции li.rv-станция {\n  cursor: pointer;\n  transition: border-color .25s, box-shadow .25s, background-color .25s;\n}\n.rv-станции li.rv-станция:hover { border-left-color: rgba(138,156,255,.9); }\n.rv-станции li.rv-станция:focus-visible {\n  outline: 2px solid rgba(138,156,255,.9); outline-offset: 2px;\n}\n.rv-станции li.rv-станция-выбрана {\n  border-left-color: #8A9CFF;\n  background: rgba(48,72,168,.24);\n  box-shadow: 0 0 30px -10px rgba(96,120,216,.95);\n}\n\n/* ══════════════════════════════════════════════════════════════\n   ЛИСТЫ: содержимое акта разведено по ходу, когда оно не помещается\n\n   Раньше это было написано руками и ровно для одного акта - «Шлюзовая\n   рубка», по ширине экрана. Замер посадки показал, что тесно бывает и в\n   «Проколе», и в «Точке выхода», и в самой рубке на альбомном экране\n   1024x600, где ширина большая, а высоты нет. Ширина здесь вообще не\n   при чём: не помещается по ВЫСОТЕ.\n\n   Поэтому правило стало общим. Блок объявляет в разметке, в каких фазах\n   акта он живёт (data-лист=\"0\", \"2\", \"0 1\"); блок без этого признака\n   виден всегда. Включается разведение только когда rv-лист.js померил\n   живьём и поставил акту data-тесно. Помещается - показываем всё разом.\n\n   Убираем visibility, а не только прозрачность: невидимый блок\n   продолжает ловить касания, и человек жмёт в пустоту.\n   ══════════════════════════════════════════════════════════════ */\n/* Ушедший лист убирается через display, а не через visibility.\n\n   Скрытый через visibility блок ПРОДОЛЖАЕТ занимать своё место в\n   сетке. С ним акт вёл себя так: в средней фазе виден один блок из\n   трёх, а стоит он там, где стоял бы третьим - на 270 точке при кадре\n   в 640, и снизу под ним пусто на треть экрана. В последней фазе всё\n   было ещё хуже: единственный видимый блок оказывался НИЖЕ кромки\n   окна, на 747 точке, то есть человек не видел его вовсе.\n\n   С display показанный лист получает кадр целиком и встаёт по центру -\n   ровно как отдельный кадр фильма, чем он и является. */\n/* Прячем НЕ ТОТ лист, а не показываем нужный.\n\n   Сначала было наоборот: все листы display:none, а подходящему фазе\n   ставился display:block. И это ломало вёрстку самих блоков - слейт\n   акта устроен флексом (номер, имя, линия), а правило переводило его\n   в блок, и на телефоне номер слипался с именем: «04ПРОКОЛ» вместо\n   «04 - ПРОКОЛ», линия пропадала вовсе.\n\n   Правило про ЧУЖИЕ листы этой беды не создаёт: показанный блок\n   сохраняет своё родное поведение, каким бы оно ни было. */\n.rv-акт[data-тесно][data-фаза=\"0\"] .rv-слой > [data-лист]:not([data-лист~=\"0\"]),\n.rv-акт[data-тесно][data-фаза=\"1\"] .rv-слой > [data-лист]:not([data-лист~=\"1\"]),\n.rv-акт[data-тесно][data-фаза=\"2\"] .rv-слой > [data-лист]:not([data-лист~=\"2\"]) {\n  display: none;\n}\n/* Появление не переходом, а проигрыванием: перехода между display нет\n   ни у одного браузера, а проигрывание начинается ровно в тот кадр,\n   когда блок появился. */\n.rv-акт[data-тесно][data-фаза=\"0\"] .rv-слой > [data-лист~=\"0\"],\n.rv-акт[data-тесно][data-фаза=\"1\"] .rv-слой > [data-лист~=\"1\"],\n.rv-акт[data-тесно][data-фаза=\"2\"] .rv-слой > [data-лист~=\"2\"] {\n  animation: rv-лист-вход .42s ease both;\n}\n@keyframes rv-лист-вход {\n  from { opacity: 0; transform: translate3d(0, 14px, 0); }\n  to   { opacity: 1; transform: none; }\n}\n\n/* Замер. rv-лист.js на один кадр показывает ВСЕ листы и снимает высоту\n   содержимого. Без этого замер зависел бы от того, какая фаза стоит\n   сейчас, и акт то объявлял бы себя тесным, то нет. */\n.rv-акт.rv-мерим .rv-слой { align-content: start; }\n.rv-акт.rv-мерим .rv-слой > [data-лист] {\n  /* revert-layer, а не block: замер обязан видеть блок таким, каким он\n     будет на экране, включая флексовый слейт. */\n  display: revert-layer !important;\n  opacity: 1 !important; visibility: visible !important;\n  transform: none !important; animation: none !important;\n}\n\n/* При просьбе убрать движение разводить нечего: акты идут обычной\n   лентой сверху вниз, места сколько угодно, и всё обязано быть видно\n   сразу. */\n@media (prefers-reduced-motion: reduce) {\n  .rv-акт[data-тесно] .rv-слой > [data-лист] {\n    display: revert-layer !important;\n    opacity: 1 !important; visibility: visible !important;\n    transform: none !important; animation: none !important;\n  }\n}\n\n/* ── Слова уходят на проколе ───────────────────────────────────\n   В миг прохода насквозь текст уводится с экрана. Это не спасение от\n   вспышки, а часть сцены: человек в этот момент не читает, он\n   проходит. Слова возвращаются с другой стороны.\n\n   Окно узкое и привязано к доле акта, а не к фазе: фаза грубее, она\n   охватывает треть акта, и текст пропадал бы задолго до удара.\n\n   Считается через max двух наклонов вместо abs: abs в оформлении\n   поддержан не везде, а два наклона работают всюду и читаются так же\n   однозначно - слева от окна растёт первый, справа второй. */\n/* ПОЧЕМУ ЭТО ПЕРЕМЕННАЯ, А НЕ ПРОЗРАЧНОСТЬ НАПРЯМУЮ. Напрямую было, и\n   не работало ни одного дня: ниже стоит единый закон появления, он\n   пишет прозрачность тому же слою селектором тяжелее и строкой позже,\n   и всегда побеждал. Замер вычисленного стиля на доле 0.45: слой\n   непрозрачен на единицу, то есть заголовок стоял ПОВЕРХ вспышки\n   прокола - белым по белому.\n\n   Акт объявляет свою поправку, единый закон её умножает. Так у слоя\n   остаётся один источник прозрачности, и спорить некому. */\n.rv-акт[data-акт=\"прокол\"] {\n  --проём: max(\n    clamp(0, calc((0.395 - var(--д, 0)) * 14), 1),\n    clamp(0, calc((var(--д, 0) - 0.50) * 14), 1)\n  );\n}\n.rv-плёнка-идёт .rv-акт[data-акт=\"прокол\"] > .rv-кадр > .rv-слой {\n  transition: opacity .12s linear;\n}\n@media (prefers-reduced-motion: reduce) {\n  /* Без движения нет и прокола: текст обязан быть виден всегда. */\n  .rv-акт[data-акт=\"прокол\"] { --проём: 1; }\n}\n\n/* ── Звено на узком экране ─────────────────────────────────────\n   Три карточки орбит вставали столбцом и вместе со сноской уезжали за\n   нижнюю кромку на 72 точки: замер в последней фазе акта «Рубка» дал\n   низ 987 при экране 915.\n\n   Ставим их в ряд. Это не сжатие ради сжатия: в карточке орбиты всего\n   два коротких слова и число, ей широкая колонка не нужна вовсе, а\n   ряд из трёх процентов ещё и читается как ЛЕСТНИЦА уровней - 20, 6,\n   3, - что и есть смысл реферальной программы. Столбец эту убывающую\n   лестницу разрывал.\n\n   Разгон числа убран: в узкой колонке «20 %» с пробелом перед знаком\n   переносится на две строки. */\n@media (max-width: 760px) {\n  .rv-звено {\n    grid-template-columns: repeat(3, 1fr);\n    gap: calc(var(--rv-шаг) * .75);\n  }\n  .rv-звено .rv-орбита { padding: calc(var(--rv-шаг) * 1.25); }\n  .rv-звено .rv-орбита b { font-size: 20px; white-space: nowrap; }\n    /* Двенадцать, а не одиннадцать: подпись под числом в узкой колонке\n     и так набрана самой тихой краской, и на одиннадцати она перестаёт\n     читаться. Строка при этом не рвётся - слова короткие. */\n  .rv-звено .rv-орбита i { font-size: 12px; line-height: 1.3; }\n}\n\n/* ── Подложка под слова ────────────────────────────────────────\n   Мир получил свет и свечение, и текст немедленно перестал читаться\n   там, где мир яркий. Замер площади, на которой буквы лежат на ярких\n   точках кадра: прокол 97 тысяч точек на мониторе и 123 тысячи на\n   телефоне, выход - 30 и 36 тысяч.\n\n   Решение не «уводить текст» и не «гасить мир», а подложка - ровно то,\n   что делает кино с титрами: под буквами кадр слегка притемняется, а\n   вокруг остаётся как был.\n\n   ПОЧЕМУ ГРАДИЕНТОМ, А НЕ ПЛАШКОЙ. Плашка с краем читается панелью\n   интерфейса, наклеенной поверх мира, и разрушает ровно то ощущение\n   единого пространства, ради которого всё затевалось. Градиент без\n   края не читается вовсе - глаз видит только то, что буквы стали\n   разборчивее.\n\n   ПОЧЕМУ СЛЕВА, А НЕ ПО ВСЕМУ КАДРУ. Текст на этом сайте всегда в\n   левой колонке, а мир живёт справа. Затемнять правую половину значит\n   гасить то, что мы только что зажгли. */\n/* ПОДЛОЖКА ЖИВЁТ НА КАДРЕ, А НЕ НА СЛОЕ. Слой теперь трёхмерный\n   (preserve-3d, текст уходит вглубь по крупности мира), и псевдоэлемент\n   слоя на нулевой глубине оказывался ПЕРЕД текстом, ушедшим назад:\n   тёмная плита с прозрачностью .88 ложилась поверх букв, и на малых\n   долях акта заголовок читался тусклым при прозрачности единица\n   (поймано снимком станции на долях 0.1 и 0.3 и пробой стилей). Кадр\n   не трёхмерный, его псевдоэлемент всегда сзади. */\n/* ── ПОДЛОЖКА ТОЛЬКО ТАМ, ГДЕ ЕЩЁ ЕСТЬ ЧТО ПОДКЛАДЫВАТЬ ────────\n   Эта подложка писалась под ТЕКСТ РАЗМЕТКИ: белые буквы на пейзаже\n   читались плохо, и под ними стелили тёмное. С тех пор текст переехал\n   В СЦЕНУ (rv-слово3d): при `рв-слова-в-сцене` заголовок, подзаголовок,\n   абзац и карточки в разметке спрятаны совсем, а на экране стоят буквы\n   поля расстояний со своей тенью и своим заревом.\n\n   Подложка при этом осталась и продолжала гасить мир, под которым уже\n   нечего защищать. На телефоне это радиальное пятно в 58 процентов\n   почти чёрного на четыре пятых кадра, и владелец увидел ровно его:\n   «на мобильной версии весь сайт затемнённый». Замер это подтвердил\n   числом: одинаковые доли одних и тех же актов давали на телефоне\n   среднюю яркость 95-109 против 136-146 на ПК, при одной и той же\n   сцене, одном объективе и одной экспозиции. У igloo никакой подложки\n   нет вовсе - там светлый мир и тёмные буквы поверх него.\n\n   Поэтому подложка теперь живёт только пока слова в РАЗМЕТКЕ, то есть\n   на запасном пути: нет WebGL, не собрался атлас, не поднялся слой\n   слов. Там она по-прежнему нужна и по-прежнему уместна. */\nhtml:not(.рв-слова-в-сцене) .rv-кадр::before {\n  content: \"\";\n  position: absolute; inset: 0;\n  pointer-events: none;\n  /* Стопы сдвинуты вправо по ЗАМЕРУ КОНТРАСТА, а не на глаз. Колонка\n     слов доходит до 43 процентов ширины кадра, а подложка сходила на\n     нет уже к 46 и почти ничего не давала там, где стоят карточки:\n     «Hysteria 2» поверх тоннеля давал отношение яркостей 3.24 при\n     пороге 4.5, а на середине прокола - 1.04, то есть буквы и фон были\n     почти одной яркости. Теперь подложка держит колонку целиком и\n     отпускает кадр правее неё. */\n  /* ЗАСЛОНКА СНЯТА.\n\n     Стоял градиент в 88 процентов почти чёрного через пол-экрана. По\n     задаче это подложка под слова, по факту тёмная плита на всю левую\n     половину кадра: мир за ней не виден вовсе. Владелец сказал прямо -\n     «затемнения лишние, убери».\n\n     Контраст текста теперь держит САМ ТЕКСТ, а не заслонка перед миром.\n     У заголовка своё зарево и своя тёмная тень по форме буквы (см.\n     .rv-заг ниже), у абзаца плотная тень строки. Это и правильнее по\n     ремеслу: подложка гасит то, ради чего человек пришёл, а тень по\n     контуру знака стоит ровно там, где нужна, и весит ноль площади.\n\n     Остаток градиента оставлен совсем лёгким и только у самой левой\n     кромки: он снимает случайное совпадение белой буквы с блеском\n     реголита, но кадр не закрывает и панелью не читается. */\n  background: linear-gradient(\n    100deg,\n    rgba(5, 6, 12, .34) 0%,\n    rgba(5, 6, 12, .20) 22%,\n    rgba(5, 6, 12, .07) 38%,\n    rgba(5, 6, 12, 0) 52%\n  );\n  z-index: -1;\n}\n/* Днём та же подложка СВЕТЛАЯ. Тёмный градиент под колонкой на светлой\n   странице читался ровно тем «затемнением, которое перекрывает 3D»,\n   о котором говорил владелец: слева серо-чёрная плита, справа белый\n   мир. Телефонная светлая подложка ниже была, а широкая нет, и на ПК\n   днём стояла ночная. */\nhtml:not(.рв-слова-в-сцене):root[data-тема=\"светлая\"] .rv-кадр::before {\n  background: linear-gradient(\n    100deg,\n    rgba(238, 241, 251, .86) 0%,\n    rgba(238, 241, 251, .78) 28%,\n    rgba(238, 241, 251, .48) 46%,\n    rgba(238, 241, 251, .14) 60%,\n    rgba(238, 241, 251, 0) 72%\n  );\n}\n/* На телефоне колонки нет: текст занимает всю ширину, и подложка идёт\n   сверху вниз, повторяя место текста, а не левый край. */\n/* На телефоне колонки нет: слова занимают всю ширину и стоят ПО ЦЕНТРУ\n   кадра, потому что лист акта выравнивается по центру. Подложка сверху\n   вниз к этому не подходила вовсе: она гасила пустой верх и отпускала\n   ровно ту середину, где стоят буквы.\n\n   Замер контраста на телефоне: заголовок «С той стороны сеть снова\n   открыта» поверх планеты давал 1.74 при пороге 3, карточки станций -\n   1.8-2.1 при пороге 4.5. Это не «плоховато читается», это написано и\n   не читается.\n\n   Ставим мягкое пятно по центру кадра: там, где слова, темно, а верх и\n   низ кадра остаются миру. Края у пятна нет - оно уходит в ноль к\n   кромкам, и панелью не читается. */\n@media (max-width: 760px) {\n  html:not(.рв-слова-в-сцене) .rv-кадр::before {\n    /* ПЯТНО СТАЛО ЛЕГЧЕ И ПЕРЕСТАЛО БЫТЬ ЧЁРНЫМ.\n\n       Стояло восемьдесят два процента почти чистого чёрного в центре\n       кадра. По задаче это подложка под слова, по факту - чёрная\n       заслонка на четыре пятых экрана: мир за ней не виден вовсе, и\n       владелец прочёл это как «фон слишком чёрный, некрасивый,\n       неживой». Он прав: неживое там не небо, а вот это пятно.\n\n       Теперь оно синее, а не чёрное, и вдвое легче. Синий держит\n       глубину (глаз читает его как воздух между собой и предметом),\n       чёрный держит только черноту. Контраст текста добирается тем,\n       что заодно снят чёрный подпал под буквами, а сами буквы стали\n       плотнее. */\n    background: radial-gradient(\n      122% 54% at 50% 52%,\n      rgba(8, 12, 30, .58) 0%,\n      rgba(8, 12, 30, .50) 44%,\n      rgba(8, 12, 30, .30) 66%,\n      rgba(8, 12, 30, .10) 84%,\n      rgba(8, 12, 30, 0) 100%\n    );\n  }\n  /* Днём подложка СВЕТЛАЯ. Тёмное пятно на светлой странице это не\n     подложка, а заслонка: она закрывала собой всю объёмную сцену, и\n     владелец увидел ровно это - «затемнение перекрывает 3D модель». */\n  html:not(.рв-слова-в-сцене):root[data-тема=\"светлая\"] .rv-кадр::before {\n    background: radial-gradient(\n      122% 54% at 50% 52%,\n      rgba(238, 241, 251, .80) 0%,\n      rgba(238, 241, 251, .68) 44%,\n      rgba(238, 241, 251, .40) 66%,\n      rgba(238, 241, 251, .14) 84%,\n      rgba(238, 241, 251, 0) 100%\n    );\n  }\n}\n/* Первый экран подложки не просит: там решётка сети тусклая, а\n   подложка съела бы её единственную выразительность. */\n\n/* ── Колонка слов и место мира ─────────────────────────────────\n   На широком экране блоки фактов расходились в три колонки шириной до\n   760 точек и доставали до планеты: подпись про операторов ложилась\n   прямо на спутник, а карточка «Россия» - на кромку планеты.\n   Подложка спасает читаемость, но не спасает картину: слова и мир\n   спорят за одно место.\n\n   Делим кадр честно: слева слова, справа мир. Две колонки вместо трёх\n   при том же размере шрифта - блоки становятся уже и выше, зато\n   правая половина кадра остаётся миру целиком.\n\n   Порог 1000 точек, а не 760: между ними кадр ещё слишком узок, чтобы\n   делить его пополам, и там блоки продолжают занимать всю ширину. */\n@media (min-width: 1000px) {\n  .rv-станции, .rv-тех, .rv-доки {\n    grid-template-columns: repeat(2, minmax(0, 1fr));\n    max-width: min(560px, 42vw);\n  }\n  .rv-звено { max-width: min(560px, 42vw); }\n  .rv-слой .rv-сноска { max-width: min(52ch, 42vw); }\n}\n\n/* ══════════════════════════════════════════════════════════════\n   ЕДИНЫЙ ЗАКОН ПОЯВЛЕНИЯ\n\n   До сих пор каждый акт распоряжался своим текстом сам, и на стыках\n   это было видно: текст ушедшего акта ещё стоял в кадре, пока\n   поднималась сцена следующего. Семь актов вели себя семью способами,\n   и лента переставала читаться единым фильмом.\n\n   Закон один на все акты и держится на той же величине, что и сцены, -\n   на доле хода --д. Слой проявляется в первой десятой хода и уходит в\n   последней. Никаких «появлений в окне»: величина обратима, и вверх\n   лента идёт ровно так же, как вниз.\n\n   Правило включается признаком rv-плёнка-идёт, который ставит\n   rv-motion.js. Без скрипта закона нет вовсе, и текст просто стоит на\n   месте: невидимый сайт из-за неприехавшего файла недопустим.\n   ══════════════════════════════════════════════════════════════ */\n.rv-плёнка-идёт .rv-акт {\n  /* Полосы входа и выхода узкие намеренно. С широкими (десятая часть\n     хода) текст держался в кадре меньше, и на стыках появлялись кадры,\n     где сцена уже сменилась, а слов ещё нет: пустой экран читается\n     поломкой. Сейчас проявление занимает первые четыре сотых хода и\n     уход - последние четыре. */\n  /* ДВА ИСТОЧНИКА ВИДИМОСТИ, И БЕРЁТСЯ БОЛЬШИЙ.\n\n     Первый - доля хода. Она честно ведёт текст, пока кадр прилип к\n     верху экрана. Но ход НАЧИНАЕТСЯ только с прилипания: пока акт\n     подъезжает снизу, доля ровно ноль, а кадр уже на экране. Целый\n     экран прокрутки на каждой из семи границ текст стоял невидимым\n     над живой сценой, и это ровно то, что видно как «долгий чёрный\n     экран между блоками».\n\n     Второй - положение секции на экране: подход и уход. По ним текст\n     выводится ЗАРАНЕЕ и убирается ПОЗЖЕ, поэтому на границе два\n     соседних акта перекрываются, а не гаснут оба разом. Они стоят на\n     разных половинах экрана и друг другу не мешают.\n\n     Берём максимум, а не сумму: складывать прозрачности значит\n     получить полтора и потерять оба перехода. */\n  /* ПО СЫРОЙ ДОЛЕ, А НЕ ПО СГЛАЖЕННОЙ. Сглаженную слушает камера, и\n     это верно: рывок колеса не обязан становиться рывком кадра. Но\n     липкий кадр отпускается по настоящей прокрутке, и на быстром\n     листании две величины расходятся - кадр уже едет наверх, а слова\n     на нём ещё в полную силу (см. rv-motion.js, «СЫРАЯ ДОЛЯ»). */\n  --вход: max(\n    clamp(0, calc((var(--дс, var(--д, 0)) - 0.008) * 26), 1),\n    clamp(0, calc((var(--подход, 0) - 0.28) * 2.6), 1)\n  );\n  /* ── НА ВЫХОДЕ БЕРЁТСЯ МЕНЬШИЙ, А НЕ БОЛЬШИЙ ─────────────────\n     На входе максимум правилен: слова обязаны показаться от любой из\n     двух причин, и чем раньше, тем лучше.\n\n     На выходе он делал ровно обратное задуманному. Кадр липкий: когда\n     секция кончается, он отлипает и уезжает наверх вместе со всем, что\n     в нём. Признак `--уход` про это и говорит - он падает до нуля,\n     пока кадр ещё на экране. А признак по доле держал единицу почти до\n     самого конца акта, и максимум из двух оставлял слова и кнопки\n     ПОЛНОСТЬЮ НЕПРОЗРАЧНЫМИ всю дорогу наверх.\n\n     Замер это показал числом. Верх кнопок первого экрана: 636, 522,\n     443, 182, 77, -322, -721 точки - тысяча триста точек хода поперёк\n     живой сцены, и непрозрачность всё это время ровно единица.\n\n     Владелец: «кнопки не должны вместе с нашим пролистыванием уезжать\n     наверх поверх всей сцены, они просто должны затухнуть на месте».\n\n     Меньший из двух: слова гаснут по той причине, которая сработала\n     ПЕРВОЙ. Кадр начал отлипать - слов на нём уже нет. */\n  --выход: min(\n    clamp(0, calc((0.985 - var(--дс, var(--д, 0))) * 26), 1),\n    /* ── ГАСНЕТ В МИГ, КОГДА КАДР ТРОГАЕТСЯ ──────────────────────\n       Окно было широким (0.12 и 1.7): гашение растягивалось на шестьсот\n       точек прокрутки, и всё это время слова с кнопками ехали наверх\n       поперёк живой сцены. Замер телефона: кнопки первого экрана\n       проходили 451 точку, оставаясь видимыми.\n\n       Владелец: «НИ ОДНА КНОПКА на сайте не уходит наверх, она на своём\n       месте появляется и так же исчезает».\n\n       Признак `--уход` держит единицу ровно пока кадр прилип, и\n       начинает падать в тот кадр, когда кадр тронулся. Узкое окно у\n       самой единицы и означает «гаснет на месте»: к тому времени, когда\n       кадр проехал шестьдесят точек, показывать уже нечего. */\n    clamp(0, calc((var(--уход, 1) - 0.93) * 14), 1)\n  );\n  --вид: min(var(--вход), var(--выход));\n}\n/* Первый экран стоит до всякой прокрутки: он и есть крючок. */\n/* ── БЛОК СТОИТ НА ЭКРАНЕ, ПОКА КАДР УЕЗЖАЕТ ───────────────────\n   Липкий кадр отлипает на последнем экране акта и уносит с собой всё,\n   что на нём стоит. Замер телефона: кнопки первого экрана проходили по\n   экрану 443-484 точки, оставаясь видимыми. Владелец: «НИ ОДНА КНОПКА\n   на сайте не уходит наверх, она на своём месте появляется и так же\n   исчезает».\n\n   Гашение по времени лечит это наполовину: чем быстрее человек крутит,\n   тем больше кадр успевает проехать за то же гашение. Здесь лечится\n   причина. Признак `--уход` это ровно доля выезда: единица, пока кадр\n   прилип, ноль, когда кадр ушёл на целый экран вверх. Значит кадр уехал\n   на (1 - уход) экрана, и сдвиг блока вниз ровно на столько же\n   оставляет блок стоять на месте по экрану.\n\n   Гашение идёт своим чередом поверх этого: блок гаснет стоя. */\n.rv-плёнка-идёт .rv-акт > .rv-кадр > .rv-слой {\n  /* --проём это поправка самого акта: единица у всех, кроме прокола,\n     где слова обязаны уйти с экрана в миг прохода насквозь. Умножение,\n     а не второе правило: два правила на одно свойство всегда кончаются\n     тем, что побеждает не то, которое нужно. */\n  opacity: calc(var(--вид) * var(--проём, 1));\n  transform: translate3d(0, calc((1 - var(--вид)) * 20px\n                                 + (1 - var(--уход, 1)) * 100dvh), 0);\n}\n\n/* ── Карточки как плиты, а не как прямоугольники ───────────────\n   Карточка была ровной заливкой с кромкой. Рядом с железом станций и\n   щита это читается наклейкой: у всего вокруг есть свет и объём, а у\n   неё нет. Добавляем ровно то, что делает плиту плитой: блик по\n   верхней кромке, падение света вниз и тень под ней. Цвет, кромка и\n   отступы не меняются - это уже выверено. */\n.rv-станции li, .rv-тех li, .rv-док, .rv-орбита {\n  /* Первый слой - СВЕТ СЦЕНЫ. Переменные --св-* пишет rv-плиты.js:\n     цвет и сила главного источника акта (планета, щит, ворота) и\n     знак стороны, с которой он стоит относительно колонки слов.\n     Без модуля сила равна нулю, и слой прозрачен: наклейкой карточка\n     не становится, просто не ловит свет. Угол считается от знака:\n     свет справа даёт градиент от правой кромки к левой. */\n  background:\n    linear-gradient(calc(180deg + 90deg * var(--св-знак, 1)),\n      rgba(var(--св-цвет, 138, 156, 255), calc(.13 * var(--св-сила, 0))) 0%,\n      rgba(var(--св-цвет, 138, 156, 255), calc(.05 * var(--св-сила, 0))) 40%,\n      rgba(150, 172, 255, 0) 78%),\n    linear-gradient(180deg,\n      rgba(150, 172, 255, .075) 0,\n      rgba(150, 172, 255, .018) 38%,\n      rgba(8, 11, 24, 0) 100%),\n    var(--rv-плита);\n  /* Левая кромка плиты СВЕТИТСЯ, а не просто окрашена. Разница видна\n     сразу: окрашенная кромка читается рамкой наклейки, светящаяся -\n     подсветкой на корпусе прибора. Сила берётся из той же величины,\n     что и неон заголовка, поэтому плиты разгораются вместе с ним, а\n     не живут своей жизнью. */\n  /* ЧЁРНОГО ПОДПАЛА ПОД ПЛИТОЙ БОЛЬШЕ НЕТ.\n\n     Стояло восемнадцать точек вниз, сорок размытия, почти чёрный. На\n     тёмном фоне такая тень не даёт ничего - чёрное по чёрному, - а на\n     светлом превращается в серую грязь под каждой карточкой. Владелец\n     назвал это точно: дешёвые уродские тени.\n\n     Настоящий прибор отделяется от фона не подпалом, а КРОМКОЙ и\n     собственной подсветкой. Остаётся тонкая светлая линия по верхнему\n     краю (так ловит свет фаска корпуса) и свечение левой кромки - оно\n     идёт от той же величины, что неон заголовка, поэтому плиты\n     разгораются вместе с ним. */\n  /* Фаска сверху и кромка со стороны света разгораются с силой\n     источника: у прибора, стоящего рядом с планетой, ребро ловит её. */\n  box-shadow:\n    inset 0 1px 0 rgba(196, 210, 255, calc(.12 + .18 * var(--св-сила, 0))),\n    inset calc(var(--св-знак, 1) * -1px) 0 0 rgba(196, 210, 255, calc(.06 + .16 * var(--св-сила, 0))),\n    -1px 0 calc(14px * var(--rv-неон-сила, 1)) -2px rgba(var(--rv-свет-rgb), .65);\n  transition: box-shadow .3s ease, border-left-color .3s ease;\n}\n/* Под пальцем и под указателем плита загорается сильнее. Это не\n   украшение: карточки станций - единственное, что на сайте можно\n   нажать, и отклик обязан быть. */\n.rv-станции li:hover, .rv-тех li:hover, .rv-док:hover, .rv-орбита:hover {\n  border-left-color: rgba(var(--rv-свет-rgb), .95);\n  box-shadow:\n    inset 0 1px 0 rgba(196, 210, 255, .18),\n    -1px 0 22px -2px rgba(var(--rv-свет-rgb), .95),\n    0 0 30px -14px rgba(var(--rv-свет-rgb), .8);\n}\n\n/* ── Слова и плиты как часть сцены ─────────────────────────────\n   Признак rv-плиты на корне ставит rv-плиты.js, когда мир поднят,\n   ступень не нищая и движение не выключено. Он же пишет переменные:\n     --пар-x/--пар-y  инерция слоя от бокового хода камеры, px;\n     --кр             крен камеры, градусы;\n     --св-x/--св-y    точка главного источника акта в px от кадра;\n     --св-сила        вес источника 0..1, --св-цвет его rgb.\n   Без признака ни одно правило ниже не действует, и лента живёт как\n   прежде. В тихом режиме признак не ставится, поэтому спор с правилом\n   про убранное движение не возникает.\n\n   ТРИ ПЛАНА. Слой идёт с инерцией целиком, заголовок отстаёт сильнее,\n   карточки идут ПРОТИВ хода слоя и чуть поворачиваются вместе с креном\n   камеры. Разный ход трёх слоёв и есть глубина: ни один из них по\n   отдельности глубины не даёт. Перехода на transform нет намеренно:\n   значения обновляются покадрово, переход только добавил бы запаздывание. */\n/* Правила `perspective: 1400px` тут больше нет, и это снос МЁРТВОГО\n   правила, а не смена числа. Оно набрано весом (0,2,1) против (0,4,1) у\n   правила слоя в rv-слово.css и проигрывало ему всегда, несмотря на то\n   что rv.css грузится позже: живым значением было 1150, а 1400 стояло\n   ловушкой для того, кто станет искать, откуда берётся перспектива.\n   Один объектив на кадр теперь объявлен в одном месте - rv-слово.css,\n   и берётся он из живого поля камеры (--rv-перспектива). */\nhtml.rv-плиты.rv-плёнка-идёт .rv-акт > .rv-кадр > .rv-слой {\n  transform: translate3d(var(--пар-x, 0px),\n                         calc((1 - var(--вид)) * 20px + var(--пар-y, 0px)\n                              + (1 - var(--уход, 1)) * 100dvh), 0);\n}\nhtml.rv-плиты .rv-слой > .rv-заг {\n  transform: translate3d(calc(var(--пар-x, 0px) * .4), calc(var(--пар-y, 0px) * .4), 0);\n}\nhtml.rv-плиты .rv-слой > .rv-сноска {\n  transform: translate3d(calc(var(--пар-x, 0px) * -.3), calc(var(--пар-y, 0px) * -.3), 0);\n}\nhtml.rv-плиты .rv-станции li, html.rv-плиты .rv-тех li,\nhtml.rv-плиты .rv-док, html.rv-плиты .rv-орбита, html.rv-плиты .rv-шаги li {\n  transform: translate3d(calc(var(--пар-x, 0px) * -.35), calc(var(--пар-y, 0px) * -.35), 0)\n             rotateY(calc(var(--кр, 0) * 1deg));\n}\n/* Свет источника на всей колонке: широкое пятно из точки планеты или\n   щита, под словами и над подложкой. Пятно широкое намеренно: узкое\n   лежало бы там, где источник, а он в правой половине кадра, и до\n   колонки слов не доставало бы. */\nhtml.rv-плиты .rv-слой::after {\n  content: \"\";\n  position: absolute; inset: 0;\n  pointer-events: none;\n  z-index: -1;\n  background: radial-gradient(\n    min(58vw, 680px) min(62vh, 560px) at var(--св-x, 80%) var(--св-y, 30%),\n    rgba(var(--св-цвет, 138, 156, 255), calc(.20 * var(--св-сила, 0))) 0%,\n    rgba(var(--св-цвет, 138, 156, 255), calc(.08 * var(--св-сила, 0))) 45%,\n    rgba(5, 6, 12, 0) 70%);\n}\n/* Днём свет чернильный и вдвое слабее: на светлом фоне светлое пятно\n   не читается вовсе, а тёмно-синее читается тенью от предмета, то есть\n   тем самым признаком, что предмет в кадре есть. */\nhtml.rv-плиты[data-тема=\"светлая\"] .rv-слой::after {\n  background: radial-gradient(\n    min(58vw, 680px) min(62vh, 560px) at var(--св-x, 80%) var(--св-y, 30%),\n    rgba(42, 63, 156, calc(.10 * var(--св-сила, 0))) 0%,\n    rgba(42, 63, 156, calc(.04 * var(--св-сила, 0))) 45%,\n    rgba(238, 241, 251, 0) 70%);\n}\n/* ПОЛНАЯ СТУПЕНЬ: под карточкой в мире стоит стеклянная плита\n   (rv-плиты.js рисует её тем же холстом), и разметка отдаёт ей тело:\n   заливка карточки становится тоньше, а сквозь неё виден размытый мир.\n   Признак rv-плиты-есть на акте ставится только когда плиты под его\n   карточками действительно нарисованы: без него заливка остаётся\n   прежней, и текст не повисает над голым космосом. Днём стекла нет:\n   дневная плита это карточка, и размытие под ней снято намеренно.\n   Выбранная станция держит свою заливку. */\nhtml.rv-плиты[data-ступень=\"2\"]:not([data-тема=\"светлая\"]) .rv-акт.rv-плиты-есть :is(.rv-станции li, .rv-тех li, .rv-док, .rv-орбита):not(.rv-станция-выбрана) {\n  /* .46, а не .30: с .30 подпись на плите падала с 6.5 до 4.2 по\n     отношению яркостей, стекло светлее наклейки. Заодно тихий текст\n     на стекле плотнее (.78 вместо .62): у лежащего на свету прибора\n     подписи не блёкнут, иначе свет их съедает. */\n  background-color: rgba(10, 14, 32, .46);\n  --rv-текст-тихо: rgba(232, 234, 246, .78);\n  -webkit-backdrop-filter: blur(12px) saturate(1.3);\n  backdrop-filter: blur(12px) saturate(1.3);\n}\n/* СРЕДНЯЯ СТУПЕНЬ: плит в мире нет, но стекло под словами есть. Это\n   ступень всех телефонов (узкий экран даёт её всегда), и именно на\n   телефоне колонка слов ложится прямо на станцию: сквозь заливку в\n   .72 решётка щита рубки просвечивала между строк тарифа, и буквы\n   читались поверх линий. Размытие в восемь точек убирает линии и\n   оставляет свет и цвет мира за карточкой: карточка становится\n   стеклом прибора, а не наклейкой с дыркой. Заливка не трогается,\n   контраст подписи остаётся прежним. Три-пять карточек в кадре, на\n   телефоне это одна-две миллисекунды, что и заложено в цену ступени.\n   Днём стекла нет по той же причине, что и на полной ступени. */\nhtml.rv-плиты[data-ступень=\"1\"]:not([data-тема=\"светлая\"]) :is(.rv-станции li, .rv-тех li, .rv-док, .rv-орбита) {\n  -webkit-backdrop-filter: blur(8px) saturate(1.2);\n  backdrop-filter: blur(8px) saturate(1.2);\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .rv-плёнка-идёт .rv-акт > .rv-кадр > .rv-слой {\n    opacity: 1;\n    transform: none;\n  }\n}\n\n/* ── Стена блокпоста ───────────────────────────────────────────\n   Плита лежит ЗА холстом акта и живёт по той же доле хода. Камера в\n   этом акте отъезжает, и решётка оказывается стеной, поэтому плита\n   идёт от крупного к общему: масштаб падает, а не растёт.\n\n   Появляется она не сразу: первые сотые хода человек ещё видит сеть из\n   прошлого акта, и стена, включённая раньше, оборвала бы переход. */\n.rv-плита {\n  position: absolute;\n  inset: 0;\n  width: 100%;\n  height: 100%;\n  object-fit: cover;\n  object-position: 50% 44%;\n  pointer-events: none;\n  opacity: calc(clamp(0, calc((var(--д, 0) - 0.05) * 4.5), 1) * 0.94);\n  transform: translate3d(0, calc((0.5 - var(--д, 0)) * 3.5vh), 0)\n             scale(calc(1.16 - var(--д, 0) * 0.14));\n  transform-origin: 50% 46%;\n}\n@media (prefers-reduced-motion: reduce) {\n  .rv-плита { transform: none; opacity: .9; }\n}\n/* Днём стена переворачивается по яркости ТЕМ ЖЕ фильтром, что и холст\n   мира. Картинка лежит внутри кадра акта, и дневная инверсия мира её\n   не касалась: на белой странице оставалась серо-бурая полоса с\n   оранжевыми линиями. Стена считана под ночь, и второй раз считать её\n   под день незачем: перевёрнутая, она даёт светлый бетон с чернильными\n   лучами, ровно как мир вокруг неё. Прозрачность ниже ночной: днём\n   стена подложка под чтение, а не герой кадра. */\n/* Стена блокпоста это снимок, и перевёрнутый снимок читается негативом.\n   Днём её осветляем и приспускаем насыщенность: получается бледный\n   бетон под чтением, а не вывернутая картинка. */\n:root[data-тема=\"светлая\"] .rv-плита {\n  filter: brightness(2.1) contrast(.62) saturate(.55);\n  opacity: calc(clamp(0, calc((var(--д, 0) - 0.05) * 4.5), 1) * 0.5);\n}\n@media (prefers-reduced-motion: reduce) {\n  :root[data-тема=\"светлая\"] .rv-плита { opacity: .7; }\n}\n\n/* ══════════════════════════════════════════════════════════════\n   РЕЙКА ЛЕНТЫ\n\n   Восемь меток у правой кромки, по одной на акт. Пройденное залито,\n   текущее горит и подписано, будущее пусто. Ширина восемь точек: этого\n   хватает, чтобы рейку заметили, и мало, чтобы она отняла у мира\n   полосу кадра.\n\n   Подпись выезжает только у текущей метки и только под указателем: на\n   сайте, где слова живут слева, восемь подписей справа - это вторая\n   колонка текста, которой здесь не место.\n   ══════════════════════════════════════════════════════════════ */\n.rv-рейка {\n  position: fixed;\n  right: max(10px, env(safe-area-inset-right));\n  top: 50%; transform: translateY(-50%);\n  z-index: 42;\n  display: grid; gap: 10px;\n  padding: 10px 6px;\n}\n.rv-рейка-метка {\n  appearance: none; -webkit-appearance: none;\n  background: none; border: 0; padding: 4px 2px; margin: 0;\n  /* Метка прижата к правой кромке, подпись выведена ИЗ ПОТОКА влево.\n     Пока подпись стояла в потоке, она занимала ширину даже невидимой, и\n     каждая метка отъезжала влево ровно на длину своего слова: рейка\n     шла лесенкой вместо прямой линии. Видно это было только на снимке -\n     в разметке всё «выровнено по правому краю». */\n  position: relative;\n  display: flex; align-items: center; justify-content: flex-end;\n  cursor: pointer;\n  color: var(--rv-текст-очень-тихо);\n  font: 600 10px/1 var(--rv-шрифт); letter-spacing: .18em;\n  text-transform: uppercase;\n}\n/* Сама метка. Полоска, а не точка: полоска умеет ЗАПОЛНЯТЬСЯ по ходу\n   акта, и человек видит не только «где он», но и «сколько идёт». */\n.rv-рейка-метка i {\n  display: block; position: relative;\n  width: 2px; height: 18px; border-radius: 2px;\n  background: rgba(var(--rv-свет-rgb), .22);\n  transition: background-color .25s ease, box-shadow .25s ease, height .25s ease;\n}\n/* Заполнение метки идёт МАСШТАБОМ, а не высотой. Высота на каждом\n   кадре это пересчёт вёрстки восьми элементов шестьдесят раз в\n   секунду; масштаб браузер делает на композиторе, не трогая вёрстку\n   вовсе. Разница на глаз - никакой. */\n.rv-рейка-метка i::after {\n  content: \"\"; position: absolute; left: 0; right: 0; top: 0; height: 100%;\n  border-radius: 2px;\n  background: rgba(var(--rv-свет-rgb), .95);\n  transform-origin: 50% 0;\n  transform: scaleY(var(--ход, 0));\n}\n.rv-рейка-метка.rv-пройден i { background: rgba(var(--rv-свет-rgb), .55); }\n.rv-рейка-метка.rv-идёт i {\n  height: 30px;\n  background: rgba(var(--rv-свет-rgb), .3);\n  box-shadow: 0 0 12px rgba(var(--rv-свет-rgb), .85);\n}\n/* Подпись. Появляется у текущей метки и у той, на которую навели. */\n.rv-рейка-метка em {\n  position: absolute; right: 100%; margin-right: 10px; top: 50%;\n  font-style: normal; opacity: 0; transform: translateY(-50%) translateX(6px);\n  transition: opacity .22s ease, transform .22s ease, color .22s ease;\n  wh ;\n  padding: 0; border: 1px solid var(--rv-кромка); border-radius: 3px;\n  background: var(--rv-орган-фон);\n  -webkit-backdrop-filter: blur(6px);\n  backdrop-filter: blur(6px);\n  color: var(--rv-текст-тихо);\n  cursor: pointer;\n  /* Полоски раздаёт колонка с ЗАЗОРОМ, а не сетка. Сетка делит высоту\n     кнопки на три ряда и разносит полоски на четырнадцать точек, а\n     крест собирается сдвигом на шесть: получался не крест, а галка.\n     При зазоре шаг равен сдвигу по построению. */\n  display: flex; flex-direction: column; align-items: center; justify-content: center;\n  gap: 4px;\n  transition: color .2s, border-color .2s, box-shadow .2s, background-color .2s;\n}\n.rv-бургер i {\n  display: block; width: 18px; height: 2px; border-radius: 2px;\n  background: currentColor;\n  transition: transform .38s cubic-bezier(.2,.8,.2,1), opacity .2s ease, width .38s cubic-bezier(.2,.8,.2,1);\n}\n.rv-бургер:hover, .rv-бургер:focus-visible {\n  color: #FFFFFF;\n  border-color: rgba(var(--rv-свет-rgb), .9);\n  box-shadow: 0 0 26px -6px rgba(var(--rv-свет-rgb), .95);\n}\n.rv-меню-открыто .rv-бургер i:nth-child(1) { transform: translateY(6px) rotate(45deg); }\n.rv-меню-открыто .rv-бургер i:nth-child(2) { opacity: 0; transform: scaleX(.2); }\n.rv-меню-открыто .rv-бургер i:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }\n\n.rv-мп-пелена {\n  position: fixed; inset: 0; z-index: 97;\n  background: rgba(2, 3, 8, .62);\n  -webkit-backdrop-filter: blur(2px);\n  backdrop-filter: blur(2px);\n  opacity: 0; transition: opacity .3s ease;\n}\n.rv-меню-открыто .rv-мп-пелена { opacity: 1; }\n\n/* ЗАКРЫТОЕ ЗАКРЫТО НАСОВСЕМ.\n\n   Панель меню и форма объявлены своим display (flex и grid), а правило\n   браузера [hidden]{display:none} слабее любого авторского. Поэтому\n   закрытая форма продолжала лежать поверх страницы во весь экран и\n   съедала КАЖДОЕ нажатие: человек закрывал её и упирался в мёртвый\n   сайт. Панель тем же образом отнимала левые 380 точек. Поймано\n   браузер
