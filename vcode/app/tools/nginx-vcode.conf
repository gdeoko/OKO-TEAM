# V.LIONOFF · nginx. Копируется в /etc/nginx/sites-available/vcode и линкуется.
# Сертификат выпускается certbot: certbot --nginx -d lionoff.okoteam.top

server {
  listen 80;
  listen [::]:80;
  server_name lionoff.okoteam.top;
  location ^~ /.well-known/acme-challenge/ { root /var/www/vcode/public_html; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name lionoff.okoteam.top;

  root /var/www/vcode/public_html;
  index index.html;

  ssl_certificate     /etc/letsencrypt/live/lionoff.okoteam.top/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/lionoff.okoteam.top/privkey.pem;

  client_max_body_size 32m;
  charset utf-8;

  # Телеграм открывает мини-приложение во фрейме: запрет фреймов снимаем,
  # но только для самого Телеграма.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "frame-ancestors https://web.telegram.org https://*.telegram.org 'self'" always;

  # База, исходники и секреты наружу не отдаются никогда.
  location ~ ^/(data|core|db|content|bot|tools)/ { deny all; return 404; }
  location ~ /\.(?!well-known) { deny all; return 404; }

  # Бот: вебхук Телеграма.
  location = /api/bot { fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    include snippets/fastcgi-php.conf;
    fastcgi_param SCRIPT_FILENAME $document_root/api/bot.php; }

  # API приложения: один вход.
  location /api/ {
    rewrite ^/api/(.*)$ /api/index.php?r=$1 last;
  }

  location ~ ^/api/(index|admin)\.php$ {
    fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    include snippets/fastcgi-php.conf;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_read_timeout 120;
  }

  location ~ \.php$ {
    fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    include snippets/fastcgi-php.conf;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
  }

  # Статика приложения кэшируется, index.html — нет: обновление должно доезжать.
  location ~* \.(css|js|png|jpg|jpeg|svg|webp|woff2|mp3)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }
  location = /index.html { add_header Cache-Control "no-store"; }

  location / { try_files $uri $uri/ /index.html; }

  access_log /var/log/nginx/vcode.access.log;
  error_log  /var/log/nginx/vcode.error.log;
}
