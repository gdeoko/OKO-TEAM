<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Нет соединения — КЦ «Музыкальный Мир»</title>
<style>
  :root{--bg:#FFFCF5;--panel:#fff;--text:#1B2340;--dim:#4a4535;--gold:#C9A84C;--gold2:#b8923a;--brd:#e7ddc7}
  @media (prefers-color-scheme: dark){:root{--bg:#0b0a0d;--panel:#141218;--text:#f3ecd9;--dim:#b9b1a0;--gold:#e8c25a;--gold2:#e8c25a;--brd:rgba(255,255,255,.1)}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,Segoe UI,Roboto,Manrope,sans-serif;background:var(--bg);color:var(--text);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  .card{max-width:420px}
  .logo{width:88px;height:88px;border-radius:50%;border:2px solid var(--gold);margin:0 auto 20px;display:block;object-fit:contain}
  .ic{width:56px;height:56px;margin:0 auto 16px;color:var(--gold)}
  h1{font-family:Georgia,serif;font-size:1.8rem;margin-bottom:10px;color:var(--gold2)}
  p{color:var(--dim);line-height:1.6;font-size:1rem;margin-bottom:24px}
  button{background:linear-gradient(135deg,#e6c766,#c9a84c);color:#1a1206;border:none;font-weight:800;
    font-size:1rem;padding:14px 34px;border-radius:999px;cursor:pointer;box-shadow:0 10px 26px rgba(201,168,76,.4)}
  button:active{transform:scale(.97)}
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/assets/img/logo_muzmir_256.png" alt="КЦ «Музыкальный Мир»">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 1l22 22M16.7 16.7A6 6 0 0 1 9 9M5 12.5a10 10 0 0 1 4-2.3M2 8.8a15 15 0 0 1 4.2-2.6M20.9 8.8a15 15 0 0 0-5-3.1M12 20h.01"/></svg>
    <h1>Нет соединения с интернетом</h1>
    <p>Похоже, пропала связь. Проверьте подключение и попробуйте снова — Культурный центр «Музыкальный Мир» ждёт Вас.</p>
    <button onclick="location.reload()">Повторить</button>
  </div>
</body>
</html>
