# КЦ «Музыкальный Мир» — прод-конфиг nginx.
# web-root = public/, фронт-контроллер = public/index.php.
# ВАЖНО: блок `location ^~ /api/` обязателен — иначе URL вида
# /api/v1/webhook_yukassa.php уходят в fastcgi по несуществующему пути
# public/api/v1/*.php (файлы лежат вне public/) и отдают nginx-404.
# Префикс ^~ имеет приоритет над regex `\.php$`, поэтому и /api/v1/foo,
# и /api/v1/foo.php корректно проходят через index.php-роутер.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name xn----7sbugdeiegh1b0a9hen.xn--p1ai www.xn----7sbugdeiegh1b0a9hen.xn--p1ai 176.124.200.169 _;
  root /var/www/muzmir/public;
  index index.php index.html;
  charset utf-8;
  client_max_body_size 100M;

  location / { try_files $uri $uri/ /index.php?$query_string; }
  # Все /api/* — только через фронт-контроллер (файлы api/v1/*.php вне public/).
  location ^~ /api/ { try_files $uri $uri/ /index.php?$query_string; }
  location ~ \.php$ { include snippets/fastcgi-php.conf; fastcgi_pass unix:/run/php/php8.3-fpm.sock; fastcgi_read_timeout 300; }

  location ~ ^/(data|core|cron|templates|vendor|agent|docs|scripts)/ { deny all; }
  location = /config.php { deny all; }
  location = /config.local.php { deny all; }
  location ~ /\.(?!well-known) { deny all; }
  location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff2?)$ { expires 30d; add_header Cache-Control "public"; }
}
# HTTPS-блок добавляет certbot автоматически (--nginx --redirect).
